 요청 또는 심사 진행 판정", "steps": [{"node": "Parse", "what": "스캔하거나 사진으로 찍은 청구 서류를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "청구서, 진단서, 영수증, 세부내역서, 계약 정보로 나눕니다"}, {"node": "Extract ×3", "what": "진단서, 영수증, 세부내역서에서 환자·진료일·병원·진단명·금액을 뽑습니다"}, {"node": "Merge", "what": "청구번호 기준으로 세 서류의 결과를 한 줄로 합칩니다"}, {"node": "Match", "what": "합친 결과를 보험계약 정보와 짝지어 가입자와 계약을 확인합니다"}, {"node": "Validate", "what": "값이 서로 다르거나 서류가 빠진 청구를 노랑·빨강으로 표시합니다"}, {"node": "Instruct", "what": "빠진 서류와 다른 값을 정리해 보완 요청 문장이나 심사 진행 의견을 씁니다"}], "problem": "보상 담당자 한 명이 하루에도 수십 건의 청구를 받고, 건마다 네다섯 장의 서류를 번갈아 보며 같은 값을 눈으로 맞춥니다. 확인이 늦어지면 고객에게 보완 서류를 다시 받느라 지급이 며칠씩 밀리고, 불일치를 놓친 채 심사로 넘기면 잘못된 금액이 지급될 수 있습니다.", "why": "이 일은 '서류가 다 있는가'와 '값이 서로 같은가'를 청구마다 똑같은 기준으로 따지는 일이라, 사람의 눈이나 한 번의 챗봇 질문보다 단계가 정해진 흐름이 맞습니다. Studio는 서류별로 뽑은 값을 청구번호 기준으로 한 행에 묶어 빠진 서류와 다른 값이 바로 드러나고, 뽑은 값마다 원문 위치가 남아 담당자가 어느 서류의 어느 칸을 봐야 하는지 바로 확인할 수 있습니다.", "difficulty": "심화"}, {"uid": "U130", "i": 129, "no": 19, "pattern": "대조", "industry": "금융·대출", "dept": ["법무·준법"], "task": "과거 규정과 현행 규정의 달라진 곳을 추적한다", "title": "규정 개정에 따른 사내 조항 찾기", "oneliner": "바뀐 상위 규정 때문에 고쳐야 할 사내 조항을 찾습니다.", "story": "금융회사의 준법 담당자는 정부나 감독당국의 규정이 개정되면 우리 회사 내부 규정 중 무엇을 고쳐야 하는지 찾아야 합니다. 개정 전과 후를 비교한 뒤, 사내 규정과 지침을 처음부터 훑어 관련 조항을 골라 '신구 대비표'로 정리합니다. 사내 조항이 상위 조문 번호를 적지 않고 내용만 비슷하게 쓰는 경우가 많아 찾기 어렵고, 빠뜨리면 규정 위반이 됩니다. 워크플로우가 바뀐 조문을 뽑아 사내 조항과 내용으로 짝짓고 영향 조항 후보와 대비표 초안을 만들어 줍니다.", "terms": [{"term": "상위 규정", "desc": "회사 규칙보다 위에 있는, 정부나 감독당국이 정한 규칙입니다. 회사 규칙은 이것을 따라야 합니다."}, {"term": "개정 고시", "desc": "규정이 바뀌었다고 공식적으로 알리는 글입니다."}, {"term": "신구 대비표", "desc": "바뀌기 전(구)과 바뀐 후(신) 내용을 나란히 놓고 비교하는 표입니다."}, {"term": "조문 이동", "desc": "내용은 그대로인데 조항 번호만 바뀐 경우입니다. 예를 들어 제5조가 제7조로 옮겨진 것입니다."}], "docs": [{"name": "상위 규정 개정 고시(개정 전·후)", "desc": "바뀐 조문과 바뀐 내용을 확인합니다."}, {"name": "사내 규정·지침", "desc": "회사 내부 규칙으로, 상위 규정 변경의 영향을 받는 조항을 찾습니다."}, {"name": "신구 대비표 양식", "desc": "결과를 정리할 빈 표입니다."}], "fields": ["조문 번호", "바뀌기 전 내용", "바뀐 후 내용", "변경 종류(내용 변경 또는 번호만 이동)", "관련된 사내 조항"], "key": "조항 주제. 번호가 아니라 '무슨 내용을 다루는 조항인지'로 상위 조문과 사내 조항을 잇습니다.", "check": "바뀐 상위 조항을 사내 규정 조항과 내용으로 비교해 고쳐야 할 조항 후보를 정합니다.", "exceptions": ["사내 조항이 상위 조문 번호를 적지 않고 내용만 같게 써 있음", "상위 규정이 번호만 제5조에서 제7조로 바뀌고 내용은 그대로임", "사내 규정은 고쳤는데 그 규정이 참조하는 하위 지침은 그대로라 서로 충돌함"], "output": "영향받는 사내 조항 후보 목록 + 신구 대비표 초안", "steps": [{"node": "Parse", "what": "개정 고시와 사내 규정 문서를 글자와 표로 읽습니다"}, {"node": "Extract ×2", "what": "개정 고시에서는 바뀐 조문을, 사내 규정에서는 조항별 내용을 뽑습니다"}, {"node": "Match", "what": "바뀐 상위 조문과 내용이 비슷한 사내 조항을 짝지어 찾습니다"}, {"node": "Validate", "what": "내용이 실제로 바뀌었는지, 번호만 옮겨졌는지, 충돌이 있는지 판정합니다"}, {"node": "Instruct", "what": "조항별로 무엇을 고쳐야 하는지 설명과 대비표 문장을 씁니다"}, {"node": "Export", "what": "영향 조항 목록과 신구 대비표를 저장합니다"}], "problem": "개정 고시(규정이 바뀌었다고 알리는 글)에는 바뀐 조문만 적혀 있고, 사내 규정과 지침은 수십 개 문서에 흩어져 있어 담당자가 전부 열어 보며 비슷한 문장을 찾습니다. 번호만 옮겨진 조문과 내용이 실제로 바뀐 조문을 가려내려면 개정 전후 문장을 한 줄씩 대조해야 하고, 이 작업은 개정이 있을 때마다 처음부터 반복됩니다. 사내 규정 하나를 고치면 그 규정을 따르는 하위 지침(세부 절차를 정한 문서)도 함께 봐야 하는데, 연결 관계가 문서에 적혀 있지 않아 놓치기 쉽습니다.", "why": "이 업무는 조문 번호가 아니라 무슨 내용을 다루는지로 상위 조문과 사내 조항을 이어야 하므로, 사람이 기억에 의존해 찾는 대신 내용을 기준으로 짝짓는 단계(Match)가 따로 있어야 합니다. 짝지은 결과를 내용 변경인지 번호만 이동인지 가리는 검사(Validate)로 넘기면 어느 단계에서 틀렸는지 바로 보이고, 애매한 조항은 추측하지 않고 검토 대상으로 남깁니다. 일반 AI 챗봇에 규정 전체를 넣으면 긴 문서를 다 읽지 못하거나 관련 조항을 빠뜨려도 티가 나지 않습니다.", "difficulty": "입문"}, {"uid": "U131", "i": 130, "no": 204, "pattern": "대조", "industry": "금융·대출", "dept": ["업종 현업"], "task": "구매자금대출 심사에서 계약서, 인보이스, 송금증을 교차 대조한다", "title": "물품 대금 대출 서류 3종 맞추기", "oneliner": "계약서·청구서·송금증의 금액과 받는 사람이 같은지 봅니다.", "story": "은행의 대출 심사 담당자는 회사가 물건을 사는 데 필요한 돈을 빌려줄 때 구매 계약서, 인보이스, 송금증을 함께 받습니다. 세 서류의 금액과 거래 상대가 서로 맞아야 대출금이 실제 물건값으로 쓰였다고 볼 수 있습니다. 나눠서 내는 계약이거나 받는 사람이 다를 때는 숫자만 봐서는 문제를 알아채기 어렵습니다. 워크플로우가 세 서류의 값을 뽑아 계약 조건과 비교하고 승인할지 보완을 요청할지 정리해 줍니다.", "terms": [{"term": "구매자금대출", "desc": "회사가 원료나 물건을 사는 데 쓰라고 빌려주는 대출입니다. 실제로 그 용도로 썼는지 서류로 확인합니다."}, {"term": "인보이스", "desc": "물건을 판 쪽이 '얼마를 내 주세요'라고 보내는 청구서입니다."}, {"term": "송금증", "desc": "돈을 누구에게 언제 얼마 보냈는지 은행이 확인해 주는 증명입니다."}, {"term": "선금·잔금", "desc": "물건값을 나눠 낼 때 먼저 내는 돈이 선금, 나중에 내는 나머지가 잔금입니다."}], "docs": [{"name": "구매 계약서", "desc": "누구에게 무엇을 얼마에 사고 어떻게 나눠 낼지 봅니다."}, {"name": "인보이스", "desc": "판매자가 청구한 금액과 판매자 이름을 봅니다."}, {"name": "송금증", "desc": "실제로 돈을 받은 사람과 금액, 날짜를 봅니다."}], "fields": ["거래 당사자", "품목", "계약 금액과 지급 조건(선금/잔금)", "청구 금액과 판매자", "송금 받은 사람·금액·날짜"], "key": "계약 번호(거래 건). 세 서류가 같은 거래인지 이어 줍니다.", "check": "인보이스의 금액·판매자와 송금증의 받는 사람·금액을 계약서 조건과 비교합니다.", "exceptions": ["계약은 1억 원인데 선금 30%만 먼저 보내 송금증에는 3천만 원", "송금 받은 사람이 계약서의 판매자가 아닌 다른 회사", "금액은 같지만 인보이스 품목이 계약서 품목과 다름"], "output": "서류 간 불일치 목록 + 승인/보완 요청", "steps": [{"node": "Parse", "what": "계약서, 인보이스, 송금증을 글자와 표로 읽습니다"}, {"node": "Classify", "what": "세 서류를 종류별로 나눕니다"}, {"node": "Extract ×3", "what": "계약서의 조건, 인보이스의 청구 내용, 송금증의 송금 내용을 뽑습니다"}, {"node": "Merge", "what": "같은 거래의 값을 한 줄로 합칩니다"}, {"node": "Validate", "what": "금액, 받는 사람, 품목이 맞는지 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "분할 지급처럼 정상인 차이인지 판단하고 승인 또는 보완 요청 문장을 씁니다"}], "problem": "구매자금대출(물건 사는 데 쓰라고 빌려주는 대출) 한 건마다 세 서류가 따로 들어오고, 담당자는 서류마다 금액과 상대방 이름을 찾아 표에 옮겨 적은 뒤 눈으로 비교합니다. 인보이스(판 쪽이 보내는 청구서)는 외국어로 되어 있거나 회사마다 양식이 달라 금액과 판매자 위치를 매번 새로 찾아야 합니다. 선금과 잔금(먼저 내는 돈과 나중에 내는 나머지)으로 나눠 내는 계약이면 송금증(돈을 보냈다는 은행 증명) 금액이 계약 금액과 다른 것이 정상이라, 차이가 있을 때마다 계약서 조건을 다시 열어 확인해야 합니다.", "why": "세 서류의 값을 계약 번호로 한 행에 묶으면(Merge) 금액과 받는 사람, 품목이 다른 칸이 바로 드러나므로, 담당자가 표를 만들어 옮겨 적는 단계가 없어집니다. 금액이 다르다는 사실은 규칙 검사(Validate)로 잡고, 그 차이가 선금 지급처럼 정상인지는 계약 조건을 보고 판단하는 맥락 판단(Instruct)에 맡겨 두 단계가 분리됩니다. 뽑은 값마다 어느 서류 어느 위치에서 왔는지 남아 있어, 보완 요청을 보낼 때 근거 대목을 그대로 붙일 수 있습니다.", "difficulty": "입문"}, {"uid": "U132", "i": 131, "no": 24, "pattern": "검증", "industry": "금융·대출", "dept": [], "task": "담보 등기부등본의 권리관계를 분석한다", "title": "부동산 등기부 권리 순서 읽기", "oneliner": "등기부를 읽어 우리 담보보다 앞선 권리가 있는지 봅니다.", "story": "대출을 해 준 금융회사의 담보 관리 담당자는 담보로 잡은 부동산의 등기부등본을 읽고 권리관계를 분석합니다. 우리 회사 담보보다 앞줄에 있는 권리가 있으면 집이 팔렸을 때 우리가 받을 돈이 줄어들기 때문입니다. 등기부에는 이미 지워진 권리가 줄이 그어진 채 남아 있고, 같은 날 여러 권리가 설정되기도 해서 순서를 잘못 읽기 쉽습니다. 워크플로우가 살아 있는 권리만 골라 순위를 정리하고 담보별 위험을 판정해 줍니다.", "terms": [{"term": "담보", "desc": "돈을 못 갚으면 대신 가져갈 수 있도록 잡아 두는 재산입니다."}, {"term": "등기부등본", "desc": "부동산의 주인과 걸려 있는 권리를 나라에 기록한 문서를 떼어 본 것입니다. 갑구에는 소유권, 을구에는 근저당·전세권이 적힙니다."}, {"term": "근저당·채권최고액", "desc": "근저당은 부동산을 담보로 잡았다는 기록이고, 채권최고액은 그 담보로 최대 받을 수 있는 금액입니다."}, {"term": "선순위", "desc": "돈을 돌려받는 줄에서 우리보다 앞에 선 권리입니다."}, {"term": "공동담보", "desc": "대출 하나에 부동산 여러 개를 함께 담보로 잡은 것입니다. 목록이 별도 종이로 붙습니다."}], "docs": [{"name": "등기부등본", "desc": "부동산의 주인과 권리, 설정 순서를 봅니다."}, {"name": "담보 목록", "desc": "회사가 잡은 담보와 우리 권리의 순위를 적은 목록으로, 어느 부동산을 볼지 정합니다."}], "fields": ["소재지(주소)", "소유자", "갑구 권리(소유권·압류)", "을구 근저당·전세권", "설정 순위와 채권최고액"], "key": "부동산 고유번호. 부동산마다 붙는 번호로 등기부와 담보 목록을 잇습니다.", "check": "등기부의 권리 순서를 읽어 우리 담보보다 앞선 권리가 있는지 판정합니다.", "exceptions": ["이미 지워진 근저당이 줄 그어진 채 등기부에 남아 있음", "같은 날 근저당 2건이 설정되어 접수번호로 순서를 가려야 함", "공동담보 목록이 별지로 붙어 다른 부동산까지 묶여 있음"], "output": "담보별 선순위 권리 목록 + 위험 판정", "steps": [{"node": "Parse", "what": "등기부등본을 글자와 표로 읽고 줄 그어진 칸도 표시합니다"}, {"node": "Extract", "what": "갑구와 을구에서 권리 종류, 설정일, 순위, 금액을 뽑습니다"}, {"node": "Match", "what": "부동산 고유번호로 담보 목록의 우리 담보와 짝짓습니다"}, {"node": "Validate", "what": "우리보다 앞선 살아 있는 권리가 있는지 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "위험 판정의 이유를 담보별로 한 문장씩 씁니다"}], "problem": "담당자가 관리하는 담보 부동산은 수백 건이고, 등기부등본(부동산의 주인과 권리를 기록한 문서를 떼어 본 것)은 정기적으로 다시 떼어 전부 다시 읽어야 합니다. 갑구와 을구(소유권과 담보 권리가 각각 적히는 칸)를 오가며 순위와 금액을 엑셀에 옮겨 적는데, 접수번호(등기소가 신청을 받은 순서대로 붙이는 번호)가 작은 글씨로 적혀 있어 같은 날 설정된 권리의 순서를 헷갈리기 쉽습니다. 공동담보 목록(대출 하나에 여러 부동산을 함께 담보로 잡았을 때 붙는 목록)이 별지로 붙으면 다른 부동산의 권리까지 함께 봐야 하므로 한 건에 드는 시간이 크게 늘어납니다.", "why": "등기부는 정해진 공식 양식이라 읽는 규칙이 일정하므로, 줄 그어진 권리는 빼고 접수번호 순으로 순위를 매긴다는 기준을 한 번 정해 두면 문서가 들어올 때마다 똑같이 적용됩니다. 읽기(Parse)와 뽑기(Extract), 판정(Validate)이 노드로 나뉘어 있어 줄 그어진 칸을 못 읽었는지, 순위를 잘못 매겼는지 어느 단계 문제인지 바로 보입니다. 일반 AI 챗봇은 줄이 그어진 글자와 살아 있는 글자를 구분하지 못한 채 답할 수 있어 담보 업무에는 맞지 않습니다.", "difficulty": "입문"}, {"uid": "U133", "i": 132, "no": 15, "pattern": "입력", "industry": "금융·대출", "dept": [], "task": "법원, 검찰, 경찰에서 온 채권 문서를 읽고 업무망에 옮긴다", "title": "법원·수사기관 공문 대장 정리", "oneliner": "법원·검찰·경찰 공문을 사건별로 정리해 대장에 옮깁니다.", "story": "대출을 해 주는 금융회사의 채권 관리 담당자는 법원, 검찰, 경찰에서 오는 공문을 매일 받습니다. 공문마다 사건번호와 회신 기한을 찾아 회사가 가진 채권(돌려받을 돈에 대한 권리) 계좌와 연결해 업무 시스템에 옮겨 적어야 합니다. 기관마다 양식이 다르고 기한이 본문 문장 속에 숨어 있어서 놓치기 쉽고, 기한을 넘기면 법적인 불이익이 생길 수 있습니다. 워크플로우가 공문 종류를 나누고 사건번호와 기한을 뽑아 계좌 목록과 짝지은 뒤 기한이 가까운 건을 표시해 줍니다.", "terms": [{"term": "채권", "desc": "돈을 빌려준 쪽이 '돌려받을 권리'를 말합니다. 여기서는 회사가 고객에게 빌려준 대출 한 건 한 건을 뜻합니다."}, {"term": "여신", "desc": "금융회사가 고객에게 돈을 빌려주는 일 전체를 부르는 말입니다. 반대로 예금을 받는 일은 수신이라고 합니다."}, {"term": "NPL(부실채권)", "desc": "돈을 빌려 간 사람이 제때 갚지 못해 돌려받기 어려워진 대출입니다."}, {"term": "사건번호", "desc": "법원이나 수사기관이 사건마다 붙이는 고유 번호입니다. 같은 사건의 문서를 묶는 이름표 역할을 합니다."}, {"term": "업무망", "desc": "회사 내부 직원만 쓰는 업무 시스템입니다. 공문 내용을 여기에 옮겨 적어야 처리가 시작됩니다."}], "docs": [{"name": "법원 결정문", "desc": "법원이 내린 결정이 적힌 문서로, 사건번호와 대상자, 기일을 확인합니다."}, {"name": "검찰·경찰 공문", "desc": "수사기관이 자료나 회신을 요청하는 문서로, 요청 내용과 회신 기한을 봅니다."}, {"name": "채권 계좌 목록", "desc": "회사가 관리하는 대출 계좌 목록(엑셀)으로, 공문의 대상자와 연결할 계좌를 찾습니다."}], "fields": ["사건번호", "보낸 기관", "대상자 이름", "관련 계좌·채권 정보", "기일과 회신 기한"], "key": "사건번호. 같은 사건의 문서를 한 줄로 묶는 번호입니다.", "check": "공문에서 뽑은 사건번호와 대상자를 채권 계좌 목록과 맞춰 어느 계좌의 일인지 연결합니다.", "exceptions": ["같은 사건인데 한 문서는 '2025가단1234', 다른 문서는 '2025 가단 1234'처럼 띄어쓰기가 다름", "회신 기한이 표가 아니라 '본 공문 수령 후 7일 이내' 같은 본문 문장 안에만 있음", "같은 사건의 정정 공문이 나중에 와서 먼저 온 공문의 내용을 바꿈"], "output": "사건번호별 처리 대장 한 줄(기관, 대상자, 계좌, 기한) + 기한 임박 표시", "steps": [{"node": "Parse", "what": "스캔하거나 받은 공문을 글자와 표로 읽습니다"}, {"node": "Classify", "what": "법원 결정문인지, 검찰·경찰 공문인지 종류를 나눕니다"}, {"node": "Extract ×2", "what": "문서 종류별로 사건번호, 기관, 대상자, 기한을 뽑습니다"}, {"node": "Merge", "what": "두 종류에서 뽑은 결과를 하나의 표로 합칩니다"}, {"node": "Match", "what": "사건번호와 대상자로 채권 계좌 목록의 계좌를 찾아 붙입니다"}, {"node": "Export", "what": "사건별 처리 대장 행으로 저장합니다"}], "problem": "공문은 종이나 스캔 파일로 들어오고, 담당자가 한 장씩 읽으며 사건번호와 기한을 손으로 업무 시스템에 옮겨 적습니다. 같은 사건번호라도 표기가 조금씩 달라 어느 계좌의 일인지 찾는 데 시간이 걸리고, 옮겨 적다가 숫자 하나가 바뀌면 엉뚱한 계좌에 기록이 남습니다. 정정 공문(앞서 보낸 내용을 고치는 공문)이 뒤늦게 오면 먼저 적은 내용을 다시 찾아 고쳐야 해서 누락이 생기기 쉽습니다.", "why": "공문은 기관마다 양식이 달라도 찾아야 할 항목은 사건번호, 대상자, 회신 기한으로 늘 같습니다. Studio는 양식을 미리 등록하지 않고 항목 설명만으로 값을 읽어 내고, 뽑은 사건번호를 계좌 목록과 같은 키로 한 행에 묶어 주기 때문에 짝이 없는 공문이 바로 드러납니다. 일반 AI 챗봇에 공문을 통째로 넣으면 기한을 그럴듯하게 요약해 주지만, 뽑은 값이 원문 어디서 왔는지 남지 않아 담당자가 결국 전부 다시 읽어야 합니다.", "difficulty": "입문"}, {"uid": "U134", "i": 133, "no": 231, "pattern": "입력", "industry": "금융·대출", "dept": ["업종 현업"], "task": "중고차 성능·상태점검기록부로 사고 이력과 주행거리를 판독해 할부 심사에 넣는다", "title": "중고차 점검표로 사고 이력 확인", "oneliner": "중고차 점검표를 읽어 사고차 여부와 주행거리를 확인합니다.", "story": "중고차 할부를 해 주는 금융회사의 심사 담당자는 차마다 붙는 성능·상태점검기록부를 보고 심사 시스템에 값을 입력합니다. 주행거리와 사고 이력은 차값과 대출 금액을 정하는 데 중요한데, 기록부가 손글씨나 체크 표시로 되어 있어 읽기 어렵습니다. 사고 이력은 '없음'인데 뼈대 부품 교환 표시가 있는 것처럼 앞뒤가 안 맞는 경우도 놓치기 쉽습니다. 워크플로우가 기록부 값을 뽑아 입력값과 사고차 기준표에 맞춰 보고 근거와 보완 요청을 정리해 줍니다.", "terms": [{"term": "성능·상태점검기록부", "desc": "중고차를 팔기 전에 정비사가 차 상태를 점검해 적은 서류입니다. 주행거리, 사고 여부, 교체한 부품이 적힙니다."}, {"term": "할부", "desc": "물건값을 한 번에 내지 않고 나눠 내는 것입니다. 금융회사가 먼저 차값을 내 주고 고객이 나눠 갚습니다."}, {"term": "차대번호", "desc": "차마다 하나씩 붙는 고유 번호입니다. 번호판이 바뀌어도 그대로입니다."}, {"term": "주요 골격·판금", "desc": "골격은 차의 뼈대 부분이고, 판금은 찌그러진 부분을 펴서 고친 것입니다. 골격을 교환했으면 보통 사고차로 봅니다."}], "docs": [{"name": "성능·상태점검기록부", "desc": "주행거리, 사고 이력 표시, 교환·판금 부위를 봅니다."}, {"name": "할부 심사 입력 자료", "desc": "심사 시스템에 이미 입력된 값으로, 기록부와 같은지 봅니다."}, {"name": "사고차 판단 기준표", "desc": "어떤 부위를 고쳤으면 사고차로 보는지 정리한 기준표입니다."}], "fields": ["차대번호와 차량번호", "주행거리", "사고 이력 표시", "교환·판금 부위", "차량 상태 메모"], "key": "차대번호(차량번호). 기록부와 심사 입력 자료가 같은 차인지 이어 줍니다.", "check": "기록부의 주행거리와 사고 표시를 심사 입력값, 사고차 판단 기준표와 비교합니다.", "exceptions": ["기록부는 85,000km, 입력값은 8,500km로 한 자리가 빠짐", "사고 이력은 '무'에 체크했는데 주요 골격 교환 표시가 있음", "손글씨와 체크 표시가 흐려 어느 칸인지 불분명"], "output": "사고차 여부와 근거 + 입력값 불일치 목록 + 보완 요청", "steps": [{"node": "Parse", "what": "손글씨와 체크 표시가 있는 점검기록부를 글자와 표로 읽습니다"}, {"node": "Extract", "what": "차대번호, 주행거리, 사고 표시, 교환·판금 부위를 뽑습니다"}, {"node": "Match", "what": "차대번호로 심사 입력값을, 교환 부위로 사고차 기준표 항목을 짝짓습니다"}, {"node": "Validate", "what": "주행거리 일치와 사고차 해당 여부를 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "사고차로 본 근거와 다시 확인할 항목을 문장으로 씁니다"}], "problem": "성능·상태점검기록부(정비사가 차 상태를 점검해 적은 서류)는 정해진 양식이지만 손글씨와 체크 표시로 채워져 있고, 사진으로 찍혀 들어오는 경우가 많아 담당자가 확대해 가며 읽습니다. 주행거리는 자릿수를 잘못 읽기 쉽고, 교환·판금(부품 교체와 찌그러진 부분 수리) 표시는 차 그림 위의 작은 기호라 어느 부위인지 가려내는 데 시간이 듭니다. 사고차 판단 기준표를 옆에 두고 교환 부위를 하나씩 대조해야 하는데, 심사 건수가 많은 날에는 사고 이력 칸의 체크만 보고 넘어가게 됩니다.", "why": "기록부는 전국이 같은 양식이라 어느 칸의 체크가 무엇을 뜻하는지 한 번 정해 두면 모든 차에 똑같이 적용되고, 읽기(Parse)와 뽑기(Extract)가 나뉘어 있어 흐린 체크 표시를 잘못 읽은 것인지 판정이 틀린 것인지 바로 구분됩니다. 주행거리 일치와 사고차 기준 해당 여부는 규칙 검사(Validate)로 하고, 서로 모순되는 표시가 있는 건은 추측하지 않고 '확인 필요'로 넘깁니다. 뽑은 값마다 기록부 어느 칸에서 왔는지 남아 있어 담당자는 의심되는 칸만 원본 사진에서 다시 보면 됩니다.", "difficulty": "입문"}, {"uid": "U135", "i": 134, "no": 16, "pattern": "생성", "industry": "금융·대출", "dept": ["법무·준법"], "task": "감독당국 검사결과 공시를 읽고 부서별 중점감사사항을 만든다", "title": "제재 사례로 감사 항목 만들기", "oneliner": "다른 회사의 제재 사례로 우리 부서별 감사 항목을 만듭니다.", "story": "금융회사의 준법(법을 잘 지키는지 관리하는) 담당자는 감독당국이 다른 금융회사를 검사하고 공개한 제재 공시문을 읽습니다. 지적된 잘못이 우리 회사 어느 부서 업무와 관련 있는지 찾아 부서별로 '올해 꼭 점검할 사항'을 정리해야 합니다. 공시 하나에 지적이 여러 건 섞여 있고, 업무 분장표와 하나하나 대조해야 해서 시간이 오래 걸리고 빠뜨리기 쉽습니다. 워크플로우가 지적 사항을 뽑아 업무 분장표와 짝지은 뒤 부서별 감사 항목 초안과 근거 대목을 만들어 줍니다.", "terms": [{"term": "감독당국", "desc": "금융회사들이 규칙을 지키는지 검사하고 잘못하면 벌을 주는 정부 기관입니다."}, {"term": "제재 공시", "desc": "감독당국이 어느 회사가 무엇을 잘못해 어떤 벌을 받았는지 공개한 글입니다."}, {"term": "업무 분장표", "desc": "회사 안에서 어느 부서가 어떤 일을 맡는지 적어 둔 표입니다."}, {"term": "중점감사사항", "desc": "내부 감사 때 특히 집중해서 살펴볼 항목입니다."}, {"term": "업권", "desc": "은행, 보험, 카드처럼 금융회사의 업종 구분입니다. 업종이 다르면 적용되는 규칙도 다릅니다."}], "docs": [{"name": "제재 공시문", "desc": "다른 금융회사가 지적받은 내용으로, 지적 사항과 위반 규정, 제재 수준을 봅니다."}, {"name": "부서별 업무 분장표", "desc": "우리 회사 부서별 담당 업무 목록으로, 지적된 업무를 맡은 부서를 찾습니다."}, {"name": "부서별 중점감사사항 양식", "desc": "결과를 채워 넣을 빈 양식입니다."}], "fields": ["지적 사항", "어긴 규정", "제재 수준", "위반 유형", "관련 업무"], "key": "업무 영역. 공시에서 지적된 업무와 분장표의 담당 업무를 이어 주는 값입니다.", "check": "공시에서 지적된 업무를 업무 분장표와 비교해 어느 부서가 관련 있는지 후보를 정합니다.", "exceptions": ["보험사 대상 공시라 우리 회사(대출 회사) 업종과 맞지 않아 해당 없음", "공시 하나에 지적 사항이 3건 있고 각각 다른 부서와 관련됨", "지적된 업무가 우리 분장표 어디에도 없음"], "output": "부서별 중점감사사항 초안 + 근거가 된 공시 대목", "steps": [{"node": "Parse", "what": "제재 공시문과 업무 분장표를 글자와 표로 읽습니다"}, {"node": "Extract ×2", "what": "공시에서는 지적 사항과 규정을, 분장표에서는 부서별 업무를 뽑습니다"}, {"node": "Match", "what": "지적된 업무와 비슷한 담당 업무를 가진 부서를 짝지어 찾습니다"}, {"node": "Instruct", "what": "업종이 맞는지 판단하고 부서별 감사 항목 문장과 근거를 씁니다"}, {"node": "Export", "what": "부서별 중점감사사항 양식에 채워 저장합니다"}], "problem": "제재 공시(감독당국이 어느 회사가 무엇을 잘못했는지 공개한 글)는 길고 딱딱한 문장으로 되어 있어, 담당자가 전부 읽은 뒤 우리 회사라면 어느 부서 일인지 머릿속으로 바꿔 생각해야 합니다. 이 판단이 사람마다 달라서 같은 공시를 보고도 어떤 부서는 점검 항목에 들어가고 어떤 부서는 빠집니다. 공시는 계속 새로 나오는데 지난번에 어떤 사례를 어디에 반영했는지 기록이 남지 않아 같은 일을 매년 처음부터 다시 합니다.", "why": "이 일의 핵심은 지적된 업무와 우리 부서 업무를 내용으로 이어 주는 것인데, 이어 주는 단계(Match)와 우리 업종에 해당하는지 판단하는 단계(Instruct)를 나누면 어느 쪽에서 빠졌는지 바로 보입니다. 일반 AI 챗봇에 공시와 분장표를 함께 넣으면 그럴듯한 감사 항목을 써 주지만, 근거가 된 공시 대목이 남지 않아 내부 감사(회사 스스로 규칙을 지켰는지 점검하는 일) 때 왜 이 항목인지 설명할 수 없습니다. 결과를 컬렉션에 쌓아 두면 다음에 새 공시가 나왔을 때 이미 반영한 사례와 비교하는 근거가 됩니다.", "difficulty": "입문"}, {"uid": "U136", "i": 135, "no": 25, "pattern": "대조", "industry": "금융·대출", "dept": ["법무·준법"], "task": "회생, 파산 사건에서 법원 보정 권고와 제출 서류를 맞춰 안내문을 만든다", "title": "회생·파산 보정 서류 챙기기", "oneliner": "법원이 더 내라고 한 서류를 이미 낸 서류와 맞춥니다.", "story": "개인 회생이나 파산 사건을 맡은 법률사무소 직원은 법원에서 '이 서류를 더 내라'는 보정 권고서를 받습니다. 권고 항목마다 이미 낸 부채증명서, 통장 내역, 급여명세서로 해결되는지 확인하고, 부족한 것은 의뢰인에게 요청해야 합니다. 항목이 많고 서류 기간이 조금씩 달라 무엇이 빠졌는지 찾기 어렵고, 기한을 넘기면 사건에 불리합니다. 워크플로우가 권고 항목과 제출 서류를 대조해 있음/부족을 판정하고 의뢰인에게 보낼 요청 목록을 만들어 줍니다.", "terms": [{"term": "회생·파산", "desc": "빚을 감당할 수 없는 사람이 법원의 도움으로 빚을 줄여 나눠 갚거나(회생), 남은 빚을 정리하는(파산) 절차입니다."}, {"term": "보정 권고", "desc": "법원이 '서류가 부족하니 보충해서 내라'고 요청하는 것입니다. 정해진 기한이 있습니다."}, {"term": "부채증명서", "desc": "어느 금융회사에 빚이 얼마 있는지 그 회사가 확인해 주는 서류입니다."}, {"term": "사용처 증빙", "desc": "큰돈을 뺐을 때 어디에 썼는지 보여 주는 영수증 같은 자료입니다."}], "docs": [{"name": "부채증명서", "desc": "채권자(돈을 빌려준 곳)와 원금, 이자를 봅니다."}, {"name": "통장 거래내역", "desc": "고액 출금이 있는지, 사용처 설명이 필요한지 봅니다."}, {"name": "보정 권고서", "desc": "법원이 추가로 요구한 항목과 제출 기한을 봅니다."}, {"name": "급여명세서", "desc": "소득을 확인하는 서류로, 요구된 기간을 다 갖췄는지 봅니다."}], "fields": ["채권자·원금·이자", "고액 출금 거래", "보정 요구 항목", "제출 기한", "가진 서류의 기간"], "key": "사건번호(의뢰인). 법원 사건과 의뢰인 서류를 이어 줍니다.", "check": "법원이 요구한 항목을 이미 낸 서류와 비교해 항목마다 있음 또는 부족으로 판정합니다.", "exceptions": ["통장에 500만 원 출금이 있는데 사용처 증빙이 없음", "법원이 배우자 재산 자료를 요구했지만 제출 서류에 없음", "급여명세서는 최근 6개월만 있는데 법원은 12개월을 요구함"], "output": "보정 항목별 대응 현황 + 의뢰인에게 보낼 요청 목록", "steps": [{"node": "Parse", "what": "보정 권고서와 제출 서류를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "부채증명서, 통장 내역, 급여명세서, 권고서로 종류를 나눕니다"}, {"node": "Extract ×3", "what": "부채증명서의 빚, 통장의 고액 출금, 급여명세서의 기간을 뽑습니다"}, {"node": "Merge", "what": "의뢰인별로 뽑은 값을 하나로 합칩니다"}, {"node": "Match", "what": "권고 항목 하나하나를 해당하는 제출 서류와 짝짓습니다"}, {"node": "Validate", "what": "항목마다 서류가 충분한지 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "부족한 항목을 의뢰인이 알아듣기 쉬운 요청 문장으로 씁니다"}], "problem": "보정 권고서(법원이 서류를 더 내라고 요청하는 문서)는 항목이 문장으로 길게 적혀 있고, 의뢰인이 낸 서류는 사진이나 스캔으로 여러 번에 걸쳐 들어옵니다. 직원은 항목마다 어느 서류로 해결되는지 폴더를 뒤져 가며 확인하고, 통장 내역에서 큰 출금을 찾아 사용처 설명이 필요한지 눈으로 훑습니다. 의뢰인이 여러 명이면 사건마다 기한이 다르고, 한 사건의 부족 서류를 정리해 보내기 전에 다른 사건의 기한이 먼저 닥치는 일이 생깁니다.", "why": "이 업무는 법원이 요구한 항목과 이미 낸 서류를 하나씩 짝지어야 빠진 것이 보이므로, 서류를 종류별로 나눠 값을 뽑고 권고 항목과 짝짓는(Match) 단계가 있어야 빈칸이 바로 드러납니다. 급여명세서 기간이 요구 기간보다 짧은지 같은 검사는 규칙(Validate)으로 하고, 큰 출금에 설명이 필요한지 같은 판단은 맥락(Instruct)으로 나눠 애매한 건은 추측하지 않고 확인 대상으로 남깁니다. 의뢰인마다 서류 양식이 달라도 양식을 미리 등록하지 않고 항목 설명만으로 읽기 때문에 새 의뢰인이 와도 바로 쓸 수 있습니다.", "difficulty": "중급"}, {"uid": "U137", "i": 136, "no": 28, "pattern": "대조", "industry": "금융·대출", "dept": ["업종 현업", "재무·회계"], "task": "과태료, 범칙금 고지서를 받아 계약 고객과 맞춘다", "title": "렌터카 과태료 고지서 주인 찾기", "oneliner": "과태료 고지서를 위반 시점에 차를 쓰던 고객과 연결합니다.", "story": "자동차를 빌려주는 금융회사(리스·렌터카)의 담당자는 차 주인인 회사 앞으로 오는 주정차, 속도 위반, 통행료 미납 고지서를 받습니다. 위반 시각에 그 차를 누가 쓰고 있었는지 계약 목록에서 찾아 고객에게 넘기거나 의견을 내야 합니다. 같은 차를 여러 고객이 번갈아 쓰고 기관마다 고지서 양식이 달라, 날짜를 하나하나 대조하다 보면 잘못된 고객에게 넘기는 일이 생깁니다. 워크플로우가 고지서에서 차량번호와 위반 시각을 뽑아 계약 기간과 맞추고 확인이 필요한 건을 기한순으로 정리해 줍니다.", "terms": [{"term": "과태료·범칙금", "desc": "교통 규칙을 어겼을 때 내는 돈입니다. 차 주인 앞으로 고지서가 날아옵니다."}, {"term": "고지서", "desc": "얼마를 언제까지 내라고 알려 주는 안내문입니다."}, {"term": "의견제출 기한", "desc": "'이 위반은 내가 한 것이 아니다'처럼 의견을 낼 수 있는 마감일입니다."}, {"term": "대차", "desc": "고객 차가 수리 중일 때 잠시 빌려주는 다른 차입니다."}], "docs": [{"name": "주정차 위반 고지서", "desc": "차량번호, 위반 시각, 금액, 기한을 봅니다."}, {"name": "속도 위반 고지서", "desc": "위와 같은 항목을 보지만 양식이 다릅니다."}, {"name": "통행료 미납 고지서", "desc": "고속도로 등의 미납 통행료 안내로, 같은 항목을 봅니다."}, {"name": "차량 계약 목록(엑셀)", "desc": "어느 고객이 어느 차를 언제부터 언제까지 쓰는지 적힌 표입니다."}], "fields": ["차량번호", "위반 날짜와 시각", "위반 내용", "금액", "납부·의견제출 기한"], "key": "차량번호 + 위반 일시. 어느 차가 언제 위반했는지로 그 시각의 계약 고객을 찾습니다.", "check": "위반 시각이 어느 고객의 계약 기간 안에 드는지 계약 목록과 비교합니다.", "exceptions": ["위반 시각이 앞 고객 반납과 다음 고객 계약 사이 공백 기간이라 회사가 보유 중이었음", "같은 차의 고객이 바뀐 당일 오전 10시 반납, 오후 3시 위반", "기관마다 고지서 양식이 달라 위반 일시 위치가 제각각"], "output": "고지서별 연결된 고객 + 확인 필요 건(기한 가까운 순)", "steps": [{"node": "Parse", "what": "여러 기관의 고지서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "주정차, 속도, 통행료 고지서로 종류를 나눕니다"}, {"node": "Extract", "what": "차량번호, 위반 일시, 금액, 기한을 뽑습니다"}, {"node": "Match", "what": "차량번호와 위반 일시로 그 시각에 계약 중인 고객을 계약 목록에서 찾습니다"}, {"node": "Validate", "what": "고객이 한 명으로 정해지는지, 공백 기간인지 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "애매한 건마다 왜 확인이 필요한지 한 문장으로 씁니다"}, {"node": "Export", "what": "고지서별 매칭 결과를 기한순으로 저장합니다"}], "problem": "고지서(얼마를 언제까지 내라는 안내문)는 지자체, 경찰, 고속도로 운영 기관 등 여러 곳에서 종이로 오고, 담당자는 고지서의 차량번호와 위반 시각을 보고 계약 목록 엑셀에서 그 시각에 해당하는 고객을 필터로 찾습니다. 차 한 대에 계약이 여러 줄이고 반납과 새 계약이 같은 날 이어지는 경우가 많아 시각까지 비교해야 하는데, 고지서에는 시각이 작은 글씨로 본문 안에 있습니다. 고지서마다 의견제출 기한(이 위반은 내가 한 것이 아니라고 말할 수 있는 마감일)이 다른데, 처리 순서를 접수 순으로 하다 보면 기한이 짧은 건이 뒤로 밀립니다.", "why": "이 업무의 답은 차량번호와 위반 시각이 어느 계약 기간 안에 드는가라는 정해진 규칙이라, 양식이 다른 고지서에서 두 값을 뽑아 계약 목록과 짝짓는(Match) 단계를 두면 사람이 필터를 거는 일이 사라집니다. 고객이 한 명으로 정해지는지, 계약 공백 기간인지는 규칙 검사(Validate)에서 가리고, 반납 당일처럼 애매한 건만 추측하지 않고 '확인 필요'로 사람에게 넘깁니다. 기관마다 양식이 달라도 양식을 미리 등록하지 않고 항목 설명만으로 읽으므로 새 기관의 고지서가 와도 그대로 처리됩니다.", "difficulty": "중급"}, {"uid": "U138", "i": 137, "no": 18, "pattern": "검증", "industry": "금융·대출", "dept": ["마케팅·심의", "법무·준법"], "task": "금융상품 광고가 협회 체크리스트에 맞는지 심의한다", "title": "대출 광고 문구 규칙 점검", "oneliner": "대출 광고가 심의 규칙과 상품 조건에 맞는지 점검합니다.", "story": "대출 상품을 파는 회사의 광고 심의 담당자는 광고를 내보내기 전에 업계 협회가 정한 체크리스트에 맞는지 확인합니다. 광고에 적힌 금리가 실제 상품 설명서와 같은지, 꼭 넣어야 하는 경고 문구가 있는지, 쓰면 안 되는 과장 표현은 없는지 하나씩 봐야 합니다. 항목이 많고 숫자 하나만 달라도 문제가 되기 때문에 사람이 눈으로 보면 놓치기 쉽습니다. 워크플로우가 광고와 설명서의 조건을 뽑아 체크리스트 항목별로 적합 여부를 판정하고 수정 의견을 써 줍니다.", "terms": [{"term": "광고 심의", "desc": "광고를 내보내기 전에 규칙에 맞는지 미리 검사받는 절차입니다."}, {"term": "심의필 번호", "desc": "심의를 통과했다는 표시로 광고에 붙이는 번호입니다. 없으면 심의를 안 받은 광고로 봅니다."}, {"term": "최저금리", "desc": "가장 좋은 조건일 때 적용되는 이자율입니다. 광고에서 실제보다 낮게 적으면 소비자를 속이는 셈이 됩니다."}, {"term": "필수 기재 사항", "desc": "광고에 반드시 들어가야 하는 내용입니다. 예를 들어 '과도한 빚은 신용등급을 떨어뜨릴 수 있다'는 경고 문구가 있습니다."}], "docs": [{"name": "광고 시안", "desc": "내보낼 예정인 광고 원고로, 금리와 문구를 확인합니다."}, {"name": "심의 체크리스트", "desc": "협회가 정한 점검 항목 목록으로, 광고가 지켜야 할 기준입니다."}, {"name": "상품 설명서", "desc": "대출 상품의 실제 금리, 한도, 수수료가 적힌 문서로, 광고 숫자와 비교합니다."}, {"name": "심의 요청서", "desc": "어떤 상품의 광고인지 적어 심의를 신청하는 서류입니다."}], "fields": ["광고에 적힌 금리", "필수 문구가 있는지", "금지되거나 오해를 부르는 표현", "심의필 번호", "대출 한도와 수수료"], "key": "상품명. 광고와 설명서가 같은 상품인지 이어 주는 이름입니다.", "check": "광고 문구를 체크리스트 항목과, 광고 속 금리·조건을 상품 설명서의 실제 값과 비교합니다.", "exceptions": ["광고에는 최저금리 연 4.9%, 상품 설명서에는 연 5.9%", "'누구나 승인 보장' 같은 금지 표현이 들어 있음", "경고 문구나 심의필 번호가 빠져 있음"], "output": "체크리스트 항목별 적합/부적합 판정 + 수정 의견 초안", "steps": [{"node": "Parse", "what": "광고 시안, 체크리스트, 설명서, 요청서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "들어온 파일이 광고인지 설명서인지 체크리스트인지 나눕니다"}, {"node": "Extract ×2", "what": "광고에서는 금리와 문구를, 설명서에서는 실제 금리와 조건을 뽑습니다"}, {"node": "Merge", "what": "같은 상품의 광고 값과 설명서 값을 한 줄로 합칩니다"}, {"node": "Match", "what": "광고 내용을 체크리스트 항목에 하나씩 짝지어 맞춥니다"}, {"node": "Validate", "what": "금리 일치, 필수 문구 유무, 금지 표현 여부를 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "부적합 항목마다 어떻게 고치면 되는지 의견 문장을 씁니다"}], "problem": "광고 시안은 글자 크기와 배치가 제각각인 그림 파일이나 문서로 오고, 담당자는 체크리스트를 옆에 두고 항목마다 표시를 하며 봅니다. 금리(이자율)와 한도는 상품 설명서를 따로 열어 숫자를 비교해야 하는데, 광고가 여러 매체용으로 조금씩 다르게 만들어지면 같은 비교를 시안 수만큼 반복합니다. 금지 표현은 단어 자체보다 문맥으로 판단해야 해서 담당자의 경험에 따라 결과가 달라집니다.", "why": "광고 점검에는 금리가 설명서와 같은지처럼 답이 정해진 규칙 검사와 이 표현이 오해를 부르는지처럼 맥락 판단이 섞여 있습니다. Studio는 규칙 검사(Validate)와 맥락 판단(Instruct)을 따로 두어, 숫자 불일치는 기계적으로 잡아내고 애매한 표현은 추측하지 않고 '검토 필요'로 사람에게 넘깁니다. 체크리스트 기준을 한 번 정해 두면 새 시안이 들어올 때마다 같은 기준으로 판정하므로 담당자가 바뀌어도 결과가 흔들리지 않습니다.", "difficulty": "중급"}, {"uid": "U139", "i": 138, "no": 20, "pattern": "검증", "industry": "금융·대출", "dept": ["업종 현업"], "task": "기업여신 심사 서류 25종을 읽고 검토한다", "title": "기업 대출 심사 서류 묶음 점검", "oneliner": "기업 대출 서류끼리 숫자와 유효기간이 맞는지 봅니다.", "story": "은행의 기업 대출 심사 담당자는 회사가 낸 재무제표, 세금 증명, 등기부 등 수십 종의 서류를 받아 검토합니다. 재무제표의 매출과 세무서에 신고한 매출이 비슷한지, 서류가 다 들어왔는지, 발급일이 너무 오래되지 않았는지 하나씩 봐야 합니다. 서류 종류가 많아 누락이나 기간 경과를 놓치기 쉽고, 숫자 차이가 정상인지 아닌지 판단도 필요합니다. 워크플로우가 서류를 종류별로 나눠 값을 뽑고, 서로 대조해 불일치와 누락 목록을 만들어 줍니다.", "terms": [{"term": "기업여신", "desc": "은행이 회사에 돈을 빌려주는 일입니다. 빌려주기 전에 회사가 갚을 능력이 있는지 서류로 심사합니다."}, {"term": "재무제표(손익계산서)", "desc": "회사가 1년 동안 얼마를 벌고 얼마를 썼는지 정리한 성적표입니다."}, {"term": "부가세 과세표준증명", "desc": "회사가 세무서에 신고한 매출을 세무서가 확인해 주는 증명서입니다."}, {"term": "법인 등기부", "desc": "회사의 이름, 주소, 대표이사 등 기본 정보를 나라에 등록해 둔 공식 기록입니다."}, {"term": "면세 매출", "desc": "부가세가 붙지 않는 판매입니다. 이 매출은 부가세 신고에 빠지기 때문에 재무제표 매출과 차이가 나도 정상일 수 있습니다."}], "docs": [{"name": "재무제표(손익계산서)", "desc": "회사가 스스로 정리한 매출을 확인합니다."}, {"name": "부가세 과세표준증명", "desc": "세무서에 신고된 매출을 확인해 재무제표와 비교합니다."}, {"name": "법인 등기부", "desc": "대표이사가 누구이고 언제 바뀌었는지 봅니다."}, {"name": "납세증명서", "desc": "세금을 밀리지 않았다는 증명서로, 유효기간이 지나지 않았는지 봅니다."}, {"name": "주주명부", "desc": "회사의 주인(주주)이 누구인지 적힌 목록으로, 제출되었는지 확인합니다."}], "fields": ["재무제표 매출액", "세무서 신고 매출", "대표이사와 바뀐 날짜", "서류 발급일과 유효기간", "제출 여부"], "key": "사업자번호(법인명). 여러 서류가 같은 회사의 것인지 확인하는 번호입니다.", "check": "재무제표 매출과 세무서 신고 매출을 비교하고, 서류가 다 있는지와 유효기간이 지나지 않았는지 점검합니다.", "exceptions": ["재무제표 매출 50억 원, 부가세 신고 매출 42억 원인데 차이 일부가 면세 매출이라 정상", "납세증명서 유효기간이 심사일 기준으로 이미 지남", "등기부상 대표이사가 한 달 전에 바뀌어 다른 서류의 대표자 이름과 다름"], "output": "서류별 제출·유효 체크리스트 + 서류 간 불일치 목록", "steps": [{"node": "Parse", "what": "스캔한 심사 서류를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "재무제표, 세금 증명, 등기부, 주주명부 등 서류 종류를 나눕니다"}, {"node": "Extract ×3", "what": "재무 서류의 매출, 세금 서류의 신고 매출과 발급일, 등기부의 대표이사를 뽑습니다"}, {"node": "Merge", "what": "같은 회사의 값을 한 표로 합칩니다"}, {"node": "Validate", "what": "매출 차이, 유효기간 경과, 서류 누락을 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "매출 차이가 정상 사유인지 판단하고 확인 요청 문장을 씁니다"}], "problem": "서류 묶음은 한 회사당 수십 장이 뒤섞인 스캔 파일로 들어오고, 담당자가 먼저 어떤 서류가 몇 장인지 나눈 뒤에야 비교를 시작할 수 있습니다. 매출처럼 여러 서류에 적힌 값은 서류를 번갈아 열어 숫자를 옮겨 적고 차이를 계산해야 하며, 발급일과 유효기간은 서류마다 적힌 위치가 달라 한 장씩 찾아봐야 합니다. 차이가 나는 이유가 정상인지 아닌지는 담당자 경험에 따라 판단이 갈려서 같은 서류를 두고도 결과가 달라집니다.", "why": "서류 종류마다 봐야 할 항목이 다르므로, 먼저 종류를 나누고(Classify) 종류별로 다른 기준으로 값을 뽑는(Extract) 구조가 사람 눈보다 빠뜨림이 적습니다. 뽑은 값을 사업자번호(회사마다 붙는 고유 번호)로 한 행에 묶으면 아직 안 들어온 서류와 서로 다른 숫자가 빈칸과 색으로 바로 드러납니다. 매출 차이가 면세 매출(부가세가 붙지 않아 세무서 신고에서 빠지는 매출) 때문인지 같은 판단은 규칙 검사(Validate)와 따로 떼어 맥락 판단(Instruct)에 맡기고, 확신이 없는 건은 확인 요청으로 사람에게 넘기기 때문에 추측으로 승인되는 일이 없습니다.", "difficulty": "중급"}, {"uid": "U140", "i": 139, "no": 211, "pattern": "검증", "industry": "금융·대출", "dept": ["업종 현업", "법무·준법"], "task": "전세 계약서와 등기부·건축물대장으로 계약 위험을 진단한다", "title": "전세 계약 위험 신호 진단", "oneliner": "전세 계약서를 공적 서류와 맞춰 위험도를 매깁니다.", "story": "전세 대출이나 보증을 다루는 금융회사의 담당자는 전세 계약서가 안전한지 등기부, 건축물대장, 실거래가 자료로 확인합니다. 계약서의 집주인이 실제 소유자인지, 주소가 정확한지, 보증금이 집값에 비해 너무 높지 않은지, 주거용 건물이 맞는지 봐야 합니다. 서류마다 주소 표기가 다르고 확인할 항목이 많아 하나만 놓쳐도 보증금을 잃는 사고로 이어질 수 있습니다. 워크플로우가 네 서류를 대조해 초록·노랑·빨강 위험도와 근거, 보완 요청을 만들어 줍니다.", "terms": [{"term": "전세", "desc": "집주인에게 큰 보증금을 맡기고 월세 없이 사는 방식입니다. 계약이 끝나면 보증금을 돌려받습니다."}, {"term": "등기부등본", "desc": "집의 주인과 걸려 있는 대출(근저당) 등을 나라에 기록한 문서입니다."}, {"term": "건축물대장", "desc": "건물의 용도, 면적, 층수 등을 적은 공식 기록입니다. 주거용인지 확인할 수 있습니다."}, {"term": "실거래가", "desc": "실제로 거래된 집값 기록입니다. 보증금이 집값에 비해 과한지 판단하는 기준이 됩니다."}, {"term": "근린생활시설", "desc": "상가, 사무실처럼 주거가 아닌 용도의 건물입니다. 주거용이 아니면 전세 보호를 받기 어려울 수 있습니다."}], "docs": [{"name": "전세 계약서", "desc": "집주인 이름, 주소, 보증금을 봅니다."}, {"name": "등기부등본", "desc": "실제 소유자와 걸려 있는 대출 등 권리를 봅니다."}, {"name": "건축물대장", "desc": "건물 용도가 주거용인지 봅니다."}, {"name": "실거래가 자료", "desc": "주변 비슷한 집의 거래 가격을 봅니다."}], "fields": ["주소와 동·호수", "집주인", "보증금", "근저당 등 권리관계", "건물 용도", "주변 실거래가"], "key": "주소(동·호수). 네 서류가 같은 집에 대한 것인지 이어 줍니다.", "check": "계약서의 집주인·동호수를 등기부·건축물대장과 비교하고, 보증금을 실거래가와 앞선 대출 금액에 견주어 봅니다.", "exceptions": ["계약서는 '101동 1203호', 등기부는 '제101동 제12층 제1203호'로 표기가 다름", "계약서의 집주인과 등기부의 소유자가 다른 사람", "건축물대장상 용도가 근린생활시설이라 주거용이 아님"], "output": "위험도(초록/노랑/빨강) + 판정 근거 + 보완 요청 항목", "steps": [{"node": "Parse", "what": "계약서, 등기부, 건축물대장, 실거래가 자료를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "네 서류를 종류별로 나눕니다"}, {"node": "Extract ×4", "what": "서류마다 주소, 집주인·소유자, 보증금, 권리, 용도, 거래가를 뽑습니다"}, {"node": "Merge", "what": "같은 집의 값을 한 줄로 합칩니다"}, {"node": "Validate", "what": "소유자 일치, 주소 일치, 용도, 보증금 비율을 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "위험 판정의 근거와 추가로 받아야 할 서류를 문장으로 씁니다"}], "problem": "전세 계약서는 손글씨나 중개업소 양식으로 오고, 등기부등본(집의 주인과 걸린 대출을 기록한 문서)과 건축물대장(건물의 용도와 면적을 적은 공식 기록)은 각각 다른 곳에서 떼어 와야 해서 한 건에 네 종류 서류를 모으는 것부터 시간이 듭니다. 동과 호수 표기 방식이 서류마다 달라 같은 집인지부터 사람이 판단해야 하고, 보증금이 집값에 비해 과한지는 실거래가 자료(실제 거래된 집값 기록)를 따로 찾아 계산해야 합니다. 확인 항목이 많다 보니 바쁜 시기에는 소유자 이름만 맞으면 넘어가는 식으로 점검이 얕아집니다.", "why": "네 서류를 주소를 키로 한 행에 묶으면(Merge) 소유자, 용도, 보증금, 앞선 대출 금액이 나란히 놓여 어느 항목이 어긋나는지 한눈에 보입니다. 소유자 이름 일치나 용도가 주거용인지 같은 검사는 규칙(Validate)으로 처리하고, 보증금 비율이 위험한 수준인지 같은 판단은 맥락(Instruct)으로 나눠 근거 문장과 함께 남깁니다. 한 번 정한 판정 기준을 모든 계약 건에 똑같이 적용하므로 담당자가 바쁘다고 점검이 얕아지는 일이 없습니다.", "difficulty": "중급"}, {"uid": "U141", "i": 140, "no": 220, "pattern": "검증", "industry": "금융·대출", "dept": ["법무·준법", "업종 현업"], "task": "법인 고객확인에서 등기부와 주주명부로 실소유자를 역산해 신고와 맞춘다", "title": "법인의 진짜 주인 거슬러 찾기", "oneliner": "주주명부를 따라가 법인의 실제 주인을 찾고 신고와 맞춥니다.", "story": "은행의 고객확인 담당자는 회사가 계좌를 열거나 대출을 받을 때 그 회사의 실제 주인이 누구인지 확인해야 합니다. 주주명부에 다른 회사가 주주로 있으면 그 회사의 주주까지 거슬러 올라가 지분을 계산해야 사람 이름이 나옵니다. 단계가 깊어지면 계산이 복잡하고 서류가 빠지기 쉬우며, 신고된 주인과 결과가 다르면 법적 문제가 될 수 있습니다. 워크플로우가 서류에서 지분을 뽑아 구조표를 만들고 신고 내용과 비교해 적격 또는 보완 요청을 정리해 줍니다.", "terms": [{"term": "고객확인", "desc": "금융회사가 고객이 누구인지, 돈세탁 위험은 없는지 확인하는 의무 절차입니다."}, {"term": "실소유자", "desc": "서류상 회사 뒤에서 실제로 회사를 소유하거나 지배하는 사람입니다."}, {"term": "주주명부·지분율", "desc": "주주명부는 회사 주인(주주) 목록이고, 지분율은 각 주주가 회사를 몇 퍼센트 가졌는지입니다."}, {"term": "법인 주주", "desc": "사람이 아니라 다른 회사가 주주인 경우입니다. 그 회사의 주주를 다시 확인해야 합니다."}, {"term": "법인등기부", "desc": "회사의 이름, 대표자 등 기본 정보를 나라에 등록한 공식 기록입니다."}], "docs": [{"name": "법인등기부", "desc": "회사 이름, 법인번호, 대표자를 봅니다."}, {"name": "주주명부", "desc": "주주 이름과 지분율, 주주가 사람인지 회사인지 봅니다."}, {"name": "실소유자확인서", "desc": "고객이 스스로 신고한 실제 주인을 봅니다."}, {"name": "사업자등록증", "desc": "사업자번호와 대표자를 봐서 다른 서류와 비교합니다."}, {"name": "대표자 신분증", "desc": "대표자 이름이 서류들과 같은지 봅니다."}], "fields": ["법인명과 법인번호", "대표자", "주주 이름과 지분율", "주주 종류(사람/회사)", "신고된 실소유자"], "key": "법인번호(사업자번호). 여러 서류가 같은 회사의 것인지 이어 줍니다.", "check": "주주명부로 거슬러 계산한 실제 주인을 신고된 실소유자와 비교하고, 서류끼리 회사 정보가 같은지 확인합니다.", "exceptions": ["지분 60%를 가진 주주가 다른 회사인데 그 회사의 주주명부가 없음", "신고서에는 A씨가 실소유자인데 지분을 계산하면 B씨가 가장 많음", "등기부와 사업자등록증의 대표자 이름이 다름"], "output": "지분 구조표 + 불일치 목록 + 적격/보완 요청", "steps": [{"node": "Parse", "what": "등기부, 주주명부, 신고서, 등록증, 신분증을 글자와 표로 읽습니다"}, {"node": "Classify", "what": "다섯 서류를 종류별로 나눕니다"}, {"node": "Extract ×3", "what": "등기부와 등록증의 회사 정보, 주주명부의 지분, 신고서의 실소유자를 뽑습니다"}, {"node": "Merge", "what": "같은 회사의 값을 모아 지분 구조로 합칩니다"}, {"node": "Validate", "what": "계산한 주인과 신고 주인, 서류 간 대표자가 같은지 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "지분을 거슬러 계산한 과정과 보완이 필요한 서류를 문장으로 씁니다"}], "problem": "고객확인(금융회사가 고객이 누구인지 확인하는 의무 절차) 서류는 회사마다 여러 종류가 들어오고, 담당자는 주주명부(회사 주인 목록)를 보다가 주주가 다른 회사이면 그 회사의 주주명부를 또 요청해 기다립니다. 여러 단계의 지분율(회사를 몇 퍼센트 가졌는지)을 곱해 최종 사람을 찾는 계산을 엑셀이나 손으로 하는데, 중간에 서류 하나가 빠지면 어디까지 확인했는지 다시 정리해야 합니다. 서류마다 적힌 대표자 이름이나 법인번호(회사마다 붙는 고유 번호)가 조금씩 다른 것도 사람이 찾아내야 해서 한 건에 시간이 오래 걸립니다.", "why": "이 업무는 서류가 하나라도 빠지면 계산이 끝나지 않으므로, 법인번호를 키로 서류를 한 행에 묶어(Merge) 어느 회사의 주주명부가 아직 없는지 빈칸으로 드러내는 구조가 필요합니다. 지분 계산 결과와 신고된 실소유자(실제로 회사를 지배하는 사람)가 같은지는 규칙 검사(Validate)로 비교하고, 계산 과정과 보완 요청 문장은 맥락 판단(Instruct)이 써서 심사 기록으로 남깁니다. 일반 AI 챗봇에 서류를 통째로 넣으면 지분을 그럴듯하게 계산해 주지만, 어느 서류의 어느 숫자를 썼는지 위치가 남지 않아 감독 검사 때 설명할 수 없습니다.", "difficulty": "중급"}, {"uid": "U142", "i": 141, "no": 233, "pattern": "검증", "industry": "금융·대출", "dept": ["업종 현업", "재무·회계"], "task": "운용사가 보낸 출자요청서(캐피탈콜)의 금액과 기한을 약정 현황에 맞춰 확인한다", "title": "펀드 출자 요청서 금액·계좌 확인", "oneliner": "펀드의 돈 넣어 달라는 요청서를 약정과 맞춰 확인합니다.", "story": "펀드에 돈을 넣기로 약속한 투자기관의 담당자는 운용사로부터 '이번에 얼마를 언제까지 넣어 달라'는 출자요청서를 받습니다. 요청 금액이 우리 지분율에 맞는지, 지금까지 넣은 돈이 약속한 총액을 넘지 않는지, 돈 보낼 계좌가 미리 등록한 계좌와 같은지 확인해야 합니다. 계산이 여러 단계이고 계좌번호가 조금만 달라도 사고로 이어질 수 있어 꼼꼼함이 필요합니다. 워크플로우가 요청서와 약정서 값을 뽑아 현황표와 대조하고 납입 또는 보류를 판정해 줍니다.", "terms": [{"term": "캐피탈콜(출자요청)", "desc": "펀드가 투자할 곳이 생길 때마다 투자자에게 약속한 돈의 일부를 보내 달라고 요청하는 것입니다."}, {"term": "출자약정", "desc": "펀드에 총 얼마까지 넣겠다고 미리 약속한 계약입니다. 돈은 한 번에 내지 않고 요청이 올 때마다 나눠 냅니다."}, {"term": "운용사", "desc": "펀드의 돈을 맡아 투자 결정을 내리는 회사입니다."}, {"term": "지분율", "desc": "펀드 전체 약정액 중 우리가 약속한 몫의 비율입니다. 요청 금액은 보통 전체 요청액에 이 비율을 곱한 값입니다."}, {"term": "납입 차수", "desc": "몇 번째 출자 요청인지 나타내는 순번입니다."}], "docs": [{"name": "출자요청서(캐피탈콜)", "desc": "이번 요청 금액, 전체 요청 금액, 기한, 송금 계좌를 봅니다."}, {"name": "출자약정서", "desc": "우리가 약속한 총액과 지분율을 봅니다."}, {"name": "납입 현황표(엑셀)", "desc": "지금까지 차수별로 넣은 돈의 누계를 봅니다."}, {"name": "등록 계좌 목록", "desc": "미리 등록해 둔 펀드 계좌로, 요청서 계좌와 비교합니다."}], "fields": ["펀드명과 납입 차수", "우리 요청 금액과 전체 요청 금액", "지분율", "납입 기한", "송금 계좌"], "key": "펀드명 + 출자자. 어느 펀드에 누가 낼 돈인지 이어 줍니다.", "check": "지분율 × 전체 요청액이 우리 요청액과 같은지, 넣은 돈 누계가 약정액 이하인지, 계좌가 등록 계좌와 같은지 비교합니다.", "exceptions": ["이번 요청액을 더하면 누계가 약정 총액보다 많아짐", "요청서의 송금 계좌가 등록 계좌와 끝자리가 다름", "지분율 10% × 전체 50억 원은 5억 원인데 요청액은 5.5억 원"], "output": "금액·계좌 검증 결과(초록/노랑/빨강) + 납입/보류 판정", "steps": [{"node": "Parse", "what": "출자요청서와 약정서를 글자와 표로 읽습니다"}, {"node": "Extract ×2", "what": "요청서의 금액·기한·계좌, 약정서의 총액과 지분율을 뽑습니다"}, {"node": "Match", "what": "펀드명으로 납입 현황표의 누계와 등록 계좌 목록을 짝지어 가져옵니다"}, {"node": "Validate", "what": "요청액 계산, 약정 한도, 계좌 일치를 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "보류할 경우 운용사에 확인할 내용을 문장으로 씁니다"}, {"node": "Export", "what": "검증 결과와 납입/보류 판정을 저장합니다"}], "problem": "출자요청서(펀드가 약속한 돈의 일부를 보내 달라고 하는 문서)는 운용사(펀드 돈을 맡아 굴리는 회사)마다 양식이 다르고, 담당자는 전체 요청액과 우리 지분율(펀드 전체 약정액 중 우리 몫의 비율)을 찾아 계산기로 곱한 값을 요청서의 우리 몫과 비교합니다. 지금까지 넣은 돈의 누계는 별도 엑셀 현황표에 있고 약정 총액(넣기로 약속한 전체 금액)은 약정서에 있어 세 곳을 오가며 확인하며, 투자한 펀드가 수십 개면 같은 확인을 펀드마다 반복합니다. 송금 계좌는 자릿수가 길어 한 자리씩 눈으로 대조하는데, 납입 기한이 짧아 서두르다 보면 계좌 확인을 생략하기 쉽습니다.", "why": "이 업무의 확인 항목은 지분율에 전체 요청액을 곱하면 우리 요청액이 되는지, 누계가 약정 총액을 넘지 않는지, 계좌가 등록 계좌와 같은지처럼 모두 답이 정해진 규칙이라, 규칙 검사(Validate)에 맡기면 계산 실수와 자릿수 차이가 사라집니다. 요청서와 약정서에서 뽑은 값을 펀드명으로 현황표·등록 계좌 목록과 한 행에 묶으면(Match) 세 곳을 오가던 확인이 한 줄에서 끝납니다. 일반 AI 챗봇은 계산은 해 주지만 등록 계좌 목록 같은 우리 쪽 기준 자료와 자동으로 대조하지 못하고, 계좌 한 자리 차이를 놓쳐도 알 수 없습니다.", "difficulty": "중급"}, {"uid": "U143", "i": 142, "no": 22, "pattern": "입력", "industry": "금융·대출", "dept": ["업종 현업"], "task": "NPL 매입 실사에서 등기부 수천 건의 권리관계를 넘겨 본다", "title": "부실채권 담보 권리관계 일괄 확인", "oneliner": "부실채권 매입 전 부동산 등기 기록을 원장과 맞춥니다.", "story": "부실채권(돌려받기 어려워진 대출)을 사들이는 회사의 실사 담당자는 매입 전에 담보로 잡힌 부동산의 등기부를 대량으로 확인합니다. 등기부에 적힌 권리 중 아직 살아 있는 것만 골라, 매각 측 대출 원장에 적힌 순위와 금액이 맞는지 봐야 합니다. 이미 지워진 권리와 살아 있는 권리가 섞여 있고 건수가 많아 사람이 넘겨 보면 실수가 납니다. 워크플로우가 등기부와 원장에서 권리를 뽑아 짝짓고, 순위가 다르거나 추가 확인이 필요한 물건을 골라 줍니다.", "terms": [{"term": "NPL(부실채권)", "desc": "돈을 빌려 간 사람이 제때 갚지 못해 돌려받기 어려워진 대출입니다. 이런 대출을 묶어 싸게 사고파는 시장이 있습니다."}, {"term": "담보", "desc": "돈을 못 갚으면 대신 가져갈 수 있도록 잡아 두는 재산입니다. 주로 집이나 건물입니다."}, {"term": "등기부(갑구·을구)", "desc": "부동산의 주인과 권리를 나라에 기록해 둔 문서입니다. 갑구에는 소유권과 압류가, 을구에는 근저당 같은 담보 권리가 적힙니다."}, {"term": "근저당·채권최고액", "desc": "근저당은 부동산을 담보로 잡았다는 기록이고, 채권최고액은 그 부동산에서 최대 얼마까지 받을 수 있는지 적은 한도입니다."}, {"term": "전세권·대항력", "desc": "세입자가 보증금을 돌려받을 권리입니다. 대항력이 있으면 집이 팔려도 세입자가 먼저 보호받을 수 있습니다."}], "docs": [{"name": "등기부(갑구·을구)", "desc": "부동산에 걸린 권리와 순위, 지워졌는지 여부를 봅니다."}, {"name": "대출 원장", "desc": "매각 측이 관리하는 대출 기록으로, 우리 담보의 순위와 금액을 봅니다."}, {"name": "감정평가서 요약", "desc": "전문가가 매긴 부동산 가격으로, 받을 수 있는 돈의 크기를 가늠합니다."}], "fields": ["근저당 순위와 채권최고액", "지워진 권리인지 여부", "전세권·세입자", "가압류·압류", "원장에 적힌 순위와 금액", "감정가"], "key": "차주 ID(물건 주소). 같은 부동산의 등기부와 원장 기록을 이어 줍니다.", "check": "등기부에서 아직 살아 있는 권리만 골라 원장에 적힌 순위·금액과 비교합니다.", "exceptions": ["앞줄 근저당이 지워져서 원장상 2순위가 실제로는 1순위가 됨", "세입자 전세권이 있어 우리보다 먼저 보호받는지 확인이 필요함", "원장에는 1순위로 적혀 있는데 등기부에는 2순위"], "output": "물건별 권리관계 표 + 확인 필요 물건 목록", "steps": [{"node": "Parse", "what": "등기부, 대출 원장, 감정평가서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "들어온 문서가 등기부인지, 원장인지, 감정평가서인지 나눕니다"}, {"node": "Extract ×3", "what": "등기부의 권리와 순위, 원장의 순위와 금액, 감정평가서의 가격을 뽑습니다"}, {"node": "Merge", "what": "같은 물건에 대한 값을 한 줄로 합칩니다"}, {"node": "Match", "what": "물건 주소로 등기부 기록과 원장 기록을 짝짓습니다"}, {"node": "Validate", "what": "순위 일치, 지워진 권리 반영, 세입자 권리 여부를 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "확인이 필요한 물건마다 이유를 한 문장으로 씁니다"}, {"node": "Export", "what": "물건별 권리관계 표와 확인 목록을 저장합니다"}], "problem": "매입 검토 한 건에 물건(담보로 잡힌 부동산) 수백 개가 딸려 오고, 물건마다 등기부(부동산의 주인과 권리를 기록한 문서) 여러 장을 열어 봐야 합니다. 등기부에는 지워진 권리가 줄만 그어진 채 그대로 남아 있어 담당자가 줄을 세어 가며 살아 있는 권리만 골라 순위를 다시 매기고, 그 결과를 원장(매각 측의 대출 기록) 금액과 엑셀로 대조합니다. 검토 기간은 짧게 정해져 있어 뒤로 갈수록 눈으로만 넘기게 되고, 한 물건의 순위를 잘못 읽으면 매입 가격 계산이 통째로 틀어집니다.", "why": "물건 수가 많을수록 사람은 뒤쪽을 대충 보게 되지만, 워크플로우는 지워진 권리를 빼고 살아 있는 권리만 순위를 매긴다는 기준을 첫 번째 물건과 마지막 물건에 똑같이 적용합니다. 등기부에서 뽑은 권리와 원장에서 뽑은 순위·금액을 물건 주소로 한 행에 묶으면(Match) 두 기록이 다른 물건만 추려지고, 세입자 권리처럼 판단이 필요한 건은 규칙 검사와 분리해 '확인 필요'로 넘깁니다. 뽑은 값마다 등기부 어느 칸에서 왔는지 남아 있어 담당자는 추려진 물건만 원문으로 확인하면 됩니다.", "difficulty": "중급"}, {"uid": "U144", "i": 143, "no": 23, "pattern": "입력", "industry": "금융·대출", "dept": ["업종 현업", "재무·회계"], "task": "NPL 회수 단계에서 배당표와 채권원장을 맞춰 보고 기일을 추적한다", "title": "경매 배당금과 받을 돈 맞추기", "oneliner": "경매 배당표의 우리 몫이 맞는지 원장과 비교합니다.", "story": "부실채권을 관리하는 회사의 회수 담당자는 담보 부동산이 경매로 팔린 뒤 법원이 보낸 배당표를 확인합니다. 배당표에 적힌 우리 몫이 원장의 원금, 이자, 비용을 제대로 반영했는지, 순위가 등기부와 같은지 맞춰 봐야 합니다. 이자 계산 시작일이 다르거나 비용이 빠지는 일이 생기는데, 정해진 날까지 이의를 내지 않으면 돈을 덜 받게 됩니다. 워크플로우가 세 문서를 대조해 차액을 계산하고 배당기일 순으로 이의 검토 대상을 정리해 줍니다.", "terms": [{"term": "배당표", "desc": "경매로 부동산을 판 돈을 누구에게 얼마씩 나눠 줄지 법원이 정리한 표입니다."}, {"term": "배당기일", "desc": "법원이 돈을 나눠 주는 날입니다. 금액에 불만이 있으면 이날까지 이의를 내야 합니다."}, {"term": "채권원장", "desc": "회사가 받을 돈(원금, 이자 등)을 기록해 둔 장부입니다."}, {"term": "이자 기산일", "desc": "이자를 계산하기 시작하는 날입니다. 이 날짜가 늦게 잡히면 받을 이자가 줄어듭니다."}, {"term": "집행비용", "desc": "경매를 진행하는 데 들어간 비용입니다. 먼저 낸 쪽이 돌려받을 수 있습니다."}], "docs": [{"name": "배당표", "desc": "법원이 정한 우리 몫과 순위를 봅니다."}, {"name": "채권원장", "desc": "우리가 실제로 받아야 할 원금, 이자, 비용을 봅니다."}, {"name": "등기부 요약", "desc": "부동산 권리의 순위를 봐서 배당표 순위가 맞는지 확인합니다."}], "fields": ["배당 순위", "원금", "이자와 계산 시작일", "집행비용", "배당액", "배당기일"], "key": "사건번호(채권 ID). 경매 사건과 우리 대출 기록을 이어 줍니다.", "check": "배당표의 우리 몫을 원장 금액과, 배당 순위를 등기부 순위와 비교합니다.", "exceptions": ["원장은 이자 계산 시작일이 1월 1일인데 배당표는 3월 1일로 잡혀 이자가 적음", "우리가 낸 경매 집행비용이 배당표에 빠져 있음", "배당표가 팩스로 와서 글자가 흐림"], "output": "차액 목록(배당기일 순) + 이의 검토 대상", "steps": [{"node": "Parse", "what": "흐린 팩스본을 포함해 배당표, 원장, 등기부를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "문서가 배당표인지, 원장인지, 등기부인지 나눕니다"}, {"node": "Extract ×3", "what": "배당표의 배당액과 순위, 원장의 원금·이자·비용, 등기부의 순위를 뽑습니다"}, {"node": "Merge", "what": "같은 사건의 값을 한 줄로 합칩니다"}, {"node": "Match", "what": "사건번호로 배당표 항목과 원장 채권을 짝짓습니다"}, {"node": "Validate", "what": "금액 차이와 순위 차이를 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "차액이 왜 생겼는지 설명하고 이의를 낼지 검토 의견을 씁니다"}], "problem": "배당표(경매 대금을 누구에게 얼마씩 나눠 줄지 법원이 정리한 표)는 팩스로 오는 경우가 많고, 담당자는 거기 적힌 우리 몫을 원장(받을 돈을 적어 둔 장부)의 원금과 이자, 비용을 직접 더해 계산한 값과 비교합니다. 이자는 계산 시작일과 이율에 따라 달라져서 손으로 다시 계산해야 하고, 집행비용(경매 진행에 든 비용)은 따로 보관한 영수증을 찾아야 합니다. 사건이 동시에 여러 건 진행되면 배당기일(법원이 돈을 나눠 주는 날)이 가까운 순서로 챙겨야 하는데, 이 순서를 사람이 달력에 적어 관리하다 보면 한 건을 늦게 보게 됩니다.", "why": "이 업무는 배당표, 원장, 등기부(부동산 권리를 기록한 문서) 세 곳의 숫자를 사건번호로 한 줄에 모아야 차액이 보이므로, 문서별 읽기와 뽑기를 거쳐 같은 키로 묶는(Match) 흐름이 그대로 맞습니다. 금액과 순위 차이는 규칙 검사(Validate)로 기계적으로 잡고, 차액이 왜 생겼는지와 이의를 낼 가치가 있는지는 맥락 판단(Instruct)에 맡겨 두 단계가 섞이지 않게 합니다. 흐린 팩스본에서 읽은 숫자는 원문 위치가 함께 남으므로, 담당자는 판독이 의심되는 칸만 다시 보면 됩니다.", "difficulty": "중급"}, {"uid": "U145", "i": 144, "no": 230, "pattern": "입력", "industry": "금융·대출", "dept": ["법무·준법", "업종 현업"], "task": "은행에 송달된 채권압류·추심명령 결정문으로 지급정지와 회신 기한을 관리한다", "title": "법원 압류 명령 계좌 묶기", "oneliner": "은행에 온 압류 명령을 읽고 지급정지와 회신 기한을 챙깁니다.", "story": "은행의 법무 담당자는 법원이 보낸 채권압류·추심명령 결정문을 받으면 해당 고객 계좌의 돈이 빠져나가지 않게 막아야 합니다. 결정문, 압류 대상을 적은 별지, 회신을 요구하는 진술최고서가 한 묶음으로 오는데, 당사자와 금액이 서로 맞는지 확인하고 기한 안에 회신해야 합니다. 서류가 섞여 오거나 대상 범위가 애매하면 엉뚱한 계좌를 막거나 회신을 놓치기 쉽습니다. 워크플로우가 서류를 나눠 값을 뽑고 대조해 지급정지 체크리스트와 회신 기한 목록을 만들어 줍니다.", "terms": [{"term": "채권압류·추심명령", "desc": "법원이 '이 사람이 은행에 가진 돈을 묶고, 돈을 받을 사람이 직접 가져가게 하라'고 내린 명령입니다."}, {"term": "제3채무자", "desc": "빚진 사람에게 돈을 줘야 하는 다른 쪽입니다. 여기서는 고객의 예금을 가진 은행이 해당합니다."}, {"term": "지급정지", "desc": "계좌에서 돈이 빠져나가지 못하게 막는 조치입니다."}, {"term": "진술최고서", "desc": "법원이 은행에 '이 사람 계좌에 돈이 얼마 있는지 알려 달라'고 요구하는 문서입니다."}, {"term": "송달", "desc": "법원 문서가 공식적으로 상대에게 전달된 것입니다. 기한은 보통 이날부터 셉니다."}], "docs": [{"name": "채권압류·추심명령 결정문", "desc": "사건번호, 채무자, 압류 금액을 봅니다."}, {"name": "별지(압류할 채권 목록)", "desc": "어떤 예금을 어디까지 묶어야 하는지 범위를 봅니다."}, {"name": "진술최고서", "desc": "은행이 회신해야 할 내용과 기한을 봅니다."}, {"name": "송달 기록", "desc": "문서가 은행에 도착한 날짜와 시각을 봅니다."}], "fields": ["사건번호", "채무자와 제3채무자(은행)", "압류 대상·범위·금액", "송달 일시", "회신 기한"], "key": "사건번호. 한 사건에 속한 결정문, 별지, 진술최고서를 묶어 줍니다.", "check": "결정문, 별지, 진술최고서의 당사자와 금액이 같은지 비교하고, 지급정지와 회신이 끝났는지 점검합니다.", "exceptions": ["별지에 '채무자의 예금 중 일부'처럼 대상 범위가 분명하지 않게 적힘", "진술최고서가 결정문 사이에 끼어 있어 회신 대상에서 빠짐", "결정문은 1,000만 원, 별지는 1,500만 원으로 금액이 다름"], "output": "지급정지 조치 체크리스트 + 회신 기한 목록", "steps": [{"node": "Parse", "what": "송달된 결정문 묶음을 글자와 표로 읽습니다"}, {"node": "Classify", "what": "결정문, 별지, 진술최고서, 송달 기록으로 나눕니다"}, {"node": "Extract ×3", "what": "결정문의 당사자와 금액, 별지의 대상 범위, 진술최고서의 회신 요구와 기한을 뽑습니다"}, {"node": "Merge", "what": "같은 사건번호의 값을 한 줄로 합칩니다"}, {"node": "Validate", "what": "당사자·금액 일치와 회신 기한 여유를 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "범위가 애매한 건의 확인 의견과 처리 순서를 씁니다"}, {"node": "Export", "what": "지급정지 체크리스트와 회신 기한 목록을 저장합니다"}], "problem": "결정문 묶음은 법원에서 우편으로 송달(공식 전달)되어 하루에도 여러 건 쌓이고, 담당자는 봉투마다 결정문, 별지(압류 대상을 적은 붙임 종이), 진술최고서(계좌 잔액을 알려 달라는 요구서)를 손으로 분류합니다. 채무자(빚진 사람) 이름과 생년월일로 고객 계좌를 찾아 지급정지(돈이 빠져나가지 못하게 막는 조치)를 걸어야 하는데, 당사자 정보가 결정문과 별지에 나뉘어 있어 두 서류를 번갈아 봅니다. 회신 기한은 송달일부터 세는데 송달 기록이 따로 있어 날짜 계산을 건마다 다시 합니다.", "why": "한 봉투에 종류가 다른 서류가 섞여 오므로, 먼저 종류를 나누고(Classify) 종류별로 다른 항목을 뽑은 뒤 사건번호로 한 행에 묶는(Merge) 흐름이 있어야 진술최고서가 빠진 사건이 빈칸으로 드러납니다. 당사자와 금액이 서류끼리 같은지는 규칙 검사(Validate)로 하고, 별지의 대상 범위가 애매한 건은 추측해서 계좌를 막는 대신 '확인 필요'로 사람에게 넘깁니다. 어느 단계에서 틀렸는지 노드별로 보이기 때문에, 엉뚱한 계좌가 막힐 뻔했을 때 읽기 오류인지 짝짓기 오류인지 바로 찾을 수 있습니다.", "difficulty": "중급"}, {"uid": "U146", "i": 145, "no": 232, "pattern": "입력", "industry": "금융·대출", "dept": ["업종 현업"], "task": "중소기업 재무제표 계정과목을 은행 표준 계정으로 옮기고 회계 항등식으로 검산한다", "title": "재무제표를 은행 표준표로 옮기기", "oneliner": "중소기업 재무제표 항목을 은행 표준 항목에 맞춰 옮깁니다.", "story": "은행의 기업 대출 심사 담당자는 중소기업이 낸 재무제표를 은행이 정한 표준 항목에 맞춰 다시 입력합니다. 회사마다 항목 이름이 제각각이라 어느 표준 항목에 넣을지 판단해야 하고, 다 옮긴 뒤 '자산 = 부채 + 자본'처럼 합계가 맞는지 검산합니다. 소계를 한 번 더 더하거나 1년 안에 갚을 빚을 장기 빚으로 잘못 넣어도 합계는 맞을 수 있어서 실수가 숨어 버립니다. 워크플로우가 항목을 표준 계정에 짝짓고 검산과 재무비율 계산까지 해 줍니다.", "terms": [{"term": "재무상태표", "desc": "특정 날짜에 회사가 가진 재산(자산), 갚을 빚(부채), 주인 몫(자본)을 정리한 표입니다."}, {"term": "손익계산서", "desc": "1년 동안 얼마를 벌고 얼마를 썼는지 정리한 표입니다."}, {"term": "계정과목", "desc": "재무제표의 각 줄 이름입니다. 예를 들면 현금, 외상매출금, 차입금 같은 것입니다."}, {"term": "회계 항등식", "desc": "자산은 항상 부채와 자본을 더한 값과 같아야 한다는 규칙입니다. 검산에 씁니다."}, {"term": "유동·비유동부채", "desc": "1년 안에 갚아야 하는 빚이 유동부채, 1년 넘게 남은 빚이 비유동부채입니다."}], "docs": [{"name": "재무상태표", "desc": "회사가 쓴 항목 이름과 금액, 소계 구조를 봅니다."}, {"name": "손익계산서", "desc": "매출, 비용, 이익 항목과 금액을 봅니다."}, {"name": "은행 표준 계정표(엑셀)", "desc": "은행이 정한 표준 항목 목록으로, 원문 항목을 옮길 자리입니다."}], "fields": ["원문 항목 이름", "금액", "상위·하위 구조(소계)", "결산 시점과 금액 단위", "짝지은 표준 항목"], "key": "계정과목명. 회사가 쓴 항목 이름을 표준 항목 이름과 잇습니다.", "check": "원문 항목을 표준 계정표와 짝짓고, 자산 = 부채 + 자본과 소계 합계가 맞는지 검산합니다.", "exceptions": ["1년 안에 갚을 빚을 장기 빚으로 넣었는데 전체 합계는 맞음", "소계와 그 아래 세부 항목을 둘 다 옮겨 금액이 두 번 더해짐", "'○○개발충당금'처럼 표준 계정표에 없는 회사 고유 항목 이름"], "output": "표준 계정 매핑표 + 검산 결과 + 재무비율", "steps": [{"node": "Parse", "what": "재무상태표와 손익계산서를 글자와 표로 읽습니다"}, {"node": "Extract ×2", "what": "두 표에서 항목 이름, 금액, 소계 구조, 단위를 뽑습니다"}, {"node": "Merge", "what": "두 표의 항목을 하나의 목록으로 합칩니다"}, {"node": "Match", "what": "원문 항목 이름을 은행 표준 계정표의 항목과 짝짓습니다"}, {"node": "Validate", "what": "자산 = 부채 + 자본, 소계 합계, 중복 반영을 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "애매한 항목을 어디로 옮겼는지 이유를 쓰고 재무비율을 설명합니다"}, {"node": "Export", "what": "표준 계정 매핑표와 검산 결과를 저장합니다"}], "problem": "중소기업 재무제표는 회계 프로그램과 회계사무소마다 계정과목(각 줄 이름) 표기가 달라서, 담당자가 줄마다 표준표의 어느 항목에 해당하는지 정해 입력합니다. 한 회사에 수십 줄에서 수백 줄이 있고, 소계(몇 개 항목을 중간에 합친 값)와 세부 항목이 들여쓰기로만 구분되어 있어 어디까지가 소계에 포함되는지 눈으로 따라가야 합니다. 입력이 끝난 뒤 하는 검산은 합계만 보기 때문에 항목이 엉뚱한 자리에 들어간 것은 잡지 못하고, 나중에 재무비율(회사의 건강 상태를 보는 지표)이 이상하게 나와서야 발견됩니다.", "why": "항목 이름을 표준 계정에 짝짓는 일(Match)과 합계·중복을 검산하는 일(Validate)을 따로 두면, 비율이 이상할 때 짝짓기가 틀렸는지 소계가 두 번 더해졌는지 어느 단계 문제인지 바로 보입니다. 한 번 정한 짝짓기 규칙은 다음 회사의 재무제표에도 똑같이 적용되므로 담당자마다 다르게 분류하던 항목이 통일되고, 표준표에 없는 회사 고유 항목만 '검토 필요'로 사람에게 넘어옵니다. 결과를 컬렉션에 쌓아 두면 같은 회사의 다음 해 재무제표를 옮길 때 지난해 분류를 그대로 참고할 수 있습니다.", "difficulty": "중급"}, {"uid": "U147", "i": 146, "no": 234, "pattern": "입력", "industry": "금융·대출", "dept": ["업종 현업"], "task": "부동산 PF 대출 IM에서 여신 약정 조건을 뽑아 원장 등록 전에 맞춘다", "title": "부동산 개발 대출 조건표 정리", "oneliner": "개발 사업 대출 자료에서 조건을 뽑아 등록 전에 맞춥니다.", "story": "금융회사의 대출 담당자는 건물을 짓는 개발 사업에 돈을 빌려줄 때 투자제안서와 대출 계약서를 보고 조건을 시스템에 등록합니다. 대출이 순서가 다른 여러 덩어리로 나뉘어 있어 덩어리별 금액, 금리, 수수료를 정확히 구분해야 합니다. 제안서의 요약 장과 상세 장이 서로 다르거나 칸이 섞여 있으면 틀린 값이 등록되기 쉽습니다. 워크플로우가 덩어리별 조건을 뽑아 요약, 상세, 계약서끼리 대조하고 등록할 값을 정리해 줍니다.", "terms": [{"term": "PF(프로젝트 파이낸싱)", "desc": "회사의 신용이 아니라 앞으로 지을 건물이 벌어 올 돈을 믿고 빌려주는 대출입니다."}, {"term": "IM(투자제안서)", "desc": "대출이나 투자를 받으려는 쪽이 조건과 사업 내용을 정리해 보여 주는 자료입니다."}, {"term": "트랜치", "desc": "하나의 큰 대출을 돌려받는 순서나 조건에 따라 나눈 덩어리입니다. 선순위 덩어리는 먼저 받고 금리가 낮으며, 후순위는 나중에 받는 대신 금리가 높습니다."}, {"term": "여신약정서", "desc": "돈을 빌려주는 조건을 최종 확정한 계약서입니다."}, {"term": "신용보강", "desc": "돈을 못 갚을 경우를 대비해 다른 회사가 대신 갚겠다고 약속하는 등 안전장치를 더하는 것입니다."}], "docs": [{"name": "PF 대출 IM(투자제안서)", "desc": "요약 장과 상세 장에서 덩어리별 조건을 봅니다."}, {"name": "여신약정서", "desc": "최종 확정된 조건으로, 제안서 값과 같은지 봅니다."}, {"name": "원장 등록 양식", "desc": "시스템에 등록할 값을 채울 빈 양식입니다."}], "fields": ["돈을 빌리는 쪽(차주)", "덩어리(트랜치) 구분", "덩어리별 금액·금리·수수료", "만기와 갚는 방식", "담보와 신용보강"], "key": "차주 + 트랜치. 누구의 어느 덩어리 대출인지 이어 줍니다.", "check": "제안서 요약 장과 상세 장의 덩어리별 값을 서로 비교하고, 다시 대출 계약서와 비교합니다.", "exceptions": ["후순위 금리 8%가 선순위 칸에 섞여 들어감", "요약 장에는 수수료 1.0%, 상세 장에는 1.2%", "신용보강이 어느 덩어리에 적용되는지 문서에 분명하지 않음"], "output": "트랜치별 대출 조건표 + 불일치 목록 + 원장 등록값", "steps": [{"node": "Parse", "what": "투자제안서와 대출 계약서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "제안서의 요약 장, 상세 장, 계약서로 나눕니다"}, {"node": "Extract ×2", "what": "제안서와 계약서에서 덩어리별 금액, 금리, 수수료, 만기, 보강을 뽑습니다"}, {"node": "Merge", "what": "같은 덩어리의 값을 문서별로 나란히 합칩니다"}, {"node": "Validate", "what": "요약, 상세, 계약서 값이 같은지 초록·노랑·빨강으로 판정합니다"}, {"node": "Instruct", "what": "불일치마다 어느 값을 따라야 할지 확인 의견을 씁니다"}, {"node": "Export", "what": "덩어리별 조건표와 원장 등록값을 저장합니다"}], "problem": "PF(앞으로 지을 건물이 벌어 올 돈을 믿고 빌려주는 대출) 투자제안서는 수십 장에서 수백 장이고, 조건은 앞쪽 요약 장과 뒤쪽 상세 장에 두 번 적혀 있어 담당자가 두 곳을 오가며 확인합니다. 트랜치(대출을 돌려받는 순서에 따라 나눈 덩어리)별 금리와 수수료가 한 표에 나란히 적혀 있어 행과 열을 잘못 보면 다른 덩어리의 값을 옮기게 됩니다. 등록 전에 여신약정서(최종 확정 계약서)와 한 번 더 맞춰야 하는데, 제안서와 계약서의 용어와 순서가 달라 같은 항목을 찾는 데 시간이 듭니다.", "why": "같은 조건이 요약 장, 상세 장, 계약서 세 곳에 적히므로, 문서별로 뽑은 값을 차주(돈을 빌리는 쪽)와 트랜치를 키로 한 행에 나란히 묶는(Merge) 구조에서 세 값이 다른 칸이 바로 드러납니다. 뽑은 값마다 제안서 몇 쪽 어느 표에서 가져왔는지 위치가 남아 있어, 불일치가 나오면 담당자가 그 쪽만 열어 어느 값을 따를지 정하면 됩니다. 신용보강(다른 회사가 대신 갚겠다는 안전장치)이 어느 덩어리에 적용되는지처럼 문서가 애매한 부분은 규칙 검사와 분리해 '확인 필요'로 넘기므로 추측한 값이 등록되지 않습니다.", "difficulty": "중급"}, {"uid": "U148", "i": 147, "no": 235, "pattern": "입력", "industry": "금융·대출", "dept": ["법무·준법", "업종 현업"], "task": "은행에 온 압수수색영장에서 조회 대상과 유효기간을 정리해 처리한다", "title": "수사기관 영장 처리 범위 정리", "oneliner": "은행에 온 영장의 조회 범위와 기한을 정리해 처리합니다.", "story": "은행의 법무 담당자는 수사기관이 보낸 압수수색영장을 받으면 어떤 계좌의 어떤 기간 거래를 제공해야 하는지 정리합니다. 영장은 팩스로 오는 경우가 많아 계좌번호가 흐리고, 영장을 쓸 수 있는 유효기간과 조회해야 할 거래 기간을 헷갈리기 쉽습니다. 범위 밖 거래까지 넘기면 고객 정보를 잘못 제공한 것이 되고, 유효기간이 지나면 처리할 수 없습니다. 워크플로우가 영장과 별지 값을 뽑아 처리대장과 제공 기록을 대조하고 경고와 함께 정리해 줍니다.", "terms": [{"term": "압수수색영장", "desc": "법원이 수사기관에 '이 자료를 가져가도 된다'고 허락한 문서입니다. 은행은 영장에 적힌 범위만 제공해야 합니다."}, {"term": "영장 별지", "desc": "영장에 붙는 종이로, 조회할 계좌와 기간 등 구체적인 범위가 적혀 있습니다."}, {"term": "유효기간", "desc": "영장을 사용할 수 있는 마감일입니다. 조회할 거래 기간과는 다른 날짜입니다."}, {"term": "처리대장", "desc": "받은 영장과 처리 상태를 기록해 두는 장부입니다."}], "docs": [{"name": "압수수색영장(팩스본)", "desc": "영장번호, 발부 법원, 유효기간을 봅니다."}, {"name": "영장 별지", "desc": "조회 계좌와 거래 대상 기간, 요청 범위를 봅니다."}, {"name": "처리대장", "desc": "이 영장이 등록되고 처리됐는지 봅니다."}, {"name": "제공 내역 기록", "desc": "실제로 넘긴 자료의 계좌와 기간을  '병원·의료':'<path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/>',
 '보험':'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
 '금융·대출':'<line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/>'
};
const sel={pattern:new Set(),industry:new Set(),dept:new Set(),difficulty:new Set()};
const val=(d,k)=>k==='dept'?d.dept:[d[k]];
document.getElementById('total').textContent=DATA.length;
document.getElementById('total2').textContent=DATA.length;

function flow(nodes,key){return '<div class="flow">'+nodes.map(n=>`<span class="n${key&&key.includes(n.split(' ')[0])?' k':''}">${esc(n)}</span>`).join('<span class="ar">→</span>')+'</div>'}
// industry cards + department line in hero
const inds=document.getElementById('inds');
inds.innerHTML=META.industries.map(x=>`<button class="ind" data-v="${esc(x.name)}"><span class="ic"><svg class="i" viewBox="0 0 24 24">${ICONS[x.name]||''}</svg></span><div><div class="h"><b>${esc(x.name)}</b><span>${DATA.filter(d=>d.industry===x.name).length}개</span></div><p>${esc(x.short)}</p></div></button>`).join('');
inds.onclick=e=>{const b=e.target.closest('.ind');if(!b)return;const v=b.dataset.v;sel.industry.has(v)?sel.industry.delete(v):sel.industry.add(v);render()};
const dl=document.getElementById('deptline');
dl.innerHTML='<span class="lb">부서로 찾기</span>'+META.depts.map(x=>`<button class="chip" data-k="dept" data-v="${esc(x.name)}">${esc(x.name)}</button>`).join('');
dl.onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const v=c.dataset.v;sel.dept.has(v)?sel.dept.delete(v):sel.dept.add(v);render()};

function match(d,skip){
  for(const a of AX){ if(a.k===skip) continue; const s=sel[a.k]; if(s.size && !val(d,a.k).some(v=>s.has(v))) return false; }
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(q){ const hay=d._hay; if(!q.split(/\s+/).every(w=>hay.includes(w))) return false; }
  return true;
}
DATA.forEach(d=>{d._hay=[d.title,d.oneliner,d.story,d.problem||'',d.why||'',d.task,d.industry,d.dept.join(' '),d.pattern,(d.terms||[]).map(t=>t.term+' '+t.desc).join(' '),(d.docs||[]).map(x=>x.name).join(' '),(d.fields||[]).join(' ')].join(' ').toLowerCase()});

function renderFilters(){
  const f=document.getElementById('filters');
  f.innerHTML=AX.map(a=>{
    const chips=a.opts.map(o=>{const c=DATA.filter(d=>match(d,a.k)&&val(d,a.k).includes(o)).length;const on=sel[a.k].has(o);
      return `<button class="chip${on?' on':''}${!c&&!on?' zero':''}" data-k="${a.k}" data-v="${esc(o)}">${esc(o)}<span class="c">${c}</span></button>`}).join('');
    return `<div class="frow"><label>${a.label}</label><div><div class="chips">${chips}</div>${a.hint?`<p class="pathint">${a.hint}</p>`:''}</div></div>`}).join('')
    +`<div class="indinfo" id="indinfo"></div><p class="fnote">같은 줄 안에서는 하나라도 맞으면, 다른 줄끼리는 모두 맞아야 보입니다.</p>`;
  const sels=[...sel.industry,...sel.dept];
  const info=sels.map(n=>{const m=[...META.industries,...META.depts].find(x=>x.name===n);return m?`<div><b>${esc(n)}</b> ${esc(m.desc)}</div>`:''}).join('');
  const box=document.getElementById('indinfo'); box.innerHTML=info; box.classList.toggle('show',!!info);
}
document.getElementById('filters').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const s=sel[c.dataset.k],v=c.dataset.v;s.has(v)?s.delete(v):s.add(v);render()};

function card(d){
  return `<button class="card" data-id="${d.uid}"><div class="meta"><span class="tag ind">${esc(d.industry)}</span>${d.dept.slice(0,2).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}<span class="uid">${d.uid}</span></div>
  <h3>${esc(d.title)}</h3><p class="one">${esc(d.oneliner)}</p>
  <div class="ft"><span class="tag o">${esc(d.difficulty)}</span><span class="tag o">${esc(d.pattern)}</span><span class="docs">${ICON_DOC}문서 ${d.docs.length}종</span></div></button>`;
}
function render(){
  renderFilters();
  let L=DATA.filter(d=>match(d));
  const s=document.getElementById('sort').value;
  if(s==='easy') L.sort((a,b)=>DIFF.indexOf(a.difficulty)-DIFF.indexOf(b.difficulty)||a.i-b.i);
  else if(s==='hard') L.sort((a,b)=>DIFF.indexOf(b.difficulty)-DIFF.indexOf(a.difficulty)||a.i-b.i);
  else if(s==='name') L.sort((a,b)=>a.title.localeCompare(b.title,'ko'));
  else L.sort((a,b)=>a.i-b.i);
  document.getElementById('rc').textContent=L.length;
  document.querySelectorAll('.ind').forEach(b=>b.classList.toggle('on',sel.industry.has(b.dataset.v)));
  document.querySelectorAll('#deptline .chip').forEach(b=>b.classList.toggle('on',sel.dept.has(b.dataset.v)));
  let html='';
  if(!L.length) html='<div class="empty">조건에 맞는 유즈케이스가 없습니다. 필터를 줄여 보세요.</div>';
  else if(s==='no'){ let cur=null; for(const d of L){ if(d.industry!==cur){cur=d.industry;const m=META.industries.find(x=>x.name===cur);const n=L.filter(x=>x.industry===cur).length;html+=`<div class="ghead"><h2>${esc(cur)}</h2><span class="n">${n}개</span><p>${esc(m?m.desc:'')}</p></div>`;} html+=card(d);} }
  else html=L.map(card).join('');
  document.getElementById('grid').innerHTML=html;
}
['q','sort'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.getElementById('reset').onclick=()=>{Object.values(sel).forEach(s=>s.clear());document.getElementById('q').value='';document.getElementById('sort').value='no';render()};

// drawer
const dr=document.getElementById('drawer'),scrim=document.getElementById('scrim');
function open(uid,push=true){
  const d=DATA.find(x=>x.uid===uid); if(!d) return;
  const ind=META.industries.find(x=>x.name===d.industry);
  document.getElementById('dmeta').innerHTML=`<span class="tag ind">${esc(d.industry)}</span>${d.dept.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}<span class="tag o">${esc(d.difficulty)}</span><span class="uid">${d.uid}</span>`;
  document.getElementById('dtitle').textContent=d.title;
  const sec=(h,b)=>b?`<div class="sec"><h4>${h}</h4>${b}</div>`:'';
  document.getElementById('dbody').innerHTML=
    sec('어떤 일인가요',`<p class="story">${esc(d.story)}</p><p class="raw">현업에서 부르는 말: ${esc(d.task)}</p>`)+
    (d.problem?sec('문제 정의',blist(d.problem,'pl prob')):'')+
    (d.why?sec('Studio가 필요한 이유',blist(d.why,'pl why')):'')+
    (ind?sec(`${esc(d.industry)} 업계는`,`<p class="story" style="font-size:14.5px">${esc(ind.desc)}</p>${d.dept.length?`<p class="raw">맡는 부서: ${d.dept.map(x=>{const m=META.depts.find(y=>y.name===x);return esc(x)+(m?' ('+esc(m.desc)+')':'')}).join(' / ')}</p>`:''}`):'')+
    sec('알아 둘 용어',d.terms&&d.terms.length?`<dl class="terms">${d.terms.map(t=>`<div><dt>${esc(t.term)}</dt><dd>${esc(t.desc)}</dd></div>`).join('')}</dl>`:'')+
    sec('필요한 문서',`<ul class="docs">${d.docs.map(x=>`<li>${ICON_DOC}<div><b>${esc(x.name)}</b><span>${esc(x.desc)}</span></div></li>`).join('')}</ul>`)+
    sec('문서에서 뽑을 항목',`<div class="fl">${d.fields.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`)+
    sec('무엇을 확인하나요',`<dl class="kv">${d.key?`<dt>연결 키</dt><dd>${esc(d.key)}</dd>`:''}<dt>확인할 것</dt><dd>${esc(d.check)}</dd></dl>`)+
    sec('워크플로우 단계',`${flow(d.steps.map(s=>s.node))}<p class="raw" style="margin-top:8px">업무 패턴: ${esc(d.pattern)}. 비슷한 노드 조합의 업무를 묶어 부르는 이름이고, 참고용입니다.</p><ol class="steps" style="margin-top:12px">${d.steps.map(s=>`<li><span class="nd">${esc(s.node)}</span><span class="w">${esc(s.what)}</span></li>`).join('')}</ol>`)+
    sec('데이터셋에 꼭 넣을 예외',`<ul class="ex">${d.exceptions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`)+
    sec('최종 결과',`<div class="out">${esc(d.output)}</div>`);
  dr.classList.add('on');scrim.classList.add('on');document.body.style.overflow='hidden';
  dr.querySelector('.db').scrollTop=0;
  if(push){try{history.replaceState(null,'','#'+uid)}catch(e){}}
  document.getElementById('close').focus();
}
function close(){dr.classList.remove('on');scrim.classList.remove('on');document.body.style.overflow='';try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
document.getElementById('grid').onclick=e=>{const c=e.target.closest('.card');if(c)open(c.dataset.id)};
document.getElementById('close').onclick=close;scrim.onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
render();
if(location.hash) open(location.hash.slice(1),false);
</script>
</body>
</html>
