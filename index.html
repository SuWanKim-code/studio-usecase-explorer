니다. 범용 챗봇에 서류를 통째로 넣으면 그럴듯한 숫자를 채워 넣을 수 있지만, 이렇게 단계를 나누면 어느 서류의 어느 숫자가 어긋났는지 바로 보입니다.", "difficulty": "중급"}, {"uid": "U072", "i": 71, "no": 37, "pattern": "검증", "industry": "제조·건설", "dept": ["품질·생산", "영업·영업지원"], "task": "도면이 표준 규격서에 맞는지 검증한다", "title": "도면이 표준 규격에 맞는지 검사", "oneliner": "도면의 재질·공차·도장을 규격서 조항과 대조합니다", "story": "제조·건설 회사의 품질 담당자는 협력사가 보낸 도면이 발주처가 정한 표준 규격서와 공사 시방서(공사를 어떤 재료와 방법으로 할지 적은 문서)에 맞는지 확인합니다. 도면 귀퉁이의 표제란과 작은 글씨의 주기를 하나씩 읽고, 규격서의 해당 조항을 찾아 비교해야 해서 시간이 오래 걸리고 놓치는 항목이 생기기 쉽습니다. 개정 도면이 오면 무엇이 바뀌었는지도 따로 찾아야 합니다. 워크플로우는 도면과 규격서에서 필요한 값을 뽑아 조항별로 맞춰 보고, 어긋난 항목과 근거 조항을 목록으로 정리해 줍니다.", "terms": [{"term": "시방서", "desc": "공사나 제작에 쓸 재료, 품질, 작업 방법을 글로 정해 둔 문서입니다. 도면이 그림이라면 시방서는 설명서입니다."}, {"term": "표제란·주기", "desc": "표제란은 도면 오른쪽 아래에 도면 번호, 개정 차수, 재질 등을 적는 칸이고, 주기는 도면 여백에 적는 보충 설명입니다."}, {"term": "치수 공차", "desc": "치수가 설계값에서 얼마까지 벗어나도 괜찮은지 허용하는 범위입니다. 예를 들어 100±0.5mm라면 99.5~100.5mm까지 합격입니다."}, {"term": "도장 사양", "desc": "부품 겉면에 칠하는 페인트의 종류, 두께, 횟수 같은 조건입니다."}, {"term": "개정 차수", "desc": "도면을 고친 횟수를 나타내는 번호입니다. Rev.1, Rev.2처럼 붙습니다."}], "docs": [{"name": "도면(PDF·스캔본)", "desc": "검사 대상입니다. 표제란과 주기에서 재질, 공차, 도장, 적용 규격을 봅니다."}, {"name": "발주처 표준 규격서", "desc": "주문한 회사가 정한 기준입니다. 재질 최소 등급, 공차, 도장 조건 조항을 봅니다."}, {"name": "공사 시방서", "desc": "이 공사에 적용할 재료와 작업 방법 조항을 봅니다."}, {"name": "이전 개정 도면", "desc": "직전 버전 도면입니다. 이번에 바뀐 항목이 무엇인지 비교하는 데 씁니다."}], "fields": ["도면 번호", "개정 차수", "적용 규격과 개정 연도", "재질", "치수 공차", "도장 사양"], "key": "도면 번호: 같은 도면의 새 버전과 이전 버전, 관련 규격을 잇는 번호", "check": "도면에 적힌 재질·공차·도장이 규격서와 시방서의 해당 조항 기준을 만족하는지 비교합니다.", "exceptions": ["도면 재질은 SS275인데 규격서는 최소 SS400 이상을 요구함", "도면에 적용 규격 이름만 있고 몇 년도 개정판인지 빠져 있음", "개정 도면에서 도장 두께만 바뀌어 그 항목만 다시 확인해야 함"], "output": "불일치 항목과 근거 조항 목록, 도면별 승인 또는 보완 요청 판정", "steps": [{"node": "Parse", "what": "스캔본을 포함한 도면과 규격서, 시방서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "읽은 문서를 도면, 규격서, 시방서, 이전 개정 도면으로 나눕니다"}, {"node": "Extract ×3", "what": "도면에서는 재질·공차·도장을, 규격서와 시방서에서는 해당 조항의 기준값을 뽑습니다"}, {"node": "Merge", "what": "문서별로 뽑은 값을 도면 번호 기준으로 한 표에 모읍니다"}, {"node": "Match", "what": "도면 항목마다 대응하는 규격서·시방서 조항을 짝지어 줍니다"}, {"node": "Validate", "what": "항목별로 기준을 만족하면 초록, 정보가 빠지면 노랑, 어긋나면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "불일치 이유와 근거 조항을 문장으로 정리하고 승인 또는 보완 요청 의견을 씁니다"}], "problem": "협력사가 보내는 도면은 한 공사에만 수십 장에서 수백 장이고, 규격서와 시방서는 수백 쪽에 이르는 두꺼운 문서입니다. 담당자는 재질 등급 하나를 확인하려고 규격서를 넘겨 조항을 찾고, 도면마다 같은 과정을 되풀이합니다. 기준에 못 미치는 재질이나 도장 조건이 그대로 승인되면 제작이 끝난 뒤 다시 만들거나 발주처 검사에서 반려되어 비용과 일정이 함께 밀립니다.", "why": "이 업무는 도면에서 값을 읽는 일과 규격서 조항과 견주는 일이 성격이 다른 작업인데, 사람이나 범용 챗봇에 통째로 맡기면 어느 쪽에서 틀렸는지 알 수 없습니다. Studio는 읽기, 추출, 대조, 판정을 노드로 나누어 재질을 잘못 읽은 것인지 기준 조항을 잘못 찾은 것인지 단계별로 확인할 수 있습니다. 또 뽑은 값마다 도면과 규격서의 어느 위치에서 가져왔는지 남기 때문에 검토자가 원문을 바로 펼쳐 볼 수 있습니다.", "difficulty": "중급"}, {"uid": "U073", "i": 72, "no": 42, "pattern": "검증", "industry": "제조·건설", "dept": ["품질·생산"], "task": "수입검사 성적서가 규격 범위 안인지 확인한다", "title": "원료 시험 결과가 기준 안인지 확인", "oneliner": "원료 성적서 값이 규격 범위 안인지 판정합니다", "story": "제조 회사의 품질 담당자는 원료가 들어오면 공급사가 보낸 성적서(CoA, 원료를 시험한 결과표)의 값이 우리 회사 원료 규격서의 허용 범위 안인지 확인합니다. 시험 항목이 많고 공급사마다 단위나 표기 방식이 달라, 사람이 비교하다 보면 상한을 살짝 넘은 값이나 빠진 항목을 놓치기 쉽습니다. 워크플로우는 성적서와 규격서에서 항목별 값을 뽑아 비교하고, 적합·부적합·누락을 판정해 입고 승인 여부를 정리해 줍니다.", "terms": [{"term": "CoA(성적서)", "desc": "Certificate of Analysis의 줄임말로, 공급사가 원료를 시험한 결과를 적어 보내는 증명서입니다."}, {"term": "원료 규격서", "desc": "우리 회사가 받아들일 원료의 조건을 정한 기준표입니다. 항목마다 허용 범위가 적혀 있습니다."}, {"term": "로트 번호", "desc": "같은 날, 같은 조건으로 함께 만든 원료 묶음에 붙는 번호입니다."}, {"term": "입고 승인/보류", "desc": "들어온 원료를 창고에 받아 쓸지, 문제를 확인할 때까지 멈출지 정하는 판단입니다."}], "docs": [{"name": "공급사 성적서(CoA)", "desc": "로트별 시험 항목과 결과 값, 단위를 봅니다."}, {"name": "원료 규격서", "desc": "항목별 허용 범위(최소·최대)를 봅니다."}, {"name": "입고 현품 로트 정보", "desc": "실제 들어온 원료의 로트 번호와 제조일, 유효기한을 봅니다."}], "fields": ["원료명", "로트 번호", "제조일과 유효기한", "시험 항목", "결과 값과 단위", "허용 범위"], "key": "원료명과 로트 번호: 성적서와 실제 들어온 원료, 규격서를 같은 원료로 잇는 값", "check": "성적서의 시험 값이 원료 규격서에 적힌 항목별 허용 범위 안에 있는지 판정합니다.", "exceptions": ["수분 함량이 규격 상한 0.5%인데 성적서 값은 0.52%", "규격서에는 중금속 항목이 있는데 성적서에는 빠져 있음", "규격서는 ppm, 성적서는 %로 적혀 단위 환산이 필요함"], "output": "항목별 적합/부적합/누락 판정표와 로트별 입고 승인 또는 보류", "steps": [{"node": "Parse", "what": "성적서와 규격서, 로트 정보를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "읽은 문서를 성적서, 규격서, 입고 로트 정보로 나눕니다"}, {"node": "Extract ×2", "what": "성적서에서는 시험 결과 값과 단위를, 규격서에서는 항목별 허용 범위를 뽑습니다"}, {"node": "Merge", "what": "원료와 로트별로 결과 값과 기준을 한 표에 모읍니다"}, {"node": "Match", "what": "원료명과 로트 번호, 시험 항목으로 결과와 기준을 짝지어 줍니다"}, {"node": "Validate", "what": "범위 안이면 초록, 항목이 빠지거나 단위 확인이 필요하면 노랑, 범위를 넘으면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "판정 결과를 근거로 입고 승인 또는 보류 의견을 씁니다"}], "problem": "원료는 로트 단위로 거의 매일 들어오고, 성적서 한 장에 시험 항목이 십수 개씩 있어 하루에 확인할 숫자가 수백 개에 이릅니다. 담당자는 성적서를 받을 때마다 규격서를 옆에 펴 두고 값을 하나씩 눈으로 견줍니다. 기준을 벗어난 원료가 그대로 투입되면 제품 전체 로트를 폐기하거나 회수해야 하고, 의약품이나 식품이라면 규정 위반으로 이어집니다.", "why": "값이 범위 안인지는 숫자 규칙으로 정해지는 일이고, 단위가 달라 환산이 필요한지, 항목이 아예 없는지는 맥락 판단이 필요한 일입니다. Studio는 규칙 검사(Validate)와 맥락 판단(Instruct)을 나누어, 범위 비교는 매번 같은 기준으로 수행하고 단위 환산이 걸린 건은 추측하지 않고 '검토 필요'로 넘깁니다. 한 번 정한 규격 기준(스키마)이 성적서가 들어올 때마다 똑같이 적용되므로 담당자가 바뀌어도 판정이 흔들리지 않습니다.", "difficulty": "중급"}, {"uid": "U074", "i": 73, "no": 45, "pattern": "검증", "industry": "제조·건설", "dept": ["법무·준법", "품질·생산"], "task": "화학물질 규제 대응 문서를 관리한다", "title": "규제 화학물질 쓰는 제품 찾기", "oneliner": "규제 대상 물질이 어느 제품에 들어가는지 찾아냅니다", "story": "화학 원료를 쓰는 제조 회사의 담당자는 화학물질 규제가 바뀌면, 새로 규제 대상이 된 물질이 우리 제품 어디에 들어가는지 찾아 고객사 문의에 답해야 합니다. 원료마다 MSDS(물질 안전 정보 문서)를 열어 성분을 확인해야 하고, 같은 원료를 여러 제품에 쓰기 때문에 하나라도 놓치기 쉽습니다. 워크플로우는 규제 목록의 CAS 번호를 MSDS와 원료 목록에 맞춰 영향받는 제품과 빠진 서류를 찾고, 고객 회신 초안까지 써 줍니다.", "terms": [{"term": "MSDS(물질안전보건자료)", "desc": "화학 제품에 어떤 성분이 얼마나 들어 있고, 어떻게 다뤄야 안전한지 적은 문서입니다."}, {"term": "CAS 번호", "desc": "전 세계 화학물질마다 붙는 고유 번호입니다. 이름이 달라도 번호가 같으면 같은 물질입니다."}, {"term": "함량", "desc": "제품이나 원료 안에 그 물질이 얼마나 들어 있는지를 비율로 나타낸 값입니다."}, {"term": "원료 상품명", "desc": "공급사가 원료에 붙인 판매용 이름입니다. 이름만으로는 성분을 알기 어렵습니다."}], "docs": [{"name": "MSDS(공급사)", "desc": "원료에 든 물질명, CAS 번호, 함량, 개정일을 봅니다."}, {"name": "제품별 원료 목록", "desc": "어떤 제품에 어떤 원료를 쓰는지 봅니다."}, {"name": "규제 개정 자료(대상 물질 목록)", "desc": "새로 규제되는 물질의 이름과 CAS 번호를 봅니다."}, {"name": "고객사 문의서", "desc": "고객이 어떤 제품, 어떤 물질에 대해 물었는지 봅니다."}], "fields": ["물질명", "CAS 번호", "함량", "원료 상품명", "사용 제품", "MSDS 개정일"], "key": "CAS 번호: 이름이 제각각인 화학물질을 하나로 잇는 국제 고유 번호", "check": "규제 대상 물질의 CAS 번호를 MSDS와 원료 목록에 맞춰 보고, 영향받는 제품과 빠진 서류를 판정합니다.", "exceptions": ["원료 MSDS에 '영업비밀'로 성분이 가려져 CAS 번호를 알 수 없음", "원료를 바꿨는데 MSDS는 예전 원료 버전이 남아 있음", "같은 원료를 쓰는 다른 제품이 영향 목록에서 빠짐"], "output": "영향받는 제품 목록, 누락 서류 목록, 고객사 회신 초안", "steps": [{"node": "Parse", "what": "MSDS, 원료 목록, 규제 자료, 고객 문의서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "읽은 문서를 MSDS, 원료 목록, 규제 자료, 고객 문의로 나눕니다"}, {"node": "Extract ×3", "what": "MSDS에서는 성분과 CAS 번호를, 원료 목록에서는 제품과 원료를, 규제 자료에서는 대상 물질을 뽑습니다"}, {"node": "Merge", "what": "원료와 제품, 성분을 하나의 표로 이어 붙입니다"}, {"node": "Match", "what": "CAS 번호로 규제 대상 물질과 원료 성분을 짝지어 영향 제품을 찾습니다"}, {"node": "Validate", "what": "해당 없으면 초록, 성분 미공개나 구버전 MSDS면 노랑, 규제 물질 포함이면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "고객 문의에 맞춰 영향 제품과 보완 계획을 담은 회신 초안을 씁니다"}], "problem": "규제 개정은 한 번에 수십 개 물질이 추가되기도 하고, 회사가 쓰는 원료는 수백 종에 이르며 원료마다 MSDS가 수십 쪽입니다. 담당자는 개정이 있을 때마다 모든 MSDS를 다시 열어 CAS 번호를 찾아야 하고, 그 사이 고객사 문의는 답변 기한이 정해져 있습니다. 영향받는 제품을 빠뜨린 채 '해당 없음'으로 회신하면 규정 위반이자 고객 신뢰 문제로 번집니다.", "why": "물질 이름은 공급사마다 다르게 적지만 CAS 번호는 하나이므로, 이 번호를 키로 규제 목록, MSDS, 원료 목록을 한 행에 묶는(Match) 구조가 핵심입니다. 그러면 영향받는 제품뿐 아니라 CAS 번호가 비어 있는 원료도 빈칸으로 바로 드러납니다. 또 MSDS를 한 번 읽어 컬렉션에 쌓아 두면 다음 규제 개정이나 다른 고객 문의가 올 때 같은 문서를 다시 읽지 않고 그 결과를 근거로 쓸 수 있습니다.", "difficulty": "중급"}, {"uid": "U075", "i": 74, "no": 110, "pattern": "검증", "industry": "제조·건설", "dept": ["재무·회계", "법무·준법"], "task": "하도급 대금 지급 서류가 계약과 법정 지급기일에 맞는지 확인한다", "title": "하도급 대금 지급 기한 확인", "oneliner": "서류 날짜를 모아 법정 지급 기한을 넘기는지 봅니다", "story": "제조·건설 회사의 재무·법무 담당자는 일을 맡긴 협력사에 대금을 법이 정한 기한 안에 주는지 확인합니다. 하도급법에서는 일반적으로 물건을 받은 날부터 60일 안에 대금을 주도록 하고, 계약서는 일을 시작하기 전에 서면으로 줘야 합니다. 계약서, 검수 확인서, 세금계산서, 지급 내역에 날짜가 흩어져 있어 어느 날짜를 기준으로 할지 헷갈리기 쉽습니다. 워크플로우는 서류별 날짜와 금액을 모아 거래별 타임라인을 만들고 기한이 임박하거나 넘긴 건을 찾아 줍니다.", "terms": [{"term": "하도급", "desc": "맡은 일의 일부를 다른 회사에 다시 맡기는 것입니다. 맡긴 쪽이 원사업자, 받은 쪽이 협력사입니다."}, {"term": "법정 지급기일", "desc": "법이 정한 대금 지급 마감일입니다. 일반적으로 목적물을 받은 날부터 60일 이내로 알려져 있습니다."}, {"term": "목적물 수령일", "desc": "협력사가 만든 물건이나 끝낸 작업을 실제로 넘겨받은 날입니다."}, {"term": "검수", "desc": "받은 물건이 주문대로인지 확인하는 일입니다."}, {"term": "세금계산서", "desc": "거래 금액과 부가세를 적어 세무서에 신고하는 거래 증빙 서류입니다."}], "docs": [{"name": "하도급 계약서", "desc": "계약일(서면을 준 날)과 계약 금액을 봅니다."}, {"name": "검수 확인서·인수증", "desc": "물건을 받은 날과 검수 금액을 봅니다."}, {"name": "세금계산서", "desc": "발행일과 공급가, 부가세를 봅니다."}, {"name": "지급 내역", "desc": "실제 지급일과 지급 예정일, 금액을 봅니다."}, {"name": "작업일보", "desc": "협력사가 실제로 작업을 시작한 날을 봅니다."}], "fields": ["계약일(서면 발급일)", "작업 착수일", "목적물 수령일", "계약·검수·계산서 금액", "지급 예정일"], "key": "협력사명과 계약 건: 한 거래에 속한 여러 서류를 잇는 값", "check": "수령일부터 지급 예정일까지 60일을 넘는지, 서면 발급이 착수보다 늦은지, 서류끼리 금액이 같은지 판정합니다.", "exceptions": ["작업일보상 착수일이 계약서 날짜보다 일주일 빠름", "세금계산서 발행일 기준으로는 50일이지만 수령일 기준으로는 65일", "계약서는 부가세 별도, 계산서는 부가세 포함이라 금액이 달라 보임"], "output": "거래별 날짜 타임라인과 지급 기한 임박·위반 의심 목록", "steps": [{"node": "Parse", "what": "계약서, 검수 확인서, 세금계산서, 지급 내역, 작업일보를 읽습니다"}, {"node": "Classify", "what": "읽은 문서를 다섯 종류로 나눕니다"}, {"node": "Extract ×4", "what": "계약서, 검수 확인서, 세금계산서, 지급 내역·작업일보에서 날짜와 금액을 뽑습니다"}, {"node": "Merge", "what": "협력사와 계약 건별로 날짜를 시간 순서대로 합칩니다"}, {"node": "Validate", "what": "기한 안이면 초록, 임박하거나 금액 확인이 필요하면 노랑, 60일 초과나 착수 후 서면 발급이면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "어느 날짜를 기준으로 봤는지와 위반 의심 이유를 문장으로 정리합니다"}], "problem": "협력사가 수십 곳이면 매달 확인할 거래 건도 수십에서 수백 건이고, 건마다 계약서, 검수 확인서, 세금계산서, 지급 내역을 모두 열어 날짜를 옮겨 적어야 합니다. 담당자는 보통 지급일이 다가와서야 확인을 시작하므로 이미 기한을 넘긴 뒤에 발견하는 경우가 생깁니다. 지급 기한을 넘기면 지연이자(늦게 준 날수만큼 붙는 이자)를 물어야 하고, 서면 계약 없이 일을 시작하게 한 것이 드러나면 법 위반으로 과징금 같은 제재를 받을 수 있습니다.", "why": "이 업무는 다섯 종류 서류의 날짜를 거래 건별로 시간순으로 늘어놓아야 비로소 판단이 가능하므로, 한 거래에 속한 서류를 협력사와 계약 건 기준으로 한 행에 모으는(Merge) 단계가 필요합니다. 서류 하나가 없는 거래는 그 자리가 비어 바로 드러납니다. 수령일부터 60일 초과나 착수 후 서면 발급은 규칙 검사(Validate)로 매번 같은 기준을 적용하고, 부가세 포함 여부처럼 금액이 달라 보이는 이유는 맥락 판단(Instruct)이 설명하므로 법적 기준이 담당자마다 달리 적용되는 일을 막습니다.", "difficulty": "중급"}, {"uid": "U076", "i": 75, "no": 217, "pattern": : "설비 관리대장으로 별칭을 설비 번호로 바꾸고 같은 설비·날짜끼리 짝짓습니다"}, {"node": "Validate", "what": "조치가 있으면 초록, 반복 이상이면 노랑, 조치 기록이 없으면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "반복되는 이상과 조치 누락 건을 설비별로 요약해 적습니다"}], "problem": "점검일지와 작업일보는 교대마다 손으로 써서 하루에도 수십 장씩 쌓이고, 담당자는 이것을 모아 설비 이력을 정리할 시간을 따로 내기 어렵습니다. 그래서 이상 메모는 종이에 남아 있어도 설비별로 모아서 보는 사람이 없는 상태가 이어집니다. 같은 이상이 며칠째 반복되는데 아무도 알아채지 못하면 설비가 갑자기 멈춰 생산 라인 전체가 서고, 안전사고로 이어질 수도 있습니다.", "why": "점검 기록과 조치 기록이 다른 문서에 흩어져 있으므로, 설비 번호와 날짜라는 같은 키로 두 문서를 한 행에 묶는(Match) 구조가 필요합니다. 그러면 이상 메모는 있는데 조치 기록이 없는 건이 빈칸으로 바로 드러나고, 별칭을 설비 번호로 바꾸는 일도 관리대장을 기준으로 매번 같은 방식으로 처리됩니다. 이렇게 정리한 결과를 컬렉션에 쌓아 두면 '이 설비에 어떤 이상이 반복됐나' 같은 질문에 답할 근거가 됩니다.", "difficulty": "중급"}, {"uid": "U078", "i": 77, "no": 214, "pattern": "생성", "industry": "제조·건설", "dept": ["품질·생산", "법무·준법"], "task": "안전보건경영 사후심사 메모로 심사 결과보고서 초안을 만든다", "title": "안전 심사 메모로 보고서 쓰기", "oneliner": "현장 심사 메모를 근거가 갖춰진 보고서 초안으로 만듭니다", "story": "제조 회사의 안전보건 담당자는 안전보건경영 인증의 사후심사(인증을 받은 뒤 정기적으로 다시 확인하는 심사)를 마치면 현장 메모를 바탕으로 결과보고서를 씁니다. 메모는 짧게 적혀 있어서, 부적합 판단에 근거 서류가 무엇인지 빠지거나 '기록이 없음'을 '하지 않음'으로 잘못 옮기는 일이 생깁니다. 워크플로우는 메모와 위험성평가서, 법규등록부에서 항목별 판단과 근거를 뽑아 빠진 부분을 확인하고 보고서 초안을 만들어 줍니다.", "terms": [{"term": "안전보건경영", "desc": "회사가 사고와 직업병을 막기 위해 계획, 실행, 점검을 체계적으로 하는 관리 방식입니다. ISO 45001 같은 인증이 있습니다."}, {"term": "사후심사", "desc": "인증을 받은 뒤에도 기준을 잘 지키는지 정기적으로 다시 확인하는 심사입니다."}, {"term": "위험성평가", "desc": "작업장에 어떤 위험이 있고 얼마나 심각한지 찾아 대책을 세우는 일입니다."}, {"term": "법규등록부", "desc": "회사가 지켜야 할 안전 관련 법 조항을 모아 정리한 목록입니다."}, {"term": "부적합", "desc": "기준을 만족하지 못했다는 판정입니다."}], "docs": [{"name": "사후심사 현장 메모", "desc": "심사 항목별 적합·부적합 판단과 지적 사항을 봅니다."}, {"name": "위험성평가서", "desc": "판단의 근거가 될 위험 요인과 대책을 봅니다."}, {"name": "법규등록부", "desc": "관련 법 조항이 등록돼 있는지 봅니다."}, {"name": "이전 심사 결과보고서", "desc": "보고서 형식과 지난번 지적 사항을 봅니다."}], "fields": ["사업장", "심사 항목", "적합·부적합", "판단 근거", "지적 사항", "후속 조치와 기한"], "key": "사업장과 심사 항목: 메모의 판단과 근거 문서, 지난 결과를 잇는 값", "check": "메모의 적합·부적합 판단마다 근거와 후속 조치가 적혀 있는지 검증합니다.", "exceptions": ["'부적합'으로 적혔지만 어떤 서류를 보고 판단했는지 언급이 없음", "메모의 '교육 기록 없음'이 보고서에 '교육 미실시'로 옮겨짐", "지적 사항은 있는데 후속 조치와 기한 칸이 비어 있음"], "output": "심사 결과보고서 초안과 근거 보완이 필요한 항목", "steps": [{"node": "Parse", "what": "현장 메모, 위험성평가서, 법규등록부, 이전 보고서를 읽습니다"}, {"node": "Classify", "what": "읽은 문서를 심사 메모와 근거 문서로 나눕니다"}, {"node": "Extract ×2", "what": "메모에서는 항목별 판단과 지적을, 근거 문서에서는 관련 위험 요인과 법 조항을 뽑습니다"}, {"node": "Merge", "what": "심사 항목별로 판단과 근거를 한 표에 합칩니다"}, {"node": "Validate", "what": "근거와 조치가 있으면 초록, 표현 확인이 필요하면 노랑, 근거나 조치가 빠지면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "메모 원래 뜻을 살려 이전 보고서 형식에 맞춘 결과보고서 초안을 씁니다"}], "problem": "사후심사 결과보고서는 심사 후 정해진 기한 안에 인증기관에 내야 하고, 심사 항목이 수십 개라 항목마다 근거 문서를 찾아 붙이는 데 며칠이 걸립니다. 담당자는 현장 메모 외에 위험성평가서와 법규등록부를 따로 뒤져 어느 문서의 어느 부분이 근거인지 다시 찾아야 합니다. 근거 없는 부적합 판정은 현장 부서와 다툼의 원인이 되고, 표현이 잘못 옮겨진 보고서는 인증 유지 여부를 가르는 판단 자료가 되므로 되돌리기 어렵습니다.", "why": "이 업무는 짧은 메모를 그대로 옮기는 일과 근거를 붙이는 일로 나뉘는데, 범용 챗봇에 메모를 통째로 넣고 보고서를 쓰게 하면 '기록 없음'을 '미실시'로 바꿔 쓰는 식의 변형을 걸러 낼 방법이 없습니다. Studio는 근거와 후속 조치가 있는지를 규칙 검사(Validate)로 먼저 가리고, 문장 작성은 맥락 판단(Instruct)이 맡되 표현 확인이 필요한 항목은 '검토 필요'로 사람에게 넘깁니다. 뽑은 판단마다 메모와 근거 문서의 어느 위치에서 가져왔는지 남아 보고서 검토자가 원문을 바로 확인할 수 있습니다.", "difficulty": "중급"}, {"uid": "U079", "i": 78, "no": 44, "pattern": "대조", "industry": "제조·건설", "dept": ["재무·회계"], "task": "기성 청구서를 계약 내역과 물량에 대조한다", "title": "공사 대금 청구 물량 확인", "oneliner": "이번 청구와 지난 누계가 계약 물량을 넘는지 판정합니다", "story": "건설 회사의 재무 담당자는 협력사가 공사한 만큼 돈을 달라고 보낸 기성 청구서(공사 진행분에 대한 대금 청구서)를 계약 내역과 비교해 지급 여부를 정합니다. 이번 달 청구만 보면 정상이어도 지난번까지 받은 물량을 더하면 계약을 넘는 경우가 있고, 변경 계약까지 함께 봐야 해서 계산이 복잡합니다. 워크플로우는 공종별로 계약, 변경, 지난 누계, 이번 청구 물량을 모아 더해 보고 초과나 단가 불일치를 찾아 줍니다.", "terms": [{"term": "기성", "desc": "공사가 진행된 만큼의 실적을 말합니다. 기성 청구는 '여기까지 했으니 그만큼 돈을 달라'는 요청입니다."}, {"term": "공종", "desc": "공사를 종류별로 나눈 단위입니다. 철근 공사, 타일 공사처럼 나뉩니다."}, {"term": "계약 내역서", "desc": "공종별 물량과 단가를 정리한 계약서의 상세 표입니다."}, {"term": "변경 계약", "desc": "공사 중 물량이나 설계가 바뀌어 계약 내용을 고친 것입니다."}, {"term": "누계", "desc": "처음부터 지금까지 쌓인 합계입니다."}], "docs": [{"name": "기성 청구서", "desc": "이번에 청구한 공종별 물량과 금액을 봅니다."}, {"name": "계약 내역서", "desc": "공종별 계약 물량과 단가를 봅니다."}, {"name": "변경 계약 내역", "desc": "늘거나 줄어든 물량과 그 근거를 봅니다."}, {"name": "전회 기성 내역", "desc": "지난번까지 지급한 누계 물량을 봅니다."}, {"name": "시공 물량 확인서", "desc": "현장에서 실제 시공했다고 확인한 물량을 봅니다."}], "fields": ["공종과 규격", "계약 물량과 단가", "지난번까지 누계 물량", "이번 청구 물량", "청구 금액", "변경 근거"], "key": "공종과 규격: 여러 문서에서 같은 공사 항목을 찾아 잇는 값", "check": "지난 누계와 이번 청구 물량을 더한 값이 변경을 포함한 계약 물량을 넘는지, 단가가 계약과 같은지 판정합니다.", "exceptions": ["이번 달 청구는 100㎡로 정상이지만 누계를 더하면 계약 1,000㎡를 50㎡ 넘음", "변경 계약 근거 없이 추가 물량이 청구됨", "지난번에 이미 받은 물량이 이번 청구에 다시 들어감"], "output": "공종별 초과·불일치 목록과 지급 승인 또는 보류 판정", "steps": [{"node": "Parse", "what": "청구서, 계약 내역서, 변경 내역, 지난 기성 내역, 물량 확인서를 표로 읽습니다"}, {"node": "Classify", "what": "읽은 문서를 청구, 계약, 변경, 지난 기성, 확인서로 나눕니다"}, {"node": "Extract ×3", "what": "청구서, 계약·변경 내역, 지난 기성 내역에서 공종별 물량과 단가를 뽑습니다"}, {"node": "Merge", "what": "공종별로 계약, 변경, 누계, 이번 청구 값을 한 표에 모읍니다"}, {"node": "Match", "what": "공종과 규격으로 같은 항목끼리 짝을 맞추고 물량 확인서 값과도 연결합니다"}, {"node": "Validate", "what": "누계가 계약 안이면 초록, 근거 확인이 필요하면 노랑, 초과나 단가 불일치면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "공종별 초과 이유를 문장으로 정리하고 지급 승인 또는 보류 의견을 씁니다"}], "problem": "공사 한 현장에는 공종이 수십 개이고 협력사도 여러 곳이라, 매달 기성 청구가 수십 건씩 들어옵니다. 담당자는 청구서마다 계약 내역서, 변경 계약, 지난 기성 내역을 꺼내 공종별로 더하고 빼는 계산을 되풀이합니다. 초과 지급이나 중복 지급은 한번 나가면 돌려받기 어렵고, 계약에 없는 물량을 지급하면 감사(회사 돈이 제대로 쓰였는지 확인하는 점검)에서 지적 사항이 됩니다.", "why": "이 일은 다섯 가지 문서의 숫자를 공종이라는 같은 키로 한 행에 모아야 비로소 계산이 가능합니다. Studio는 Match로 계약, 변경, 누계, 이번 청구를 한 행에 묶어 어느 문서에 없는 공종이나 단가가 다른 항목이 바로 드러나게 합니다. 또 누계가 계약을 넘는지는 규칙 검사(Validate)로 매번 같은 기준을 적용하고, 변경 근거가 있는지 같은 맥락 판단은 Instruct에서 따로 하므로 사람이 보아야 할 건만 남습니다.", "difficulty": "심화"}, {"uid": "U080", "i": 79, "no": 46, "pattern": "입력", "industry": "제조·건설", "dept": ["품질·생산", "고객지원"], "task": "품질 클레임 리포트 이력을 찾아볼 수 있게 남긴다", "title": "품질 불만 재발 이력 찾기", "oneliner": "새 불량 접수 건이 예전에 있던 문제인지 찾아 줍니다", "story": "제조 회사의 품질 담당자는 고객이 불량을 알려 오면, 예전에 같은 문제가 있었는지와 그때 어떤 조치를 했는지 과거 8D 리포트(불량 원인과 대책을 8단계로 정리한 보고서)에서 찾아봅니다. 같은 불량도 사람마다 '긁힘', '표면 손상'처럼 다르게 적어서 검색이 잘 안 되고, 완료라고 표시된 조치에 결과 증빙이 없는 경우도 있습니다. 워크플로우는 이번 클레임을 과거 기록과 맞춰 재 e", "what": "모두 반영되면 초록, 증빙이 없으면 노랑, 누락되거나 조건이 다르면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "누락 이유와 담당 부서를 적어 대응표 초안을 완성합니다"}], "problem": "입찰 한 건의 요구사항은 RFP, 시방서, 질의회신서에 걸쳐 수십에서 수백 개가 흩어져 있고, 제출 마감은 보통 몇 주 안으로 정해져 있습니다. 담당자는 요구사항을 읽는 동시에 제안서와 견적서를 함께 고쳐야 해서, 한쪽 문서를 고친 뒤 다른 문서를 다시 확인할 시간이 부족합니다. 필수 서류나 증빙이 하나라도 빠지면 내용이 아무리 좋아도 입찰 자격 자체를 잃을 수 있습니다.", "why": "요구사항마다 제안서에 답이 있는지, 견적에 금액이 있는지, 증빙이 붙어 있는지를 따로 확인해야 하므로, 여러 문서를 요구사항 번호라는 같은 키로 한 행에 묶는(Match) 구조가 필요합니다. 그러면 답은 있는데 견적이 빠진 항목이 빈칸으로 바로 보입니다. 범용 챗봇에 문서를 통째로 넣으면 '모두 반영됐다'고 요약해 버릴 수 있지만, Studio는 뽑은 요구사항마다 원문 위치가 남아 담당자가 해당 조항을 바로 확인할 수 있습니다.", "difficulty": "심화"}, {"uid": "U082", "i": 81, "no": 47, "pattern": "검증", "industry": "식품·화장품", "dept": ["품질·생산", "마케팅·심의"], "task": "식품 포장 표시문안이 규정에 맞는지 검수한다", "title": "식품 포장 글자 최종 검수", "oneliner": "포장 시안 문구가 확정 문안, 표시 규정과 맞는지 봅니다", "story": "식품 회사 품질팀 담당자는 새 포장 디자인 시안이 나오면 인쇄 전에 글자를 한 줄씩 확인합니다. 확정된 표시문안(포장에 반드시 들어가야 하는 공식 문구)과 시안을 눈으로 비교하다 보면 알레르기 물질 한 단어나 숫자 하나가 빠진 것을 놓치기 쉽습니다. 한 번 인쇄되면 회수와 재인쇄 비용이 크고, 알레르기 표시 누락은 소비자 안전 문제로 이어집니다. 워크플로우는 시안과 확정 문안에서 같은 항목을 뽑아 나란히 비교하고, 표시 기준에 어긋나는 부분을 근거 조항과 함께 알려 줍니다.", "terms": [{"term": "표시문안", "desc": "포장에 인쇄할 제품명, 원재료, 영양성분 같은 문구를 확정해 둔 원고입니다. 법으로 정해진 항목이 꼭 들어가야 합니다."}, {"term": "포장 시안", "desc": "디자이너가 만든 포장 디자인 초안입니다. 인쇄 전에 문구가 맞는지 검수합니다."}, {"term": "알레르기 유발물질", "desc": "우유, 밀, 땅콩처럼 일부 사람에게 알레르기를 일으킬 수 있어 포장에 반드시 표시해야 하는 원료입니다."}, {"term": "표시 기준", "desc": "식품 포장에 무엇을 어떤 방식으로 적어야 하는지 정한 규정입니다."}], "docs": [{"name": "확정 표시문안", "desc": "포장에 들어갈 정답 문구입니다. 비교의 기준이 됩니다."}, {"name": "포장 시안(PDF/이미지)", "desc": "실제 인쇄될 디자인입니다. 여기 적힌 글자를 문안과 대조합니다."}, {"name": "검수 체크리스트", "desc": "검수할 때 꼭 확인할 항목 목록입니다."}, {"name": "표시 기준 가이드", "desc": "표시 규정을 정리한 자료입니다. 위반 여부와 근거 조항을 찾을 때 씁니다."}], "fields": ["제품명", "원재료명과 적힌 순서", "알레르기 유발물질", "영양성분 숫자", "내용량", "보관방법"], "key": "제품명: 시안과 확정 문안이 같은 제품인지 묶어 주는 값", "check": "포장 시안의 문구를 확정 문안과 항목별로 비교하고, 표시 기준을 어긴 곳이 있는지 판정합니다.", "exceptions": ["확정 문안에는 '우유, 대두'인데 시안에는 '우유'만 있음", "원재료 순서가 '밀가루, 설탕'에서 '설탕, 밀가루' xport", "what": "차이 목록과 청구액을 저장합니다"}], "problem": "터미널마다 걷어 온 승차권을 운행 편별로 나눠 세는 일은 매달 며칠씩 걸리고, 중간에 끊기면 어디까지 셌는지 몰라 처음부터 다시 하게 됩니다. 장수가 틀리면 터미널에 청구하는 금액이 달라지는데, 적게 세면 회사가 받을 돈을 놓치고 많게 세면 터미널과 다툼이 생깁니다. 다툼이 생겼을 때 어떤 편에서 차이가 났는지 근거를 대려면 승차권 묶음을 다시 뒤져야 합니다.", "why": "터미널마다 승차권 양식이 달라 금액 위치가 제각각인데, Studio는 양식을 미리 등록하지 않고 권종과 금액이라는 항목 설명만으로 읽어 냅니다. 운행일, 노선, 출발 시각을 키로 승차권 합계와 일지 승객 수를 한 행에 묶어(Merge) 차이가 난 편만 골라내고, 뽑은 값마다 어느 승차권 이미지의 어느 위치에서 읽었는지 남아 터미널과 다툴 때 근거로 쓸 수 있습니다. 모바일 승차분처럼 차이가 정상인 경우는 Instruct가 이유를 적어 사람이 확인하게 넘깁니다.", "difficulty": "심화"}, {"uid": "U096", "i": 95, "no": 85, "pattern": "입력", "industry": "버스·항공", "dept": ["고객지원"], "task": "민원을 접수하고 분류해 처리 이력을 남긴다", "title": "버스 민원 분류와 처리 이력 정리", "oneliner": "민원을 운행 편과 맞추고 조치 누락을 찾습니다", "story": "버스 회사의 고객지원 담당자는 승객 민원을 접수해 유형별로 나누고, 어느 운행 편에서 생긴 일인지 확인해 처리 이력을 남깁니다. 승객이 탑승 시각을 잘못 말하거나 같은 승객이 다시 문의해 별도 건으로 쌓이면 이력이 꼬입니다. 종결로 표시했는데 실제 조치 기록이 없는 경우도 생깁니다. 워크플로우는 민원의 탑승 정보를 승차권과 운행일지에 맞추고, 조치 기록이 빠진 건을 찾아 줍니다.", "terms": [{"term": "민원", "desc": "서비스에 대한 불편이나 요청을 회사에 알리는 것입니다."}, {"term": "운행일지", "desc": "버스 기사가 운행마다 출발 시각과 승객 수를 적는 기록입니다."}, {"term": "종결", "desc": "민원 처리를 마쳤다고 표시하는 것입니다."}], "docs": [{"name": "민원 접수대장", "desc": "접수일시, 민원 내용, 처리 상태를 봅니다."}, {"name": "승차권(사진)", "desc": "승객이 보낸 승차권 사진에서 탑승일과 출발 시각을 봅니다."}, {"name": "운행일지", "desc": "그 시각에 실제로 운행한 편을 봅니다."}, {"name": "답변·조치 기록", "desc": "어떤 답변과 현장 조치를 했는지 봅니다."}], "fields": ["접수일시", "탑승일·출발 시각", "노선(출발지·도착지)", "민원 유형", "조치 내용·종결 여부"], "key": "운행일 + 노선 + 출발 시각: 버스 한 편을 가리키는 값으로 민원과 운행 기록을 연결합니다.", "check": "민원의 탑승 정보를 승차권과 운행일지에 맞추고, 종결 건 중 답변이나 조치 기록이 빠진 건을 찾습니다.", "exceptions": ["접수 시각(오후 6시)을 탑승 시각으로 잘못 적음", "종결로 표시했는데 현장 조치 기록이 없음", "같은 승객의 재문의가 새 민원으로 따로 접수됨"], "output": "민원 유형 분류 + 운행 편 불일치·조치 누락 목록", "steps": [{"node": "Parse", "what": "접수대장, 승차권 사진, 운행일지, 조치 기록을 읽습니다"}, {"node": "Classify", "what": "민원을 지연, 불친절, 분실물 같은 유형으로 나눕니다"}, {"node": "Extract ×3", "what": "민원, 승차권, 조치 기록에서 탑승 정보와 처리 내용을 뽑습니다"}, {"node": "Merge", "what": "같은 민원 건의 정보를 하나로 합칩니다"}, {"node": "Match", "what": "운행일, 노선, 출발 시각으로 운행일지의 편과 짝짓습니다"}, {"node": "Validate", "what": "운행 편이 맞는지, 종결 건에 조치 기록이 있는지 판정합니다"}, {"node": "Instruct", "what": "재문의 건을 묶고 누락 건에 대한 확인 메모를 씁니다"}, {"node": "Export", "what": "분류 결과와 누락 목록을 저장합니다"}], "problem": "민원은 접수된 순서대로 그날그날 처리하기 바빠서, 유형별 통계를 내거나 같은 기사나 노선에 민원이 몰리는지 돌아볼 여유가 없습니다. 어느 편에서 생긴 일인지 확정하지 못하면 해당 기사에게 사실을 확인할 수 없어 민원이 답변 없이 닫히고, 답을 받지 못한 승객은 외부 기관이나 공개 게시판에 다시 올립니다. 처리 이력이 정리되어 있지 않으면 감독 기관에 처리 결과를 보고할 때 대장을 다시 뒤져야 합니다.", "why": "민원 유형을 나누는 일, 운행 편을 찾는 일, 조치 기록이 있는지 보는 일은 각각 다른 종류의 작업이라 하나로 뭉쳐 시키면 어디서 틀렸는지 알 수 없습니다. Studio는 Classify가 유형을 나누고 Match가 운행일, 노선, 출발 시각으로 일지의 편을 찾으며 Validate가 종결 건에 조치 기록이 있는지 규칙으로 걸러 내므로 단계별로 결과를 확인할 수 있습니다. 같은 승객의 재문의를 하나로 묶는 판단은 Instruct가 따로 맡고, 정리된 결과를 컬렉션에 쌓아 두면 노선별 민원 통계나 보고 자료의 근거로 바로 쓸 수 있습니다.", "difficulty": "심화"}, {"uid": "U097", "i": 96, "no": 228, "pattern": "검증", "industry": "공공·법률", "dept": ["업종 현업"], "task": "정부 재정지원사업 공고문을 읽고 우리 기관이 신청할 수 있는지 가린다", "title": "정부 지원사업 신청 자격 확인", "oneliner": "지원사업 공고 요건을 우리 기관 정보와 비교합니다", "story": "대학이나 연구기관의 사업 담당자는 정부 지원사업 공고가 나오면 우리 기관이 신청할 수 있는지부터 따져 봅니다. 신청할 수 있는 기관 종류, 지역, 규모, 우리 돈을 얼마나 함께 내야 하는지, 다른 기관과 팀을 꾸려야 하는지 같은 요건이 공고문 곳곳에 흩어져 있습니다. 요건 하나만 놓쳐도 준비한 신청이 무효가 될 수 있습니다. 워크플로우는 공고 요건을 뽑아 기관 정보와 비교하고 요건별 충족 여부와 추가 준비 사항을 정리합니다.", "terms": [{"term": "재정지원사업", "desc": "정부가 기관에 돈을 지원해 정해진 목표의 사업을 하게 하는 제도입니다."}, {"term": "대응투자", "desc": "지원금을 받는 기관도 자기 돈을 일정 비율 함께 내는 것입니다."}, {"term": "컨소시엄", "desc": "여러 기관이 한 팀을 이뤄 함께 신청하는 형태입니다."}, {"term": "산학협력단", "desc": "대학 안에서 기업과의 공동 연구나 정부 과제 돈을 관리하는 조직입니다."}], "docs": [{"name": "재정지원사업 공고문", "desc": "신청 주체, 지역, 규모, 대응투자 등 요건을 확인합니다"}, {"name": "신청 안내", "desc": "접수 방법과 마감일, 세부 조건을 확인합니다"}, {"name": "기관 프로필", "desc": "우리 기관의 유형, 지역, 규모 정보입니다"}, {"name": "사업계획서 초안", "desc": "대응투자 계획과 참여기관 구성을 확인합니다"}], "fields": ["신청 주체·기관 유형", "지역 요건", "규모 요건", "대응투자 비율", "컨소시엄 요건", "접수 마감일"], "key": "공고 번호: 지원사업 공고마다 붙은 번호입니다", "check": "공고의 신청 주체, 유형, 지역, 규모, 대응투자, 컨소시엄 요건을 기관 프로필과 하나씩 비교합니다", "exceptions": ["신청 주체가 대학인지 산학협력단인지 모호하게 적힌 공고", "대응투자 20%가 필요한데 사업계획서에 재원이 없음", "컨소시엄이 필수인데 참여기관 칸이 비어 있음"], "output": "요건별 충족·미충족·추가 준비 목록과 신청 가능 판정", "steps": [{"node": "Parse", "what": "공고문과 기관 자료를 글자와 표로 읽습니다"}, {"node": "Extract ×2", "what": "공고 쪽 요건과 기관 쪽 정보를 각각 뽑습니다"}, {"node": "Match", "what": "요건 항목별로 공고 요건과 기관 정보를 짝짓습니다"}, {"node": "Validate", "what": "요건마다 충족, 미충족을 판정합니다"}, {"node": "Instruct", "what": "모호한 요건을 해석하고 신청 가능 여부와 준비할 일을 씁니다"}], "problem": "사업 담당자는 공고가 뜰 때마다 수십 쪽짜리 공고문과 신청 안내를 처음부터 읽으며 자격 요건을 메모하고, 같은 시기에 공고가 여러 개 나오면 이 일을 공고마다 되풀이합니다. 요건이 본문, 별표, 질의응답에 나뉘어 있고 '대학'에 산학협력단이 포함되는지 같은 해석이 필요한 문장도 많아 담당자마다 결론이 달라집니다. 자격이 안 되는 사업에 매달리면 사업계획서를 쓰는 데 들인 몇 주가 헛수고가 되고, 자격이 되는 사업을 놓치면 받을 수 있던 지원금을 잃습니다.", "why": "공고마다 양식이 달라도 양식을 미리 등록하지 않고 '신청 주체', '대응투자 비율', '컨소시엄 요건' 같은 항목 설명만으로 읽어 내므로 새 공고가 나와도 바로 돌릴 수 있습니다. 요건 항목별로 공고 요건과 기관 정보를 한 행에 짝지으면(Match) 충족한 것과 준비가 안 된 것이 한 표에서 보이고, 뽑은 요건마다 공고문의 어느 쪽에서 가져왔는지 남아 해석이 갈리는 문장을 사람이 바로 확인할 수 있습니다. 비율처럼 숫자로 판정되는 요건은 규칙 검사(Validate)로, 신청 주체가 모호한 문장은 맥락 판단(Instruct)으로 넘겨 추측 대신 '확인 필요'로 남깁니다.", "difficulty": "입문"}, {"uid": "U098", "i": 97, "no": 88, "pattern": "검증", "industry": "공공·법률", "dept": ["법무·준법"], "task": "임대차 계약서 조건을 읽고 검토한다", "title": "임대차 계약 조건 검토하기", "oneliner": "계약서 특약을 표준 조건과 비교하고 통지 기한을 계산합니다", "story": "건물을 빌려주거나 빌려 쓰는 회사의 계약 담당자는 임대차 계약서마다 보증금, 월세, 만기일, 특별히 따로 정한 조건을 확인해야 합니다. 특히 계약을 연장할지 알려야 하는 기한을 놓치면 원하지 않는 조건으로 계약이 이어질 수 있습니다. 특약이 손글씨로 적혀 있거나 관리 대장에 '특약 있음'만 적혀 있으면 사람이 일일이 원본을 찾아봐야 합니다. 워크플로우는 계약 조건을 뽑아 회사 표준 조건과 다른 특약을 표시하고, 만기일에서 통지 기한 날짜를 계산해 일정으로 정리합니다.", "terms": [{"term": "임대차", "desc": "건물이나 공간을 돈을 받고 빌려주는 일입니다. 빌려주는 쪽이 임대인, 빌려 쓰는 쪽이 임차인입니다."}, {"term": "특약", "desc": "표준 계약 내용 외에 두 당사자가 따로 정한 조건입니다. 계약서 뒷장이나 여백에 덧붙이는 경우가 많습니다."}, {"term": "갱신 통지 기한", "desc": "계약을 연장할지 끝낼지 상대에게 알려야 하는 마감일입니다. 보통 만기일 몇 달 전으로 정합니다."}, {"term": "원상복구", "desc": "나갈 때 공간을 처음 빌렸을 때 상태로 되돌려 놓는 것입니다."}], "docs": [{"name": "임대차 계약서", "desc": "당사자, 보증금, 월 임대료, 계약 기간을 확인합니다"}, {"name": "특약사항 페이지", "desc": "표준과 다르게 정한 조건을 확인합니다"}, {"name": "표준 계약 조건표", "desc": "회사가 기본으로 쓰는 계약 조건 기준 엑셀입니다"}, {"name": "임대차 관리 대장", "desc": "계약별 기본 정보와 비고를 적어 둔 관리 목록입니다"}], "fields": ["당사자", "보증금·월 임대료", "계약 기간·만기일", "갱신 통지 기한", "임대료 조정 조건", "원상복구 특약"], "key": "계약번호(임차인·물건): 어느 임차인이 어느 공간을 빌렸는지 가리키는 번호입니다", "check": "계약서 특약을 표준 조건과 비교하고, 만기일에서 거꾸로 계산한 통지 기한이 지났는지 봅니다", "exceptions": ["특약 페이지에 손글씨로 '임대료 5% 인상 상한'이 추가된 계약", "만기일 기준 통지 기한이 이미 지나 버린 계약", "관리 대장 비고에는 '특약 있음'만 있고 내용이 없는 건"], "output": "계약별 조건 요약, 표준과 다른 특약 표시, 통지 기한 일정", "steps": [{"node": "Parse", "what": "계약서와 특약 페이지를 글자와 표로 읽습니다(손글씨 포함)"}, {"node": "Extract", "what": "당사자, 금액, 기간, 특약 조건을 뽑습니다"}, {"node": "Match", "what": "계약번호로 표준 조건표와 관리 대장을 짝지어 붙입니다"}, {"node": "Validate", "what": "표준과 다른 특약인지, 통지 기한이 지났는지 판정합니다"}, {"node": "Instruct", "what": "특약의 의미를 읽고 계약별 조건 요약과 주의 문장을 씁니다"}, {"node": "Export", "what": "계약별 요약과 통지 기한 일정을 표로 저장합니다"}], "problem": "관리하는 계약이 수십, 수백 건이면 담당자는 만기일을 엑셀에 적어 두고 달력을 보며 기한을 챙깁니다. 계약서마다 통지 기한을 '만기 몇 달 전'처럼 다르게 정해 두어 날짜를 일일이 거꾸로 계산해야 하고, 한 번 틀리게 적으면 기한이 지날 때까지 알아차릴 방법이 없습니다. 특약 내용은 원본을 다시 꺼내야 알 수 있어 담당자가 바뀌면 조건을 모른 채 지나가기도 합니다.", "why": "범용 AI 챗봇에 계약서를 통째로 넣고 특이한 조건을 물으면 매번 다른 기준으로 답하고, 무엇과 비교해 특이하다고 했는지 알 수 없습니다. Studio는 회사 표준 조건표를 기준으로 삼아 들어오는 계약마다 같은 항목을 같은 방식으로 비교합니다. 뽑아낸 특약 문구마다 원문의 어느 페이지에서 가져왔는지 위치가 남아, 손글씨처럼 잘못 읽을 수 있는 부분을 사람이 바로 확인할 수 있습니다.", "difficulty": "중급"}, {"uid": "U099", "i": 98, "no": 216, "pattern": "검증", "industry": "공공·법률", "dept": ["IT·보안", "법무·준법"], "task": "개인정보 처리위탁 계약서와 수탁사 보안점검표로 위탁 적정성을 심사한다", "title": "개인정보 위탁 업체 심사하기", "oneliner": "위탁 계약서와 보안점검표가 서로 맞는지 심사합니다", "story": "고객 개인정보를 다루는 일을 외부 업체에 맡기는 회사의 개인정보 보호 담당자는 맡긴 업체가 정보를 안전하게 다루는지 심사합니다. 계약서, 업체가 직접 답한 보안점검표, 회사의 개인정보 처리방침, 다른 업체에 다시 맡기는 동의서가 서로 같은 범위를 말하는지 봐야 합니다. 업체가 '이행'이라고만 답하고 근거를 내지 않거나 업무 이름이 서류마다 다르면 판단하기 어렵습니다. 워크플로우는 네 서류의 범위와 답변을 맞춰 보고 불일치와 근거 부족 항목을 골라 보완 요청이나 적정 판정을 냅니다.", "terms": [{"term": "처리위탁", "desc": "고객 개인정보를 다루는 일을 외부 업체에 맡기는 것입니다. 맡은 업체를 수탁사라고 합니다."}, {"term": "재위탁", "desc": "맡은 업체가 그 일을 또 다른 업체에 다시 맡기는 것입니다."}, {"term": "개인정보 처리방침", "desc": "회사가 개인정보를 어떻게 모으고 쓰는지 공개한 문서입니다."}, {"term": "보호조치", "desc": "개인정보를 지키기 위한 장치입니다. 접근 권한 관리, 암호화 같은 것입니다."}], "docs": [{"name": "개인정보 처리위탁 계약서", "desc": "맡긴 업무 범위와 계약 기간을 확인합니다"}, {"name": "수탁사 보안점검표", "desc": "업체가 보호조치 항목마다 이행 여부와 근거를 답한 표입니다"}, {"name": "개인정보 처리방침", "desc": "공개한 위탁 업체와 업무 범위를 확인합니다"}, {"name": "재위탁 동의서", "desc": "다시 맡긴 업체와 그 업무 범위를 확인합니다"}], "fields": ["수탁사명", "위탁 업무명·범위", "재수탁사", "보호조치 항목", "이행 여부·근거", "계약 기간"], "key": "위탁 업무(수탁사): 어느 업체에 어떤 일을 맡겼는지로 서류를 묶습니다", "check": "계약서의 위탁 범위를 처리방침, 재위탁 동의서와 비교하고, 점검표 답변이 계약 내용과 근거 자료로 뒷받침되는지 봅니다", "exceptions": ["재위탁 동의서에는 '상담 및 배송'인데 계약서에는 '상담'만 있음", "보안점검표에 '이행'이라 답했지만 첨부 근거가 없는 항목", "점검표에는 '고객센터 운영', 계약서에는 'CS 대행'으로 업무명이 다름"], "output": "서류 간 불일치·근거 부족 목록과 보완 요청 또는 적정 판정", "steps": [{"node": "Parse", "what": "위탁 관련 서류를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "계약서, 점검표, 처리방침, 동의서로 나눕니다"}, {"node": "Extract ×4", "what": "네 종류 서류에서 업체명, 업무 범위, 보호조치 답변을 뽑습니다"}, {"node": "Merge", "what": "위탁 업무별로 결과를 합칩니다"}, {"node": "Validate", "what": "범위 일치와 근거 유무를 판정합니다"}, {"node": "Instruct", "what": "업무명 차이를 감안해 판단하고 보완 요청 또는 적정 의견을 씁니다"}], "problem": "개인정보 보호 담당자는 해마다 수탁사 수십 곳을 심사하며 업체마다 계약서, 점검표, 처리방침, 동의서 네 가지를 펼쳐 놓고 업무 범위와 답변을 눈으로 맞춥니다. 점검표는 항목이 수십 개라 '이행'이라는 답변만 보고 넘어가기 쉽고, 첨부 근거가 그 항목을 뒷받침하는지 일일이 열어 보려면 업체 한 곳에 반나절이 걸립니다. 범위가 어긋난 채 심사를 통과시키면 처리방침에 없는 업체가 개인정보를 다루게 되어 법 위반과 과징금(법 위반에 매기는 벌금 성격의 돈)으로 이어질 수 있습니다.", "why": "위탁 업무를 기준으로 계약서, 처리방침, 재위탁 동의서, 점검표를 한 행에 묶으면 한 서류에만 있는 업무 범위나 재수탁사가 빈칸으로 바로 드러납니다. 근거 첨부가 있는지는 규칙 검사(Validate)로 걸러 내고, 'CS 대행'과 '고객센터 운영'이 같은 업무인지처럼 읽고 따져야 하는 것만 맥락 판단(Instruct)이 맡아 애매하면 '검토 필요'로 남깁니다. 심사 결과를 컬렉션(결과를 모아 두는 저장소)에 쌓아 두면 다음 해 같은 업체를 심사할 때 지난 지적 사항이 고쳐졌는지 바로 비교할 수 있습니다.", "difficulty": "중급"}, {"uid": "U100", "i": 99, "no": 222, "pattern": "검증", "industry": "공공·법률", "dept": ["법무·준법"], "task": "본계약서·NDA·부속합의서를 사내 기준에 대조해 법무 검토가 필요한 조항을 가린다", "title": "법무 검토할 계약 조항 고르기", "oneliner": "계약 묶음의 위험 조항을 사내 기준과 비교해 고릅니다", "story": "회사의 사업 담당자는 거래처와 계약을 맺기 전에 본계약서, 비밀유지 계약서, 부속합의서를 사내 기준에 비춰 보고 법무팀에 넘길지 정합니다. 책임 한도, 손해배상, 해지 조건 같은 조항이 기준과 다르거나 서류끼리 서로 충돌하면 법무 검토가 필요합니다. 예외가 부속합의서에만 숨어 있거나 최신 판본이 아닌 서류가 섞이면 놓치기 쉽습니다. 워크플로우는 서류별로 위험 조항을 뽑아 기준과 비교하고 근거와 함께 법무 이관 여부를 정리합니다.", "terms": [{"term": "NDA", "desc": "Non-Disclosure Agreement의 줄임말로, 서로 알게 된 비밀을 밖에 알리지 않기로 한 계약입니다."}, {"term": "책임한도", "desc": "문제가 생겼을 때 물어 줘야 하는 돈의 최대 금액입니다."}, {"term": "지식재산권 귀속", "desc": "일하면서 만든 결과물의 권리가 누구에게 가는지 정한 것입니다."}, {"term": "판본", "desc": "같은 계약서의 고친 순서별 버전입니다."}], "docs": [{"name": "본계약서", "desc": "거래의 주요 조건과 위험 조항을 확인합니다"}, {"name": "NDA(비밀유지 계약서)", "desc": "비밀 범위와 손해배상 조항을 확인합니다"}, {"name": "부속합의서", "desc": "본계약에 덧붙인 예외 조건을 확인합니다"}, {"name": "사내 계약 검토 기준표", "desc": "조항별로 회사가 허용하는 기준을 정리한 엑셀입니다"}], "fields": ["책임한도", "손해배상", "해지 조건", "지식재산권 귀속", "예외 문구", "판본·날짜"], "key": "계약 건 번호(상대방): 한 거래에 딸린 계약 서류를 묶는 번호입니다", "check": "각 서류의 위험 조항을 사내 기준과 비교하고, 본계약과 부속합의서 사이에 충돌하는 예외가 있는지 봅니다", "exceptions": ["본계약에는 책임한도가 있는데 부속합의서에만 '고의·중과실은 제외' 예외가 있음", "NDA는 손해배상 무제한, 본계약은 계약금액 한도로 서로 다름", "최신 판본이 아닌 지난 판 계약서가 섞여 들어옴"], "output": "기준과 다른 조항 목록, 근거 문장, 법무 이관 여부", "steps": [{"node": "Parse", "what": "계약 서류를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "본계약서, NDA, 부속합의서로 나눕니다"}, {"node": "Extract ×3", "what": "세 서류에서 책임한도, 손해배상, 해지, 권리 귀속 조항과 판본을 뽑습니다"}, {"node": "Merge", "what": "계약 건별로 조항을 합칩니다"}, {"node": "Match", "what": "조항 종류로 사내 기준표를 짝지어 붙입니다"}, {"node": "Validate", "what": "기준 위반과 서류 간 충돌, 판본을 판정합니다"}, {"node": "Instruct", "what": "조항 뜻을 읽고 법무로 넘길지 판단해 근거를 씁니다"}], "problem": "사업 담당자는 법률 전문가가 아닌데도 계약 묶음 수십 장을 읽고 어느 조항이 위험한지 스스로 가려야 하고, 거래가 많은 시기에는 이런 묶음이 한 주에도 여러 건 들어옵니다. 조항은 계약서마다 번호와 표현이 달라 '책임한도'라는 말이 없어도 그 내용을 찾아 읽어야 하고, 부속합의서의 짧은 문장 하나가 본계약 조항을 뒤집는 것을 알아보기 어렵습니다. 위험 조항을 놓치고 계약하면 문제가 생겼을 때 회사가 한도 없이 책임을 질 수 있고, 반대로 모든 계약을 법무팀에 넘기면 검토가 밀려 거래가 늦어집니다.", "why": "범용 AI 챗봇에 계약서를 넣고 위험한 조항을 물으면 회사 기준이 아니라 일반적인 기준으로 답하고, 물을 때마다 다른 조항을 골라 줍니다. Studio는 사내 검토 기준표를 조항 종류별로 짝지어 붙여(Match) 들어오는 계약마다 같은 기준으로 비교하고, 뽑은 조항마다 원문 위치가 남아 법무팀이 근거 문장을 바로 열어 볼 수 있습니다. 기준 t": "질의를 정리하고 추가 확인 사항과 의견서 초안을 씁니다"}], "problem": "변호사는 요청 하나를 맡으면 메일 수십 통과 첨부 문서를 시간순으로 다시 읽으며 사실관계를 메모로 정리하는 데 검토 시간의 상당 부분을 씁니다. 같은 사건을 여러 사람이 나눠 보면 각자 정리한 날짜와 조건이 달라 다시 맞춰야 하고, 문서가 추가로 올 때마다 정리한 내용을 처음부터 고쳐야 합니다. 사실관계를 잘못 잡은 채 의견서를 쓰면 결론이 통째로 바뀔 수 있어 고객에게 잘못된 조언을 하게 됩니다.", "why": "범용 AI 챗봇에 메일과 계약서를 통째로 넣고 의견서를 쓰라고 하면 서로 다른 날짜 중 하나를 골라 그럴듯하게 이어 쓰기 쉽고, 어느 문서에서 가져온 사실인지 되짚기 어렵습니다. Studio는 문서별로 사실을 뽑는 단계, 문서 사이 불일치를 검사하는 단계, 의견서를 쓰는 단계를 나누어 두어 날짜가 다른 메일은 추측하지 않고 '추가 확인'으로 남기고, 뽑은 사실마다 원문 위치가 남아 변호사가 근거를 바로 확인합니다. 정리한 사실관계를 컬렉션(결과를 모아 두는 저장소)에 쌓아 두면 같은 고객의 다음 요청에서 이전 기록을 바로 참고할 수 있습니다.", "difficulty": "중급"}, {"uid": "U103", "i": 102, "no": 87, "pattern": "검증", "industry": "공공·법률", "dept": ["업종 현업"], "task": "직업훈련 과정 신청 서류를 심사한다", "title": "직업훈련 신청 서류 심사하기", "oneliner": "훈련과정 신청 서류끼리 숫자와 강사가 맞는지 봅니다", "story": "직업훈련 과정을 승인해 주는 공공기관의 심사 담당자는 교육기관이 낸 신청 서류를 읽고 승인 여부를 정합니다. 신청서에 적힌 총 훈련시간이 과목별 시간표 합계와 같은지, 배정된 강사가 실제 자격 증빙을 냈는지, 보완해서 다시 낸 서류가 이전 판과 어디가 달라졌는지까지 봐야 합니다. 서류가 여러 장이고 고친 판이 섞여 들어오면 한쪽만 고친 숫자나 빠진 서류를 놓치기 쉽습니다. 워크플로우는 서류를 종류별로 나눠 핵심 값을 뽑고, 서로 맞지 않는 곳과 빠진 서류를 목록으로 정리해 보완 요청인지 승인인지 판정해 줍니다.", "terms": [{"term": "편성표", "desc": "과목마다 몇 시간씩 가르칠지 정리한 시간표입니다. 과목 시간을 모두 더하면 총 훈련시간이 되어야 합니다."}, {"term": "강사 증빙", "desc": "강사가 그 과목을 가르칠 자격이 있음을 보여 주는 서류입니다. 경력증명서, 자격증 사본 같은 것이 해당합니다."}, {"term": "보완 제출본", "desc": "심사에서 고치라는 요청을 받고 다시 낸 서류입니다. 이전 판과 비교해 무엇이 바뀌었는지 봐야 합니다."}], "docs": [{"name": "훈련과정 신청서", "desc": "과정명, 총 훈련시간, 강사 배정 등 신청 내용 전체를 적은 서류입니다"}, {"name": "교과목별 편성표", "desc": "과목별 시간을 보고 합계가 신청서 총시간과 같은지 확인합니다"}, {"name": "강사 증빙", "desc": "배정된 강사의 이름과 자격을 확인합니다"}, {"name": "보완 제출본", "desc": "다시 낸 서류로, 이전 판과 바뀐 부분을 확인합니다"}, {"name": "심사 기준표", "desc": "필수 서류와 승인 조건이 정리된 기준 엑셀입니다"}], "fields": ["과정명(과정 코드)", "총 훈련시간", "과목별 시간", "배정 강사", "강사 자격", "제출일"], "key": "과정명(과정 코드): 한 과정에 딸린 서류를 하나로 묶는 이름표입니다", "check": "신청서 총시간과 편성표 합계, 배정 강사와 강사 증빙, 보완본과 이전 제출본을 각각 비교합니다", "exceptions": ["편성표 합계는 120시간으로 고쳤는데 신청서 총시간은 예전 100시간 그대로인 보완본", "신청서에는 A 강사가 배정됐는데 증빙은 B 강사 것만 들어 있음", "심사 기준표상 필수인 강사 증빙이 아예 빠진 과정"], "output": "과정별 불일치·누락 목록과 보완 요청 또는 승인 판정", "steps": [{"node": "Parse", "what": "스캔하거나 PDF로 받은 신청 서류를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "신청서, 편성표, 강사 증빙, 보완본을 종류별로 나눕니다"}, {"node": "Extract ×3", "what": "신청서, 편성표, 강사 증빙에서 각각 과정명, 시간, 강사 정보를 뽑습니다"}, {"node": "Merge", "what": "같은 과정의 결과를 한 줄로 합칩니다"}, {"node": "Match", "what": "과정 코드로 이전 제출본과 심사 기준표를 짝지어 붙입니다"}, {"node": "Validate", "what": "시간 합계, 강사 일치, 필수 서류 유무를 규칙으로 판정합니다"}, {"node": "Instruct", "what": "불일치 내용을 보고 보완 요청할지 승인할지 판단하고 사유를 씁니다"}], "problem": "심사 담당자는 교육기관 여러 곳에서 온 신청 건을 정해진 기한 안에 모두 봐야 해서, 과정 하나마다 서류 서너 종류를 펼쳐 놓고 시간을 손으로 더하고 강사 이름을 눈으로 맞춥니다. 보완본이 올 때마다 처음부터 다시 읽어야 하므로 같은 서류를 여러 번 보게 되고, 바쁜 시기에는 바뀐 부분만 보고 나머지는 건너뛰게 됩니다. 확인이 어긋나면 자격이 안 되는 과정을 승인하거나, 문제없는 과정에 보완을 요구해 교육 시작이 늦어집니다.", "why": "이 일은 '시간 합계가 같은가'처럼 규칙으로 딱 떨어지는 확인과 '이 증빙이 배정된 강사 것이 맞는가' 같은 맥락 판단이 섞여 있습니다. Studio는 규칙 검사(Validate)와 맥락 판단(Instruct)을 다른 단계로 나누어 숫자 불일치는 기계적으로 잡고, 애매한 건만 추측하지 않고 '검토 필요'로 사람에게 넘깁니다. 과정 코드로 이전 제출본과 보완본, 심사 기준표를 한 행에 묶어(Match) 두면 어디가 바뀌었고 어떤 필수 서류가 빠졌는지 한눈에 드러납니다.", "difficulty": "심화"}, {"uid": "U104", "i": 103, "no": 89, "pattern": "검증", "industry": "공공·법률", "dept": ["법무·준법"], "task": "내부감사 증빙을 검토하고 규정 위반을 찾는다", "title": "출장비 증빙에서 규정 위반 찾기", "oneliner": "지출 증빙을 당시 규정과 비교해 위반과 중복을 찾습니다", "story": "회사 안에서 돈이 규정대로 쓰였는지 확인하는 내부감사 담당자는 지출 결재 서류, 출장비 정산서, 영수증을 함께 봐야 합니다. 규정은 중간에 바뀌기도 해서, 지출한 날 기준으로 어떤 규정이 적용되는지까지 따져야 합니다. 같은 영수증을 두 번 쓰거나 예외 승인이 다른 문서에만 있으면 사람 눈으로 찾기 어렵습니다. 워크플로우는 지출 건별로 서류를 모아 당시 규정과 비교하고, 위반이나 증빙 누락 건을 골라 지적할지 설명을 요청할지 판정합니다.", "terms": [{"term": "내부감사", "desc": "회사 안의 감사 담당자가 돈과 업무가 규정대로 처리됐는지 점검하는 일입니다."}, {"term": "지출결의서", "desc": "돈을 쓰기 전에 무엇에 얼마를 쓸지 적어 결재를 받는 문서입니다."}, {"term": "여비 규정", "desc": "출장 때 교통비, 숙박비, 식비를 얼마까지 쓸 수 있는지 정한 회사 규칙입니다."}, {"term": "소명", "desc": "왜 그렇게 처리했는지 설명하고 근거를 내는 것입니다."}], "docs": [{"name": "지출결의서", "desc": "지출 목적, 금액, 승인자를 확인합니다"}, {"name": "출장비 정산서", "desc": "출장일과 실제 쓴 금액, 첨부 영수증 번호를 확인합니다"}, {"name": "영수증", "desc": "실제 결제 금액과 날짜, 영수증 번호를 확인합니다"}, {"name": "결재 이력", "desc": "누가 언제 승인했는지, 예외 승인이 있었는지 확인합니다"}, {"name": "여비 규정(개정 전후)", "desc": "지출 당시 적용되는 한도와 요건을 확인하는 기준 문서입니다"}], "fields": ["지출 건 번호", "지출일·출장일", "금액", "지출 목적", "승인자·예외 승인", "영수증 번호"], "key": "지출 건 번호: 한 번의 지출에 딸린 서류를 묶는 번호입니다", "check": "지출 금액·목적·승인 내역이 지출 당시 시행 규정을 지켰는지, 같은 영수증이 두 번 쓰였는지 봅니다", "exceptions": ["같은 숙박 영수증 번호가 서로 다른 두 정산서에 첨부됨", "개정 전에 다녀온 출장에 개정 후 한도를 적용해 위반으로 보이는 건", "한도 초과지만 별도 결재문에 예외 승인이 있는 건"], "output": "규정 위반·증빙 누락 목록과 지적 또는 소명 요청 판정", "steps": [{"node": "Parse", "what": "감사 대상 서류를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "결의서, 정산서, 영수증, 결재 이력을 종류별로 나눕니다"}, {"node": "Extract ×4", "what": "네 종류 서류에서 각각 날짜, 금액, 승인, 영수증 번호를 뽑습니다"}, {"node": "Merge", "what": "지출 건 번호로 서류별 결과를 한 줄로 합칩니다"}, {"node": "Match", "what": "지출일에 맞는 개정 전 또는 개정 후 규정을 짝지어 붙입니다"}, {"node": "Validate", "what": "한도 초과, 승인 누락, 영수증 중복을 규칙으로 판정합니다"}, {"node": "Instruct", "what": "예외 승인 여부까지 보고 지적할지 소명을 요청할지 판단합니다"}], "problem": "감사 담당자는 한 해 동안의 지출 가운데 수백 건을 골라 결의서, 정산서, 영수증을 건마다 꺼내 보며 금액과 날짜를 손으로 맞춥니다. 지출일에 따라 적용 규정이 달라 개정 전후 규정집을 번갈아 펼쳐야 하고, 한도표를 잘못 보면 정상 지출을 위반으로 적거나 반대로 위반을 놓칩니다. 잘못된 지적은 소명(설명과 근거 제출) 절차로 여러 사람의 시간을 쓰게 하고, 놓친 위반은 나중에 외부 감사에서 드러나 회사 신뢰를 떨어뜨립니다.", "why": "영수증 번호가 같은지, 한도를 넘었는지 같은 확인은 규칙이 분명하지만, 예외 승인이 있는지와 그 승인이 정당한지는 문서를 읽고 판단해야 합니다. Studio는 이 둘을 Validate와 Instruct로 나누어 규칙 위반은 빠짐없이 잡고, 예외가 걸린 건은 추측하지 않고 '검토 필요'로 표시합니다. 지출일에 맞는 규정을 Match로 짝지어 붙이기 때문에 어느 규정을 기준으로 판정했는지가 결과마다 남습니다.", "difficulty": "심화"}, {"uid": "U105", "i": 104, "no": 91, "pattern": "검증", "industry": "공공·법률", "dept": ["재무·회계", "업종 현업"], "task": "지원사업 증빙 서류를 검토하고 정산한다", "title": "지원사업 사업비 증빙 정산하기", "oneliner": "지원금 사용 내역을 세금계산서와 이체 기록으로 확인합니다", "story": "정부나 공공기관의 지원금을 받은 기업은 사업이 끝나면 돈을 어디에 썼는지 정산서와 증빙을 내야 하고, 담당 기관은 이를 하나씩 확인합니다. 지출마다 세금계산서와 실제 돈을 보낸 기록이 같은 거래처, 같은 금액인지, 인정되는 항목과 기간인지 봐야 합니다. 합계만 맞고 건별 금액이 다르거나 증빙 한 장이 빠진 경우는 사람이 놓치기 쉽습니다. 워크플로우는 지출 건별로 증빙을 맞춰 보고 집행 기준에 따라 인정, 보완, 불인정을 판정해 줍니다.", "terms": [{"term": "정산", "desc": "미리 받은 돈을 실제로 어디에 얼마 썼는지 따져 맞추는 일입니다."}, {"term": "세금계산서", "desc": "물건이나 서비스를 사고팔 때 공급자가 발행하는 세금용 영수증입니다."}, {"term": "비목", "desc": "예산을 쓰임새별로 나눈 항목입니다. 인건비, 재료비, 외주비 같은 분류입니다."}, {"term": "협약서", "desc": "지원 기관과 기업이 지원 금액, 기간, 조건을 약속한 문서입니다."}], "docs": [{"name": "사업비 정산서", "desc": "기업이 적은 지출 항목, 거래처, 금액, 지급일을 확인합니다"}, {"name": "세금계산서", "desc": "거래처와 금액이 정산서와 같은지 봅니다"}, {"name": "이체확인증", "desc": "실제로 돈을 보낸 날짜와 금액을 확인합니다"}, {"name": "협약서", "desc": "사업 기간과 지원 범위를 확인합니다"}, {"name": "집행 기준표", "desc": "비목별로 인정되는 지출과 조건을 정리한 기준 엑셀입니다"}], "fields": ["지출 항목", "거래처", "금액", "지급일", "비목", "대상 기간"], "key": "지출 건 번호(기업·지출 항목): 한 기업의 지출 한 건을 가리키는 번호입니다", "check": "정산서 지출을 세금계산서·이체확인증의 거래처, 금액, 지급일과 비교하고, 집행 기준상 인정 항목과 기간인지 봅니다", "exceptions": ["세금계산서는 있는데 이체확인증이 없는 지출", "협약상 사업 기간이 끝난 뒤 지급한 건", "세 건 합계는 300만 원으로 같지만 건별 금액이 서로 다른 경우"], "output": "지출별 인정·보완·불인정 판정과 보완 요청 목록", "steps": [{"node": "Parse", "what": "정산 서류와 증빙을 글자와 표로 읽습니다"}, {"node": "Classify", "what": "정산서, 세금계산서, 이체확인증, 협약서로 나눕니다"}, {"node": "Extract ×3", "what": "세 종류 서류에서 거래처, 금액, 날짜를 뽑습니다"}, {"node": "Merge", "what": "지출 건별로 결과를 한 줄로 합칩니다"}, {"node": "Match", "what": "비목으로 집행 기준표를 짝지어 붙입니다"}, {"node": "Validate", "what": "금액 일치, 증빙 유무, 기간 안 지출인지 판정합니다"}, {"node": "Instruct", "what": "판정 사유를 보고 기업에 보낼 보완 요청 문장을 씁니다"}], "problem": "지원 기관 담당자는 기업 수십 곳이 보낸 정산 서류를 정산 기간 몇 주 안에 모두 봐야 하고, 기업마다 지출이 수십 건이라 맞춰 볼 짝이 수천 쌍에 이릅니다. 정산서와 증빙을 번갈아 보며 거래처명과 금액을 눈으로 맞추다 보면 비슷한 거래처명이나 비슷한 금액을 같은 건으로 착각하기 쉽습니다. 잘못 인정한 지출은 나중에 환수(돌려받기) 문제가 되고, 잘못 불인정하면 기업과 다툼이 생깁니다.", "why": "이 일은 '거래처, 금액, 날짜가 세 서류에서 같은가'를 지출 건마다 똑같이 반복하는 일이어서, 기준을 한 번 정해 두면 그대로 적용하는 워크플로우에 맞습니다. 지출 건 번호로 정산서, 세금계산서, 이체확인증을 한 행에 묶고 비목별 집행 기준표까지 짝지어 붙이면(Match) 증빙이 빠진 건과 기준 밖 지출이 바로 드러납니다. 기업마다 서류 양식이 달라도 양식을 미리 등록하지 않고 '거래처', '금액' 같은 항목 설명만으로 읽어 내므로 새 기업이 들어와도 설정을 다시 하지 않습니다.", "difficulty": "심화"}, {"uid": "U106", "i": 105, "no": 92, "pattern": "검증", "industry": "공공·법률", "dept": ["법무·준법", "품질·생산"], "task": "법령 정보 서비스의 데이터가 원문과 맞는지 정기 검증한다", "title": "법령 서비스 데이터 원문 검증하기", "oneliner": "서비스에 올린 법 조문이 원문과 같은지 정기 점검합니다", "story": "법령 정보를 제공하는 서비스의 데이터 담당자는 서비스에 올라간 법 조문이 실제 법령 원문과 같은지 주기적으로 확인합니다. 법이 개정되면 문구, 시행일, 조문 번호, 별도 표가 함께 바뀌는데 이 중 하나만 늦게 반영돼도 잘못된 정보가 됩니다. 띄어쓰기만 다른 경우와 내용이 다른 경우가 섞여 있어 사람이 모두 비교하기는 어렵습니다. 워크플로우는 조문별로 원문과 서비스 데이터를 맞춰 보고 단순 표기 차이와 실제 내용 차이를 구분해 수정 필요 여부를 알려 줍니다.", "terms": [{"term": "조문", "desc": "법의 각 조항입니다. 제1조, 제1항, 제1호처럼 단계가 나뉩니다."}, {"term": "시행일", "desc": "법이나 개정 내용이 실제로 효력을 갖기 시작하는 날입니다."}, {"term": "신구조문대비표", "desc": "개정 전 조문과 개정 후 조문을 나란히 놓고 비교한 표입니다."}, {"term": "별표·별지", "desc": "법 본문 뒤에 붙는 표나 서식입니다. 기준 금액표나 신청서 양식 같은 것입니다."}], "docs": [{"name": "법령 원문", "desc": "기준일에 시행 중인 정확한 조문 문구를 확인합니다"}, {"name": "개정문", "desc": "무엇이 언제 바뀌었는지 확인합니다"}, {"name": "신구조문대비표", "desc": "바뀐 조문과 옮겨진 번호를 확인합니다"}, {"name": "서비스 조문 데이터", "desc": "서비스에 실제로 올라간 조문 내용입니다"}, {"name": "별표·별지", "desc": "본문에 딸린 표와 서식이 빠지지 않았는지 봅니다"}], "fields": ["법령명", "조문 번호(조·항·호)", "조문 문구", "시행일", "별표·별지 여부"], "key": "법령명 + 조문 번호: 어느 법의 몇 조 몇 항인지로 조문을 짝지웁니다", "check": "서비스 데이터의 조문 문구, 시행일, 별표 유무를 기준일 법령 원문과 비교합니다", "exceptions": ["개정으로 제5조가 제6조로 옮겨져 번호로 짝이 안 맞는 조문", "원문에는 별표 2가 있는데 서비스에는 빠짐", "내용은 같고 띄어쓰기와 줄바꿈만 다른 조문"], "output": "조문별 불일치 목록(표기 차이와 내용 차이 구분)과 수정 필요 여부", "steps": [{"node": "Parse", "what": "법령 문서와 서비스 데이터를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "원문, 개정문, 대비표, 서비스 데이터, 별표로 나눕니다"}, {"node": "Extract ×2", "what": "원문과 서비스 데이터에서 조문 번호, 문구, 시행일을 뽑습니다"}, {"node": "Match", "what": "법령명과 조문 번호로 원문과 서비스 조문을 짝짓습니다"}, {"node": "Validate", "what": "문구, 시행일, 별표 유무가 같은지 판정합니다"}, {"node": "Instruct", "what": "차이가 단순 표기인지 내용 변경인지 판단합니다"}, {"node": "Export", "what": "조문별 불일치 목록을 저장합니다"}], "problem": "서비스에 올라간 조문은 수만 개이고 법은 달마다 여러 건이 개정되므로, 담당자는 개정이 있을 때마다 영향받는 조문을 찾아 원문과 한 줄씩 대조하는 일을 반복합니다. 긴 조문을 눈으로 비교하면 '이상'과 '초과'처럼 한 글자 차이를 놓치기 쉽고, 조문 번호가 밀린 경우에는 엉뚱한 조문끼리 비교하게 됩니다. 틀린 조문이 서비스에 남아 있으면 이용자가 잘못된 법 내용을 믿고 행동할 수 있어 서비스 신뢰에 직접 영향을 줍니다.", "why": "범용 AI 챗봇에 두 조문을 넣고 다른 점을 물으면 띄어쓰기 차이까지 섞어 길게 답하거나, 반대로 글자 하나 차이를 '거의 같다'고 뭉뚱그릴 수 있습니다. Studio는 문구가 같은지 보는 규칙 검사(Validate)와 차이가 표기 차이인 , "docs": [{"name": "초진 문진표", "desc": "환자가 직접 적은 증상, 과거력, 복용약, 알레르기를 봅니다."}, {"name": "상담 메모", "desc": "직원이 상담하며 적은 내용으로, 문진표에 없는 정보가 있는지 봅니다."}, {"name": "접수 자료", "desc": "환자 기본 정보와 방문일을 봅니다."}, {"name": "초진 상담지 양식", "desc": "최종으로 채워야 할 칸의 구성을 봅니다."}], "fields": ["주 증상", "과거력", "복용약", "알레르기", "'해당 없음' 표시 여부"], "key": "방문번호(환자+방문일): 한 환자의 한 번 방문을 가리키는 번호입니다.", "check": "문진표와 상담 메모를 항목별로 맞춰 빈칸과 서로 다른 답을 찾습니다.", "exceptions": ["메모에는 혈압약을 먹는다고 적혔는데 문진표 복용약 칸은 빈칸인 경우", "빈칸과 환자가 직접 쓴 '해당 없음'을 구분해야 하는 경우", "문진표에는 증상 기간 1주, 메모에는 3주로 적힌 경우"], "output": "항목별 빈칸·불일치 목록과 초진 상담지 초안(가상 데이터)", "steps": [{"node": "Parse", "what": "손글씨가 섞인 문진표와 메모를 글자로 읽습니다"}, {"node": "Classify", "what": "문진표, 상담 메모, 접수 자료, 상담지 양식으로 나눕니다"}, {"node": "Extract ×2", "what": "문진표와 메모에서 증상, 과거력, 복용약, 알레르기를 뽑습니다"}, {"node": "Merge", "what": "방문번호 기준으로 두 자료를 항목별로 합칩니다"}, {"node": "Validate", "what": "빈칸이거나 두 자료의 답이 다른 항목을 노랑·빨강으로 표시합니다"}, {"node": "Instruct", "what": "확인이 필요한 항목을 표시해 상담지 양식에 맞춘 초안을 씁니다"}], "problem": "외래에는 하루에도 수십 명의 초진 환자가 오고, 직원은 진료 사이사이 짧은 시간에 손글씨 문진표와 메모를 읽어 상담지를 옮겨 적습니다. 복용약이나 알레르기 같은 정보가 상담지에서 빠지면 의사가 모른 채 처방하게 되어 환자 안전과 직결되고, 다시 확인하느라 진료가 지연됩니다.", "why": "이 일은 '두 자료의 같은 항목을 나란히 놓고 비었는지, 다른지 보는 것'이 핵심이라, 문진표를 통째로 챗봇에 넣어 요약을 받으면 빈칸이 조용히 사라지고 어디서 가져온 내용인지 알 수 없습니다. Studio는 항목별로 뽑은 값마다 원문 위치가 남아 직원이 빈칸과 '해당 없음'을 구분해 확인할 수 있고, 빈칸과 불일치를 표시하는 규칙 검사와 상담지 초안을 쓰는 단계가 나뉘어 있어 확인이 필요한 항목이 초안에 묻히지 않습니다.", "difficulty": "중급"}, {"uid": "U114", "i": 113, "no": 79, "pattern": "대조", "industry": "병원·의료", "dept": ["구매·조달", "재무·회계"], "task": "병원 구매 계약과 세금계산서를 대사한다", "title": "병원 물품 대금 청구 맞춰 보기", "oneliner": "물품 청구 단가와 수량이 계약대로인지 봅니다", "story": "병원 구매팀과 재무팀은 의료 물품을 납품한 업체가 보낸 청구서를 계약 내용과 맞춰 보고 돈을 줍니다. 계약은 상자 단위인데 명세서는 낱개 단위로 적히거나, 단가가 내린 뒤에도 옛 단가로 청구되는 경우가 있어 사람이 숫자만 보면 놓치기 쉽습니다. 워크플로우는 계약 단가, 납품·입고 수량, 청구 금액을 품목별로 뽑아 맞춰 보고 차이 나는 품목을 지급 보류 후보로 정리해 줍니다. 데이터셋은 실제 거래 자료 대신 가상 자료로 만듭니다.", "terms": [{"term": "대사", "desc": "두 문서의 숫자를 한 줄씩 맞춰 보며 차이를 찾는 일입니다."}, {"term": "세금계산서", "desc": "물건을 팔고 그 금액과 세금을 공식적으로 적어 주는 증빙 서류입니다."}, {"term": "입고 기록", "desc": "물건이 실제로 창고에 들어왔을 때 남기는 기록입니다."}, {"term": "규격", "desc": "같은 물품이라도 크기, 용량처럼 구분되는 세부 사양입니다."}], "docs": [{"name": "구매 계약서·단가표", "desc": "품목별 계약 단가와 적용일을 봅니다."}, {"name": "납품명세서", "desc": "업체가 보냈다고 적은 품목과 수량을 봅니다."}, {"name": "입고 기록", "desc": "병원에 실제로 들어온 수량을 봅니다."}, {"name": "세금계산서", "desc": "공식 청구 금액을 봅니다."}, {"name": "청구 내역", "desc": "품목별 청구 단가와 수량을 봅니다."}], "fields": ["품목 이름과 규격", "포장 단위(상자/낱개)", "수량", "계약 단가", "청구 단가", "계약 적용일"], "key": "품목 코드(품목 이름+규격): 같은 물품을 문서끼리 잇는 값입니다.", "check": "청구 단가와 수량을 계약 단가표, 납품·입고 수량과 비교해 단가와 단위 차이를 판정합니다.", "exceptions": ["계약은 1상자(100개) 단가, 명세서는 낱개 수량으로 적힌 경우", "단가 인하 적용일 이후 납품분에 옛 단가로 청구한 경우", "품목 이름은 같지만 규격이 5ml와 10ml로 다른 경우"], "output": "품목별 단가·수량 차이 목록과 지급 또는 보류", "steps": [{"node": "Parse", "what": "계약서, 명세서, 세금계산서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "계약서·단가표, 납품명세서, 입고 기록, 세금계산서, 청구 내역으로 나눕니다"}, {"node": "Extract ×3", "what": "명세서, 입고 기록, 청구 내역에서 품목·규격·단위·수량·단가를 뽑습니다"}, {"node": "Merge", "what": "품목 코드 기준으로 세 문서의 값을 합칩니다"}, {"node": "Match", "what": "합친 값을 계약 단가표와 적용일에 짝짓습니다"}, {"node": "Validate", "what": "단가나 수량, 단위가 맞지 않는 품목을 노랑·빨강으로 표시합니다"}, {"node": "Instruct", "what": "차이 이유를 정리해 지급 또는 보류 의견을 씁니다"}], "problem": "병원은 수백 개 업체에서 수천 가지 물품을 받고, 담당자는 매달 청구서가 몰려올 때 계약서, 명세서, 입고 기록, 세금계산서를 품목마다 번갈아 보며 맞춥니다. 차이를 놓치면 계약보다 비싼 값을 그대로 치르게 되고, 반대로 확인이 늦으면 업체 대금 지급이 밀려 거래 관계가 나빠집니다.", "why": "대금 대사는 '같은 품목을 여러 문서에서 찾아 단가와 수량을 나란히 놓는 것'이 핵심이라, 문서를 한꺼번에 챗봇에 넣어 묻는 방식으로는 품목 단위의 차이를 빠짐없이 받기 어렵습니다. Studio는 업체마다 명세서 양식이 달라도 양식을 미리 등록하지 않고 항목 설명만으로 읽어 내고, 품목 코드를 키로 세 문서를 한 행에 묶어 단가와 단위가 다른 품목이 바로 드러납니다.", "difficulty": "심화"}, {"uid": "U115", "i": 114, "no": 76, "pattern": "생성", "industry": "병원·의료", "dept": ["업종 현업"], "task": "보험 청구용 서류 패키지를 만든다", "title": "보험 청구용 병원 서류 챙기기", "oneliner": "보험사가 요청한 병원 서류가 다 발급됐는지 봅니다", "story": "병원 원무과 직원은 환자가 보험금을 청구할 수 있도록 보험사가 요청한 서류를 발급해 한 묶음으로 챙깁니다. 여러 날 진료받은 환자는 날짜마다 서류가 필요하고 진료과별로 발급 시점도 달라서, 사람이 하면 하루 치 서류가 빠지거나 날짜가 다른 서류가 섞이기 쉽습니다. 워크플로우는 요청 목록과 발급
