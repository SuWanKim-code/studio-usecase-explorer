<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Use Case Explorer</title>
<meta name="description" content="산업과 부서별 실무 문서 업무 유즈케이스를 찾아보고 Upstage Studio 워크플로우로 만드는 방법을 보는 페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --key:#5B52FF; --key-hover:#4840E0; --purple:#805CFB;
  --ink:#0D0D12; --ink-80:#3A3A44; --ink-60:#6B6B76; --ink-40:#A3A3AD; --ink-20:#DCDCE3; --ink-10:#ECECF1;
  --surface:#FFFFFF; --surface-light:#FAFBFC; --surface-purple:#F4F2FF; --hero:#EAE6FF;
  --r-tag:4px; --r:8px;
  --font:"Noto Sans KR",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-light);color:var(--ink);font:400 15px/1.6 var(--font);word-break:keep-all;overflow-wrap:break-word}
button,input,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--ink-20)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.top .dot{width:10px;height:10px;border-radius:50%;background:var(--purple)}
.top h1{font:700 17px var(--font);margin:0}
.top .cnt{color:var(--ink-60);font-size:14px}
.top .cnt b{color:var(--ink);font-weight:600}
.top .sp{flex:1}
.top a{color:var(--key);font-size:14px;font-weight:500;text-decoration:none}
/* hero */
.hero{margin:28px 0 20px;background:var(--hero);border:1px solid #D9D2FF;border-radius:var(--r);padding:28px 32px}
.hero h2{font:700 26px/1.35 var(--font);margin:0 0 8px}
.hero h2 em{font-style:normal;color:var(--purple)}
.hero p{margin:0;color:var(--ink-80);max-width:78ch}
.inds{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.ind{background:var(--surface);border:1px solid #D9D2FF;border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:flex-start}
.ind:hover{border-color:var(--key)}
.ind.on{border-color:var(--key);outline:1px solid var(--key);outline-offset:-2px;background:var(--surface-purple)}
.ind .ic{width:38px;height:38px;flex:none;border-radius:var(--r);background:var(--surface-purple);display:flex;align-items:center;justify-content:center;color:var(--key)}
.ind .ic svg{width:20px;height:20px}
.ind .h{display:flex;align-items:baseline;gap:8px}
.ind .h b{font:700 16px var(--font)}
.ind .h span{color:var(--ind-cnt,var(--ink-60));font-size:13px}
.ind p{margin:3px 0 0;font-size:13px;color:var(--ink-80);line-height:1.5}
.deptline{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.deptline .lb{font-weight:600;font-size:14px;margin-right:4px}
.ghead{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin:14px 0 -4px;padding-bottom:8px;border-bottom:1px solid var(--ink-20)}
.ghead h2{font:700 19px var(--font);margin:0;white-space:nowrap}
.ghead .n{color:var(--ink-60);font-size:14px}
.ghead p{margin:0;font-size:13.5px;color:var(--ink-60);flex-basis:100%}
.pathint{font-size:12.5px;color:var(--ink-60);margin:6px 0 0}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}

.flow .n{font:500 11.5px var(--mono);padding:2px 6px;border:1px solid var(--ink-20);border-radius:var(--r-tag);background:var(--surface);white-space:nowrap}
.flow .n.k{border-color:#C9C1FF;background:var(--surface-purple);color:var(--key)}
.flow .ar{color:var(--ink-40);font-size:11px}
/* controls */
.ctrl{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--ink-20);border-radius:var(--r);padding:0 14px;height:46px}
.search:focus-within{border-color:var(--key)}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:15px;min-width:0}
.search svg{color:var(--ink-60)}
select,.btn{height:46px;border:1px solid var(--ink-20);border-radius:var(--r);background:var(--surface);padding:0 14px;cursor:pointer}
.btn:hover{border-color:var(--ink-40)}
.filters{background:var(--surface-purple);border:1px solid #E2DDFF;border-radius:var(--r);padding:16px 20px;margin-bottom:20px}
.frow{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:6px 0;align-items:start}
.frow>label{font-weight:600;font-size:14px;padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ink-20);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip .c{color:var(--ink-60);margin-left:4px;font-size:12.5px}
.chip:hover{border-color:var(--ink-40)}
.chip.on{background:var(--key);border-color:var(--key);color:#fff}
.chip.on .c{color:#E4E1FF}
.chip.zero{opacity:.4}
.fnote{font-size:12.5px;color:var(--ink-60);margin:8px 0 0}
.indinfo{margin-top:8px;font-size:13.5px;color:var(--ink-80);background:var(--surface);border:1px solid var(--ink-20);border-radius:var(--r);padding:10px 14px;display:none}
.indinfo.show{display:block}
.indinfo b{color:var(--ink)}
.rc{font-size:14px;color:var(--ink-60);margin:0 0 12px}
.rc b{color:var(--ink);font-size:16px}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:60px}
.card{background:var(--surface);border:1px solid var(--ink-20);border-radius:var(--r);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--key)}
.card:focus-visible{outline:2px solid var(--key);outline-offset:2px}
.card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;font-weight:500;padding:2px 8px;border-radius:var(--r-tag);background:var(--ink-10);color:var(--ink-80);white-space:nowrap}
.tag.p{background:var(--surface-purple);color:var(--key)}
.tag.ind{background:var(--ink);color:#fff}
.tag.o{background:transparent;border:1px solid var(--ink-20);color:var(--ink-60)}
.uid{font:500 12px var(--mono);color:var(--ink-40);margin-left:auto}
.card h3{font:700 17px/1.4 var(--font);margin:0}
.card .one{margin:0;color:var(--ink-80);font-size:14px;line-height:1.55}
.card .ft{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:6px;border-top:1px solid var(--ink-10)}
.card .ft .docs{font-size:12.5px;color:var(--ink-60);display:flex;align-items:center;gap:4px}
.card .ft .docs svg{width:14px;height:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-60);padding:60px 0}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(13,13,18,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;border-left:1px solid var(--ink-20)}
.drawer.on{transform:none}
.dh{padding:18px 24px 14px;border-bottom:1px solid var(--ink-20);display:flex;gap:12px;align-items:flex-start}
.dh .t{flex:1}
.dh h2{font:700 21px/1.4 var(--font);margin:6px 0 0}
.dh .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dh .meta .uid{margin-left:0}
.x{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:var(--r);color:var(--ink-60)}
.x:hover{background:var(--ink-10);color:var(--ink)}
.db{overflow-y:auto;padding:8px 24px 40px;flex:1}
.sec{padding:16px 0;border-bottom:1px solid var(--ink-10)}
.sec:last-child{border-bottom:0}
.sec h4{font:700 14px var(--font);color:var(--purple);margin:0 0 10px;letter-spacing:.01em}
.story{font-size:15.5px;line-height:1.75;color:var(--ink);margin:0}
.raw{margin:10px 0 0;font-size:13px;color:var(--ink-60)}
dl.terms{margin:0;display:grid;gap:8px}
dl.terms div{background:var(--surface-light);border:1px solid var(--ink-10);border-radius:var(--r);padding:10px 14px}
dl.terms dt{font-weight:700;font-size:14.5px}
dl.terms dd{margin:2px 0 0;font-size:14px;color:var(--ink-80);line-height:1.6}
ul.docs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.docs li{display:flex;gap:10px;align-items:flex-start}
ul.docs li svg{color:var(--key);margin-top:3px}
ul.docs b{font-weight:600}
ul.docs span{display:block;font-size:13.5px;color:var(--ink-60)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--ink-60);font-weight:500}
.kv dd{margin:0}
.fl{display:flex;flex-wrap:wrap;gap:6px}
.fl span{font-size:13.5px;padding:3px 10px;border:1px solid var(--ink-20);border-radius:999px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:0}
ol.steps li{display:grid;grid-template-columns:28px 104px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--ink-20)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--surface-purple);color:var(--key);font:600 12px var(--font);display:flex;align-items:center;justify-content:center}
ol.steps .nd{font:500 12.5px var(--mono);color:var(--key);background:var(--surface-purple);border:1px solid #DCD6FF;border-radius:var(--r-tag);padding:2px 6px;justify-self:start;white-space:nowrap}
ol.steps .w{font-size:14.5px;line-height:1.6}
ul.ex{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
.out{background:var(--surface-purple);border-radius:var(--r);padding:12px 14px;font-size:14.5px}
ul.pl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.pl li{position:relative;padding:10px 14px 10px 40px;border-radius:var(--r);font-size:14.5px;line-height:1.65}
ul.pl li::before{content:"";position:absolute;left:14px;top:14px;width:16px;height:16px;border-radius:50%}
ul.prob li{background:var(--surface-light);border:1px solid var(--ink-10)}
ul.prob li::before{background:var(--ink-20);box-shadow:inset 0 0 0 4px var(--surface-light)}
ul.why li{background:var(--surface-purple)}
ul.why li::before{background:var(--key);box-shadow:inset 0 0 0 4px var(--surface-purple)}
.ndi{font:500 12.5px var(--mono);color:var(--key);background:#fff;border:1px solid #DCD6FF;border-radius:var(--r-tag);padding:1px 6px;margin:0 1px;white-space:nowrap}
.foot{font-size:12.5px;color:var(--ink-60);padding:24px 0 40px;border-top:1px solid var(--ink-20)}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.inds{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .grid{grid-template-columns:1fr}
  .inds{grid-template-columns:1fr}
  .hero{padding:20px}
  .hero h2{font-size:21px}
  .frow{grid-template-columns:1fr;gap:6px}
  .ctrl{flex-wrap:wrap}
  .search{flex-basis:100%}
  .top .cnt{display:none}
  ol.steps li{grid-template-columns:24px 1fr}
  ol.steps .w{grid-column:2}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <span class="dot"></span><h1>Studio Use Case Explorer</h1><span class="cnt">유즈케이스 <b id="total"></b>개</span>
  <span class="sp"></span><a href="https://console.upstage.ai/ko/docs/studio" target="_blank" rel="noopener">Studio 사용 설명서</a>
</div></header>

<main class="wrap">
  <section class="hero">
    <h2>어떤 산업이 있고, 어떤 업무가 있을까?</h2>
    <p>회사에서 문서를 읽고, 옮겨 적고, 맞춰 보는 업무 <span id="total2"></span>가지를 산업과 부서별로 모았습니다. 산업이나 부서를 고르고 카드를 눌러 보세요.</p>
    <div class="inds" id="inds"></div>
    <div class="deptline" id="deptline"></div>
  </section>

  <div class="ctrl">
    <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="찾고 싶은 업무나 문서를 입력하세요. 예: 영수증, 계약서, 수출, 병원" autocomplete="off"></label>
    <select id="sort" aria-label="정렬">
      <option value="no">기본순</option>
      <option value="easy">쉬운 것부터</option>
      <option value="hard">어려운 것부터</option>
      <option value="name">이름순</option>
    </select>
    <button class="btn" id="reset">초기화</button>
  </div>

  <section class="filters" id="filters"></section>
  <p class="rc"><b id="rc"></b>건</p>
  <section class="grid" id="grid"></section>

  <footer class="foot">문서 이름과 노드 조합은 예시입니다. 실제 회사의 양식이나 정답이 아니므로 팀의 문서와 업무 흐름에 맞게 바꿔 사용합니다. 의료·금융 문서는 가상 데이터로 만듭니다.</footer>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle">
  <div class="dh"><div class="t"><div class="meta" id="dmeta"></div><h2 id="dtitle"></h2></div>
    <button class="x" id="close" aria-label="닫기"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  <div class="db" id="dbody"></div>
</aside>

<script>
const DATA=[{"uid": "U001", "i": 0, "no": 105, "pattern": "대조", "industry": "회사 공통 업무", "dept": [], "task": "거래처 증빙과 장부를 맞춰 기장 오류를 찾는다", "title": "증빙과 장부 맞춰 기록 오류 찾기", "oneliner": "영수증과 장부 기록을 맞춰 틀린 기록을 찾습니다", "story": "세무사무소나 회사 회계 담당자는 거래처에서 받은 증빙과 장부에 적힌 기록이 서로 맞는지 확인합니다. 증빙 한 장을 두 기록으로 나눠 적거나 금액을 몇 원 틀리게 옮겨 적는 일이 생깁니다. 증빙 없이 장부에만 있는 기록도 찾아내야 하는데, 건수가 많으면 눈으로 하나씩 대조하기 어렵습니다. 워크플로우는 거래처, 날짜, 금액으로 증빙과 장부를 짝지어 차이와 증빙 없는 기록을 목록으로 만듭니다.", "terms": [{"term": "기장", "desc": "회사의 거래를 장부에 기록하는 일입니다."}, {"term": "장부 전표", "desc": "장부에 적힌 거래 한 건 한 건의 기록입니다."}, {"term": "증빙", "desc": "거래가 실제로 있었음을 보여 주는 서류입니다. 세금계산서, 영수증 등이 해당합니다."}], "docs": [{"name": "거래처 증빙(세금계산서·영수증)", "desc": "실제 거래의 날짜, 금액, 세액을 확인합니다"}, {"name": "장부 전표 목록", "desc": "장부에 기록된 거래 목록으로 증빙과 비교할 대상입니다"}], "fields": ["거래처", "일자", "공급가액", "세액", "계정과목"], "key": "거래처 + 일자 + 금액: 같은 거래를 찾는 데 쓰는 세 가지 값입니다", "check": "증빙과 장부 기록을 짝지어 금액 차이와 증빙 없는 기록을 찾습니다", "exceptions": ["증빙 한 장 22만 원을 장부에 11만 원씩 두 건으로 나눠 기록", "증빙 132,000원, 장부 132,100원처럼 끝자리만 다름", "장부에는 있는데 맞는 증빙이 없는 기록"], "output": "기장 오류 목록과 수정 필요 판정", "steps": [{"node": "Parse", "what": "증빙과 장부 목록을 글자와 표로 읽습니다"}, {"node": "Extract", "what": "거래처, 일자, 금액, 세액, 계정을 뽑습니다"}, {"node": "Match", "what": "거래처, 일자, 금액으로 증빙과 장부 기록을 짝짓습니다"}, {"node": "Validate", "what": "금액 차이와 짝 없는 기록을 판정합니다"}, {"node": "Instruct", "what": "나눠 적은 기록인지 실제 오류인지 판단해 수정 여부를 정합니다"}], "problem": "세무사무소 담당자는 거래처 한 곳당 한 달에 수백 건씩 쌓이는 증빙을 장부와 맞추고, 이 일을 맡은 거래처 수만큼 매달 반복합니다. 장부는 엑셀, 증빙은 종이나 PDF로 따로 있어 같은 거래를 찾으려면 날짜와 금액으로 검색하며 오가야 하고, 끝자리가 다른 금액은 눈으로 봐서는 거의 구분되지 않습니다. 증빙 없는 기록이 남은 채 세금 신고를 하면 비용으로 인정받지 못하거나 가산세(세금을 덜 낸 데 대한 추가 세금)가 붙습니다.", "why": "이 일은 거래처, 일자, 금액 세 값으로 증빙과 장부 기록을 짝짓는 일이라, 같은 키로 두 문서를 한 행에 묶어(Match) 짝이 없는 쪽을 드러내는 방식과 정확히 맞습니다. 금액 차이는 규칙 검사(Validate)로 걸러 내고, 한 장을 두 건으로 나눠 적은 것인지 실제 오류인지는 맥락 판단(Instruct)이 맡아 추측 대신 '검토 필요'로 남깁니다. 뽑은 금액마다 증빙 원문의 위치가 남아 있어 끝자리가 다른 건을 사람이 원본과 바로 대조할 수 있습니다.", "difficulty": "입문"}, {"uid": "U002", "i": 1, "no": 208, "pattern": "대조", "industry": "회사 공통 업무", "dept": ["법무·준법", "재무·회계"], "task": "해외 법인의 다국어 전력 인보이스를 본사 신고값과 맞춘다", "title": "해외 전력 청구서 사용량 맞추기", "oneliner": "여러 나라 말로 된 전력 청구서를 본사 보고값과 맞춥니다", "story": "해외에 공장이나 지사를 둔 회사의 본사 담당자는 각 나라에서 받은 전기 요금 청구서의 사용량이 본사에 보고된 값과 같은지 확인합니다. 청구서가 나라마다 다른 언어와 양식이고, MWh와 kWh처럼 단위도 섞여 있습니다. 단위를 잘못 옮기거나 청구 기간이 보고 월과 어긋나면 수치가 크게 틀어집니다. 워크플로우는 청구서에서 사용량을 뽑아 단위를 맞추고 본사 신고값과 비교해 차이와 근거 페이지를 알려 줍니다.", "terms": [{"term": "kWh·MWh", "desc": "전기 사용량 단위입니다. 1MWh는 1,000kWh입니다."}, {"term": "계량기", "desc": "전기를 얼마나 썼는지 재는 기계입니다. 계량기마다 번호가 있습니다."}, {"term": "시간대별 사용량", "desc": "낮, 밤처럼 시간대를 나눠 따로 적은 사용량입니다. 모두 더하면 총사용량이 되어야 합니다."}, {"term": "본사 신고표", "desc": "해외 법인이 본사에 보고한 사용량을 모은 표입니다."}], "docs": [{"name": "해외 법인 전력 인보이스(다국어)", "desc": "나라별 언어로 된 청구서에서 기간과 사용량을 확인합니다"}, {"name": "본사 신고표", "desc": "법인이 본사에 보고한 사용량입니다"}, {"name": "계량기 목록", "desc": "법인별 계량기 번호를 정리한 기준표입니다"}], "fields": ["법인", "계량기 번호", "청구 기간", "사용량·단위(MWh/kWh)", "시간대별 사용량", "총사용량"], "key": "계량기 번호 + 청구 기간: 어느 계량기의 어느 기간 사용량인지 가리킵니다", "check": "청구서 사용량(단위 환산, 시간대별 합계)을 본사 신고값과 비교하고, 청구 기간이 보고 기간과 맞는지 봅니다", "exceptions": ["1.2MWh를 kWh 칸에 1.2로 그대로 적은 신고값", "청구 기간이 3월 15일부터 4월 14일이라 보고 월과 어긋남", "시간대별 사용량 합계와 총사용량이 다른 청구서"], "output": "법인·계량기별 차이율, 근거 페이지, 수정 필요 여부", "steps": [{"node": "Parse", "what": "여러 언어로 된 청구서를 글자와 표로 읽습니다"}, {"node": "Extract", "what": "계량기 번호, 기간, 단위, 시간대별·총사용량을 뽑습니다"}, {"node": "Match", "what": "계량기 번호와 기간으로 본사 신고표, 계량기 목록과 짝짓습니다"}, {"node": "Validate", "what": "단위를 맞춘 사용량 차이와 합계 일치를 판정합니다"}, {"node": "Instruct", "what": "기간 어긋남이나 단위 오류인지 판단하고 수정 필요 여부를 씁니다"}, {"node": "Export", "what": "계량기별 차이율과 근거 페이지를 표로 저장합니다"}], "problem": "본사 담당자는 해외 법인 수십 곳의 청구서를 분기나 연말마다 모아 사용량을 보고표와 대조하는데, 모르는 언어의 청구서에서 사용량 줄을 찾는 것부터 번역기에 의존해야 합니다. 계량기가 여러 대인 법인은 시간대별 사용량을 더해 총사용량을 맞춰야 하고, 단위를 바꾸는 계산을 손으로 하다 보면 자릿수를 틀리기 쉽습니다. 사용량이 틀리면 에너지 사용 보고처럼 외부에 공개하는 숫자까지 잘못되어 나중에 고쳐서 다시 알려야 할 수 있습니다.", "why": "여러 언어와 양식의 청구서를 읽어야 하는 일이라, 양식을 나라마다 미리 등록하지 않고 '청구 기간', '사용량', '단위' 같은 항목 설명만으로 읽어 내는 방식이 맞습니다. 계량기 번호와 청구 기간으로 청구서와 본사 신고표를 한 행에 묶으면(M  영수증마다 부가세가 따로 적혀 있기도 하고 가격에 포함돼 있기도 해서 매번 다시 판단해야 하고, 금액을 확정한 뒤에는 승인 구간이 바뀌었는지 기준표를 다시 봐야 합니다. 검산을 빠뜨리면 실제보다 많은 돈이 지급되고, 관리자 승인을 받아야 할 건이 일반 승인으로 처리되면 내부 통제 규정을 어긴 것이 됩니다.", "why": "품목 합계, 부가세, 총액, 청구액 사이의 관계는 계산식으로 딱 떨어지므로, 영수증마다 사람이 계산기를 두드리는 대신 한 번 정한 검산 규칙(Validate)을 모든 정산서에 똑같이 적용하는 것이 맞습니다. 다만 부가세가 포함된 가격인지, 단순 오타인지는 영수증 표기를 읽고 판단해야 하므로 이 부분만 맥락 판단(Instruct)으로 나누어 애매하면 '검토 필요'로 남깁니다. 뽑은 금액마다 영수증의 어느 줄에서 가져왔는지 위치가 남아 오타로 의심되는 건을 사람이 원본과 바로 대조할 수 있습니다.", "difficulty": "입문"}, {"uid": "U006", "i": 5, "no": 95, "pattern": "대조", "industry": "회사 공통 업무", "dept": ["재무·회계"], "task": "들어온 인보이스가 계약서와 맞는지 확인한다", "title": "협력사 청구서를 계약과 맞추기", "oneliner": "청구서 단가와 할인 조건이 계약대로인지 확인합니다", "story": "회사 구매팀이나 재무팀은 협력사가 보낸 청구서가 계약서에 정한 단가와 조건대로 왔는지 확인한 뒤 돈을 지급합니다. 계약에는 일정 물량을 넘으면 깎아 주는 조건이나 기간별 단가가 들어 있고, 계약을 갱신하면서 단가가 바뀌기도 합니다. 청구서 양식과 항목 이름이 계약과 달라 사람이 짝을 맞추기 어렵고 할인 누락을 놓치기 쉽습니다. 워크플로우는 청구 항목을 계약 단가표와 짝지어 차액과 빠진 할인을 찾아 승인할지 설명을 요청할지 정리합니다.", "terms": [{"term": "인보이스(청구서)", "desc": "물건이나 서비스를 제공한 쪽이 돈을 달라고 보내는 문서입니다."}, {"term": "용역 계약", "desc": "물건이 아니라 일이나 서비스를 해 주기로 한 계약입니다."}, {"term": "물량 할인", "desc": "정해진 수량 이상 사면 단가를 깎아 주는 조건입니다."}, {"term": "부속·갱신 합의서", "desc": "원래 계약에 덧붙이거나 기간을 늘리면서 조건을 바꾼 문서입니다."}], "docs": [{"name": "협력사 청구서", "desc": "청구 월, 항목, 수량, 단가, 합계를 확인합니다"}, {"name": "용역 계약서", "desc": "할인 조건과 적용 기간을 확인합니다"}, {"name": "계약 단가표(별첨)", "desc": "항목별로 약속한 단가가 담긴 표입니다"}, {"name": "부속·갱신 합의서", "desc": "갱신 후 바뀐 단가와 조건을 확인합니다"}], "fields": ["협력사명", "청구 월", "항목·수량", "단가", "청구 합계", "조건부 할인 조항"], "key": "계약번호(협력사): 청구서를 해당 계약과 짝짓는 번호입니다", "check": "청구 항목 단가를 계약 단가표와 비교하고, 물량 할인과 적용 기간이 청구서에 반영됐는지 봅니다", "exceptions": ["1,000개 이상 10% 할인 구간을 넘었는데 할인 줄이 없는 청구서", "갱신 후에도 갱신 전 옛 단가로 청구", "계약서는 '유지보수', 청구서는 '기술지원'처럼 항목명이 다름"], "output": "항목별 일치·불일치, 미적용 조건과 차액, 승인 또는 소명 요청", "steps": [{"node": "Parse", "what": "청구서와 계약 문서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "청구서, 계약서, 단가표, 합의서로 나눕니다"}, {"node": "Extract ×2", "what": "청구서와 계약 문서에서 항목, 수량, 단가, 할인 조건을 뽑습니다"}, {"node": "Match", "what": "계약번호와 항목으로 청구 항목과 계약 단가를 짝짓습니다"}, {"node": "Validate", "what": "단가 일치와 할인 적용 여부를 판정합니다"}, {"node": "Instruct", "what": "항목명 차이를 감안해 판단하고 승인 또는 소명 요청 문장을 씁니다"}], "problem": "구매 담당자는 매달 협력사 수십 곳에서 온 청구서를 지급 마감 전까지 확인해야 하고, 청구서 한 장마다 계약서, 단가표 별첨, 갱신 합의서를 차례로 꺼내 단가를 찾습니다. 계약 문서가 여러 판본으로 쌓여 있으면 이번 청구 월에 어느 단가가 적용되는지부터 헷갈리고, 할인 조건은 계약서 본문 깊숙이 있어 청구서만 보고는 떠올리기 어렵습니다. 놓친 할인과 옛 단가 청구는 그대로 지급되어 회사가 매달 조금씩 더 내게 되고, 나중에 발견해도 돌려받기 어렵습니다.", "why": "이 일은 청구 항목과 계약 단가를 짝짓는 데서 시작하는데, 항목 이름이 서류마다 달라 단순 글자 비교로는 짝이 맞지 않습니다. Studio는 계약번호와 항목으로 청구서와 단가표를 한 행에 묶은(Match) 뒤, 단가와 할인 적용은 규칙으로 검사(Validate)하고 항목명이 다른 건만 맥락 판단(Instruct)으로 넘겨 같은 항목인지 가립니다. 뽑은 단가마다 계약서의 어느 조항에서 가져왔는지 위치가 남아 협력사에 소명(설명과 근거)을 요청할 때 근거로 바로 쓸 수 있습니다.", "difficulty": "중급"}, {"uid": "U007", "i": 6, "no": 96, "pattern": "대조", "industry": "회사 공통 업무", "dept": ["재무·회계", "구매·조달"], "task": "발주, 입고, 인보이스 세 가지를 맞춰 보고 지급한다", "title": "주문·입고·청구 세 서류 맞추기", "oneliner": "주문한 것, 받은 것, 청구된 것이 같은지 확인합니다", "story": "회사 구매팀이나 재무팀은 공급사에 돈을 주기 전에 주문서, 물건을 받았다는 확인서, 공급사 청구서 세 가지를 맞춰 봅니다. 세 서류의 품목, 수량, 단가가 같아야 지급할 수 있는데, 품목 이름 표기만 다르거나 일부만 납품된 경우가 자주 섞입니다. 같은 주문에 청구서가 두 번 오면 중복 지급이 생길 수 있습니다. 워크플로우는 주문번호로 세 서류를 묶어 차이를 표기 차이, 부분 납품, 실제 불일치로 나누고 지급 승인이나 보류를 판정합니다.", "terms": [{"term": "발주서(PO)", "desc": "회사가 공급사에 물건을 주문할 때 보내는 문서입니다. PO는 Purchase Order의 줄임말입니다."}, {"term": "입고 확인서", "desc": "주문한 물건이 실제로 창고에 들어왔다는 기록입니다."}, {"term": "3-way 대조", "desc": "주문서, 입고 기록, 청구서 세 가지를 서로 맞춰 보는 확인 방법입니다."}, {"term": "부분 납품", "desc": "주문한 수량 중 일부만 먼저 보낸 것입니다."}], "docs": [{"name": "발주서", "desc": "주문한 품목, 수량, 단가를 확인합니다"}, {"name": "입고 확인서", "desc": "실제로 받은 수량을 확인합니다"}, {"name": "공급사 인보이스", "desc": "공급사가 청구한 수량과 금액을 확인합니다"}], "fields": ["발주번호", "품목명·품번", "발주 수량", "입고 수량", "청구 수량", "단가·합계"], "key": "발주번호(PO No.): 세 서류를 같은 주문으로 묶는 번호입니다", "check": "주문서, 입고 확인서, 청구서의 품목, 수량, 단가를 세 방향으로 비교합니다", "exceptions": ["주문서는 'A4 복사용지', 청구서는 '복사지 A4'로 표기만 다른 같은 품목", "100개 주문 중 60개만 입고됐는데 100개 전량 청구", "같은 발주번호로 인보이스가 두 번 들어옴"], "output": "예외 분류(표기 차이·부분 납품·실제 불일치)와 지급 승인 또는 보류", "steps": [{"node": "Parse", "what": "세 서류를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "발주서, 입고 확인서, 인보이스로 나눕니다"}, {"node": "Extract ×3", "what": "세 서류에서 각각 품목, 수량, 단가를 뽑습니다"}, {"node": "Merge", "what": "발주번호 기준으로 결과를 한 줄로 합칩니다"}, {"node": "Match", "what": "품번과 품목명으로 세 서류의 같은 품목을 짝짓습니다"}, {"node": "Validate", "what": "수량과 단가가 같은지, 중복 청구인지 판정합니다"}, {"node": "Instruct", "what": "차이를 표기 차이, 부분 납품, 실제 불일치로 나누고 지급 여부를 정합니다"}], "problem": "재무팀은 지급일마다 청구서 수백 장을 발주서, 입고 확인서와 짝지어 확인하고, 서류 세 장을 나란히 놓고 품목 줄마다 수량과 단가를 눈으로 맞춥니다. 발주 한 건에 품목이 여러 줄이고 입고가 여러 번 나뉘면 어느 입고가 어느 청구에 해당하는지 따라가기 어렵습니다. 확인이 밀리면 지급이 늦어져 공급사 불만이 쌓이고, 서둘러 넘기면 받지 않은 물건값까지 지급하게 됩니다.", "why": "발주번호로 세 서류를 한 행에 묶고 품번으로 같은 품목끼리 짝지으면(Match) 입고 수량이 청구 수량보다 적은 줄과 청구서가 두 번 들어온 발주가 그 자리에서 드러나므로, 사람이 서류를 오가며 찾을 필요가 없습니다. 수량과 단가가 같은지는 규칙 검사(Validate)로 걸러 내고, '복사용지'와 '복사지'처럼 표기만 다른 품목인지는 맥락 판단(Instruct)이 맡아 단순 표기 차이와 실제 불일치를 구분합니다. 공급사마다 청구서 양식이 달라도 양식을 미리 등록하지 않고 항목 설명만으로 읽어 내서 새 공급사가 생겨도 설정을 다시 하지 않습니다.", "difficulty": "중급"}, {"uid": "U008", "i": 7, "no": 116, "pattern": "대조", "industry": "회사 공통 업무", "dept": ["재무·회계"], "task": "파견과 도급 인력의 근무 실적을 청구서와 계약 단가에 맞춰 확인한다", "title": "외주 인력 청구 근무 기록 대조", "oneliner": "외주 인력 청구 등급과 일수가 계약과 기록대로인지 봅니다", "story": "외부 업체에서 인력을 받아 쓰는 회사의 담당자는 업체가 보낸 청구서가 계약한 등급과 단가, 실제 근무 일수대로인지 확인합니다. 계약은 중급인데 고급 단가로 청구하거나, 중간에 빠진 인력을 한 달 꽉 채워 청구하는 일이 생길 수 있습니다. 인력이 많으면 청구서, 인력 명세, 근무 기록을 사람마다 맞추기 어렵습니다. 워크플로우는 인력별로 세 문서를 맞춰 등급, 일수, 금액 차이를 찾아 정리합니다.", "terms": [{"term": "파견·도급", "desc": "외부 업체 소속 인력이 우리 회사 일을 하는 방식입니다. 누가 일을 지시하는지에 따라 구분합니다."}, {"term": "M/M(맨먼스)", "desc": "한 사람이 한 달 동안 일한 양을 1로 세는 단위입니다."}, {"term": "타임시트", "desc": "언제 며칠 일했는지 적고 승인받는 근무 기록표입니다."}, {"term": "계약 등급", "desc": "인력의 경력 수준에 따라 초급, 중급, 고급처럼 나눈 등급입니다. 등급마다 단가가 다릅니다."}], "docs": [{"name": "외주 업체 청구서", "desc": "인력별 청구 등급, M/M, 금액을 확인합니다"}, {"name": "투입 인력 명세", "desc": "누가 어떤 등급으로 투입됐는지 확인합니다"}, {"name": "승인 타임시트", "desc": "실제 근무 일수를 확인합니다"}, {"name": "계약 단가표", "desc": "등급별 약속한 단가가 담긴 기준표입니다"}], "fields": ["인력(익명 ID)", "계약 등급", "청구 등급", "투입 일수", "청구 M/M", "단가"], "key": "인력 ID + 청구 월: 어느 인력의 몇 월 청구인지 가리킵니다", "check": "청구 등급과 M/M을 계약 등급, 단가, 승인된 근무 일수와 비교합니다", "exceptions": ["중급으로 계약한 인력을 고급 단가로 청구", "15일에 철수했는데 1.0 M/M으로 청구", "투입 인력 명세와 계약에 없는 인력이 청구서에 있음"], "output": "인력별 불일치·차액 목록과 승인 또는 소명 요청", "steps": [{"node": "Parse", "what": "청구서와 인력 관련 문서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "청구서, 인력 명세, 타임시트, 단가표로 나눕니다"}, {"node": "Extract ×3", "what": "세 종류 문서에서 인력 ID, 등급, 일수, 금액을 뽑습니다"}, {"node": "Merge", "what": "인력과 월 기준으로 결과를 합칩니다"}, {"node": "Match", "what": "등급으로 계약 단가표를 짝지어 붙입니다"}, {"node": "Validate", "what": "등급, 일수, 금액이 맞는지 판정합니다"}, {"node": "Instruct", "what": "차이 사유를 보고 승인할지 소명을 요청할지 판단해 문장을 씁니다"}], "problem": "담당자는 매달 외주 업체마다 청구서를 받아 인력 수십 명의 등급과 일수를 인력 명세, 타임시트와 하나씩 맞춥니다. 인력 투입과 철수가 잦으면 지난달 명세와 이번 달 청구가 어긋나는 사람을 찾는 데 시간이 많이 들고, 같은 이름이나 비슷한 ID가 있으면 사람을 혼동합니다. 과다 청구를 그대로 지급하면 매달 그 차액이 반복되고, 나중에 발견해도 업체와 정산 다툼이 길어집니다.", "why": "인력 ID와 청구 월로 청구서, 인력 명세, 타임시트를 한 행에 묶고 등급별 계약 단가표까지 짝지어 붙이면(Match) 계약에 없는 인력, 등급이 다른 인력, 일수와 M/M(한 사람의 한 달 근무량)이 맞지 않는 인력이 한 표에서 바로 드러납니다. 등급, 단가, 일수 계산은 규칙 검사(Validate)로 걸러 내고, 중간 철수처럼 사유 설명이 필요한 건만 맥락 판단(Instruct)이 맡아 승인과 소명 요청을 나눕니다. 업체마다 청구서 양식이 달라도 양식을 미리 등록하지 않고 항목 설명만으로 읽어 내서 업체가 바뀌어도 그대로 씁니다.", "difficulty": "중급"}, {"uid": "U009", "i": 8, "no": 118, "pattern": "대조", "industry": "회사 공통 업무", "dept": ["재무·회계", "IT·보안"], "task": "소프트웨어 라이선스 청구가 계약 수량과 단가대로 왔는지 확인한다", "title": "소프트웨어 구독료 청구 확인하기", "oneliner": "구독 청구 수량과 단가, 갱신 조건이 계약대로인지 봅니다", "story": "소프트웨어를 구독해 쓰는 회사의 IT 구매 담당자는 벤더가 보낸 청구서가 계약한 사용자 수와 단가대로인지 확인합니다. 계약을 자동으로 연장할 때 단가를 얼마까지 올릴 수 있는지, 해지하려면 언제까지 알려야 하는지도 계약서에 있습니다. 추가 주문 없이 사용자 수가 늘었거나 해지 기한이 지나 버리면 원치 않는 비용을 내게 됩니다. 워크플로우는 청구 내용을 계약과 주문서에 맞춰 보고 위반 항목과 기한 일정을 정리합니다.", "terms": [{"term": "라이선스·구독", "desc": "소프트웨어를 쓸 권리를 사는 것입니다. 구독은 매달이나 매년 돈을 내고 쓰는 방식입니다."}, {"term": "벤더", "desc": "소프트웨어나 물건을 파는 회사입니다."}, {"term": "자동 갱신", "desc": "따로 해지하지 않으면 계약이 저절로 연장되는 조건입니다."}, {"term": "인상 상한", "desc": "갱신할 때 단가를 최대 몇 %까지만 올릴 수 있다는 약속입니다."}], "docs": [{"name": "소프트웨어 구독 계약서", "desc": "사용자 수, 단가, 기간, 갱신과 해지 조건을 확인합니다"}, {"name": "주문서(추가 주문서)", "desc": "사용자 수를 늘린 주문이 있었는지 확인합니다"}, {"name": "벤더 청구서·갱신 청구서", "desc": "청구된 수량과 단가를 확인합니다"}], "fields": ["벤더", "사용자 수", "단가", "계약 기간", "자동 갱신·해지 통보 기한", "인상 상한"], "key": "계약번호(벤더): 청구서를 해당 구독 계약과 짝짓는 번호입니다", "check": "청구 수량과 단가를 계약·주문서와 비교하고, 갱신 단가 인상률이 상한 안인지, 해지 통보 기한이 지났는지 봅니다", "exceptions": ["인상 상한 5%인데 갱신 단가가 8% 오름", "주문서는 100명인데 청구는 120명", "갱신 60일 전까지인 해지 통보 기한이 이미 지난 계약"], "output": "계약 위반 항목, 갱신·통보 기한 일정, 승인 또는 문의", "steps": [{"node": "Parse", "what": "계약서와 청구서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "계약서, 주문서, 청구서로 나눕니다"}, {"node": "Extract ×2", "what": "계약 문서와 청구서에서 수량, 단가, 기간, 기한 조건을 뽑습니다"}, {"node": "Match", "what": "계약번호로 청구 내용과 계약·주문 내용을 짝짓습니다"}, {"node": "Validate", "what": "수량, 인상률, 해지 기한을 판정합니다"}, {"node": "Instruct", "what": "위반 내용을 보고 벤더 문의 문장이나 승인 의견을 씁니다"}, {"node": "Export", "what": "계약별 기한 일정과 확인 결과를 저장합니다"}], "problem": "IT 구매 담당자는 벤더 수십 곳의 구독 계약을 관리하면서 갱신 시점과 해지 통보 기한을 엑셀에 적어 두고 직접 챙깁니다. 계약서마다 갱신 조건이 적힌 위치와 표현이 달라 기한을 찾으려면 계약서를 처음부터 다시 읽어야 하고, 청구서가 오면 사용자 수와 단가를 계약서, 추가 주문서와 번갈아 대조해야 합니다. 기한을 하루라도 넘기면 쓰지 않는 소프트웨어를 한 해 더 계약하게 되고, 늘어난 사용자 수를 확인하지 않으면 매달 청구액이 조용히 불어납니다.", "why": "계약번호로 계약서, 주문서, 청구서를 한 행에 묶으면(Match) 주문 없이 늘어난 사용자 수와 상한을 넘긴 인상률이 그 자리에서 드러나므로 사람이 문서를 오갈 필요가 없습니다. 수량, 인상률, 해지 기한 계산은 규칙 검사(Validate)로 걸러 내고, 벤더에 문의할 문장을 쓰는 일만 맥락 판단(Instruct)이 맡습니다. 뽑은 조건마다 계약서의 어느 조항에서 가져왔는지 위치가 남아 벤더와 이견이 생겼을 때 근거를 바로 보여 줄 수 있습니다.", "difficulty": "중급"}, {"uid": "U010", "i": 9, "no": 119, "pattern": "대조", "industry": "회사 공통 업무", "dept": [], "task": "통신 회선과 클라우드 청구서를 약정 조건에 맞춰 확인한다", "title": "통신·클라우드 요금 과청구 찾기", "oneliner": "청구서를 약정 조건과 맞춰 과청구를 찾습니다", "story": "회사 IT팀이나 총무팀은 인터넷 회선과 클라우드 서비스 청구서가 약정한 요금과 할인대로 나왔는지 확인합니다. 회선을 해지했는데 청구가 이어지거나, 약속한 할인이 빠지는 일이 생깁니다. 회선 번호 표기가 청구서마다 조금씩 달라 같은 회선인지 맞추는 것부터 번거롭습니다. 워크플로우는 회선·계정 번호로 청구서와 약정 내역을 짝지어 과청구와 해지 후 청구를 목록으로 만듭니다.", "terms": [{"term": "회선", "desc": "회사에 깔린 인터넷이나 전화 연결 한 줄입니다 ": "실제 낸 금액을 확인합니다"}, {"name": "통신요금 명세서", "desc": "요금을 항목별로 보고 지원 대상만 골라냅니다"}, {"name": "지급 기준표", "desc": "지원 항목과 직원별 한도를 정한 기준 엑셀입니다"}, {"name": "지급 이력", "desc": "같은 이용 월에 이미 지급했는지 확인합니다"}], "fields": ["직원명(사번)", "이용 월", "청구 총액", "항목별 요금", "지원 대상 금액", "지급 한도"], "key": "사번 + 이용 월: 어느 직원의 몇 월 요금인지 가리킵니다", "check": "청구 항목을 지원 기준과 한도에 비교하고, 같은 이용 월에 이미 지급했는지 봅니다", "exceptions": ["기본요금 5만 원에 단말기 할부금 3만 원, 소액결제 1만 원이 섞인 명세서", "지급 한도 5만 원인데 7만 원을 청구", "지난달 지급된 9월분 영수증이 이번 달에 다시 제출됨"], "output": "직원별 지급액과 한도 초과·중복·보완 목록", "steps": [{"node": "Parse", "what": "신청서와 영수증, 명세서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "신청서, 영수증, 명세서로 나눕니다"}, {"node": "Extract ×3", "what": "세 종류 문서에서 사번, 이용 월, 항목별 금액을 뽑습니다"}, {"node": "Merge", "what": "직원과 이용 월 기준으로 결과를 합칩니다"}, {"node": "Match", "what": "사번으로 지급 기준표와 지급 이력을 짝지어 붙입니다"}, {"node": "Validate", "what": "지원 대상 항목, 한도 초과, 중복 지급을 판정합니다"}, {"node": "Instruct", "what": "애매한 항목을 판단하고 보완 요청 사유를 씁니다"}, {"node": "Export", "what": "직원별 지급액 표를 저장합니다"}], "problem": "인사팀 담당자는 매달 직원 수백 명이 올린 신청서와 명세서를 한 건씩 열어 항목별 금액을 확인하고 지급액을 엑셀에 옮겨 적습니다. 통신사마다 명세서 항목 이름과 배치가 달라 어떤 줄이 지원 대상인지 매번 다시 읽어야 하고, 금액을 옮기다 숫자를 잘못 치거나 한도 비교를 빠뜨립니다. 과다 지급은 나중에 직원에게 돌려받아야 해서 서로 불편하고, 중복 지급은 감사에서 지적 대상이 됩니다.", "why": "지원 대상 항목을 고르고 한도와 비교하는 기준은 한 번 정해지면 모든 직원에게 똑같이 적용되어야 하는 규칙이므로, 매번 사람이 판단하기보다 기준을 저장해 두고 반복 적용하는 워크플로우에 맞습니다. Studio는 통신사마다 다른 명세서 양식을 미리 등록하지 않아도 '단말기 할부금', '소액결제' 같은 항목 설명만으로 읽어 냅니다. 사번과 이용 월로 지급 이력을 한 행에 붙이면(Match) 이미 지급한 달의 영수증이 다시 들어왔을 때 그 자리에서 드러납니다.", "difficulty": "심화"}, {"uid": "U018", "i": 17, "no": 106, "pattern": "검증", "industry": "회사 공통 업무", "dept": ["재무·회계"], "task": "감사 요청 자료 목록과 제출된 서류를 맞춰 빠진 것을 찾는다", "title": "감사 요청 자료 빠진 것 찾기", "oneliner": "감사인이 요청한 자료 목록과 제출 서류를 맞춰 봅니다", "story": "회계감사를 받는 회사의 재무팀은 감사인이 보낸 요청 자료 목록에 맞춰 부서별로 서류를 모아 제출합니다. 항목마다 기준일과 필요한 세부 내역이 정해져 있는데, 받은 서류가 기준일이 다르거나 일부 내역이 빠진 경우가 흔합니다. 항목이 많으면 무엇이 아직 안 들어왔는지 놓치기 쉽습니다. 워크플로우는 요청 항목별로 제출 서류 내용을 확인해 충족, 보완, 미제출로 나눠 줍니다.", "terms": [{"term": "PBC", "desc": "Prepared By Client의 줄임말로, 감사인이 회사에 준비해 달라고 요청한 자료 목록입니다."}, {"term": "매출채권", "desc": "물건을 팔았지만 아직 받지 못한 돈입니다."}, {"term": "고정자산", "desc": "건물, 기계처럼 오래 쓰는 회사 재산입니다."}, {"term": "연령별 내역", "desc": "받을 돈을 얼마나 오래 못 받았는지 기간별로 나눈 표입니다."}], "docs": [{"name": "감사 요청 자료 목록(PBC)", "desc": "요청 항목, 기준일, 필요한 세부 내역, 기한을 확인합니다"}, {"name": "부서별 제출 현황표", "desc": "어느 부서가 무엇을 냈는지 기록한 표입니다"}, {"name": "매출채권 명세서", "desc": "거래처별 받을 돈과 연령별 내역이 있는지 봅니다"}, {"name": "고정자산 명세서", "desc": "자산 목록과 처분 내역이 있는지 봅니다"}, {"name": "보완 제출본", "desc": "다시 낸 서류의 버전을 확인합니다"}], "fields": ["요청 항목", "대상 기간·기준일", "요구 세부 내역", "담당 부서", "제출 기한", "제출 버전"], "key": "PBC 요청 항목 번호: 요청 목록의 각 항목에 붙은 번호입니다", "check": "요청 항목의 기준일과 세부 내역을 제출 서류 내용과 비교하고, 요청 목록과 제출 현황을 비교해 미제출을 찾습니다", "exceptions": ["요청은 12월 31일 기준인데 11월 30일 기준 명세서를 냄", "연령별 내역 시트가 빠진 매출채권 명세서", "올해 처분한 자산 내역이 빠진 고정자산 명세서"], "output": "요청 항목별 충족·보완·미제출 목록", "steps": [{"node": "Parse", "what": "요청 목록과 제출 서류를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "요청 목록, 현황표, 명세서, 보완본으로 나눕니다"}, {"node": "Extract ×2", "what": "요청 목록과 제출 서류에서 기준일, 세부 내역, 버전을 뽑습니다"}, {"node": "Match", "what": "요청 항목 번호로 요청과 제출 서류를 짝짓습니다"}, {"node": "Validate", "what": "기준일과 세부 내역 충족 여부, 미제출을 판정합니다"}, {"node": "Instruct", "what": "빠진 내용을 보고 부서별 보완 요청 문장을 씁니다"}, {"node": "Export", "what": "항목별 현황표를 저장합니다"}], "problem": "재무팀 담당자는 감사 기간 몇 주 동안 요청 항목 수십에서 수백 개를 부서별로 나눠 보내고, 들어온 파일을 열어 요청대로 됐는지 하나씩 확인한 뒤 현황표를 손으로 고칩니다. 파일 이름만 보고 제출 완료로 표시했다가 기준일이 다르거나 시트가 빠진 것을 감사인이 먼저 발견하면 다시 요청하는 데 하루 이틀이 더 걸립니다. 이런 지연이 쌓이면 감사 일정이 밀리고, 감사인에게 자료 관리가 허술하다는 인상을 줍니다.", "why": "요청 항목마다 '기준일이 맞는가', '필요한 시트가 있는가'처럼 확인 기준이 미리 정해져 있어, 기준을 한 번 적어 두면 제출 서류가 들어올 때마다 똑같이 적용하는 워크플로우에 맞습니다. 요청 목록(PBC)의 항목 번호로 요청과 제출 서류, 보완본을 한 행에 묶으면(Match) 아직 안 들어온 항목은 빈칸으로, 기준일이 다른 항목은 불일치로 바로 보입니다. 내용이 충분한지 애매한 서류는 Instruct 단계에서 추측하지 않고 '보완'으로 분류해 사람이 최종 판단하게 합니다.", "difficulty": "심화"}, {"uid": "U019", "i": 18, "no": 93, "pattern": "입력", "industry": "회사 공통 업무", "dept": ["재무·회계"], "task": "세금계산서를 받아 전표를 만들고 계정과목을 매긴다", "title": "세금계산서로 회계 전표 만들기", "oneliner": "세금계산서를 읽어 전표 초안과 계정 분류를 만듭니다", "story": "회사 회계팀은 거래처에서 받은 세금계산서마다 회계 장부에 올릴 기록을 만들고, 이 돈이 어떤 성격의 비용인지 분류합니다. 같은 거래처라도 소모품을 산 건지 수리를 맡긴 건지에 따라 분류가 달라지고, 과거에 어떻게 처리했는지도 참고해야 합니다. 품목이 비어 있거나 분류가 예전과 달라지면 실수가 생기기 쉽습니다. 워크플로우는 세금계산서와 거래명세서를 맞춰 보고 과거 기록과 사내 기준을 참고해 전표 초안을 만들고 확인이 필요한 건을 따로 표시합니다.", "terms": [{"term": "전표", "desc": "회계 장부에 거래 한 건을 기록하는 단위입니다. 날짜, 금액, 어떤 돈인지를 적습니다."}, {"term": "계정과목", "desc": "돈의 성격을 나누는 이름표입니다. 소모품비, 수선비, 광고비 같은 분류입니다."}, {"term": "거래명세서", "desc": "무엇을 몇 개 얼마에 거래했는지 품목별로 적은 문서입니다."}, {"term": "공급가액", "desc": "부가세를 빼고 물건이나 서비스 자체의 값만 적은 금액입니다."}], "docs": [{"name": "세금계산서", "desc": "거래처, 작성일, 공급가액, 세액, 품목을 확인합니다"}, {"name": "거래명세서", "desc": "품목과 금액이 세금계산서와 같은지 봅니다"}, {"name": "구매 요청서", "desc": "누가 무엇을 사려 했는지, 어느 부서 비용인지 확인합니다"}, {"name": "과거 전표", "desc": "같은 거래처를 예전에 어떤 계정으로 처리했는지 봅니다"}, {"name": "계정과목 기준표", "desc": "품목별로 어떤 계정을 쓰는지 정한 사내 기준 엑셀입니다"}], "fields": ["거래처", "작성일자", "공급가액", "세액", "품목", "계정과목·귀속 부서"], "key": "거래처 + 거래명세서 번호: 세금계산서와 명세서를 짝짓는 값입니다", "check": "세금계산서 금액·품목을 거래명세서와 비교하고, 이번 계정을 같은 거래처 과거 전표와 사내 기준에 비춰 봅니다", "exceptions": ["같은 거래처에서 한 번은 소모품, 한 번은 장비 수리를 청구", "품목란이 비어 있어 계정을 정하기 어려운 세금계산서", "과거에는 소모품비였는데 이번에 수선비로 바뀐 건"], "output": "전표 초안과 계정 불일치·확인 필요 목록", "steps": [{"node": "Parse", "what": "세금계산서와 관련 문서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "세금계산서, 거래명세서, 구매 요청서로 나눕니다"}, {"node": "Extract ×3", "what": "세 종류 문서에서 거래처, 금액, 품목, 부서를 뽑습니다"}, {"node": "Merge", "what": "같은 거래 건으로 결과를 합칩니다"}, {"node": "Match", "what": "거래처로 과거 전표와 계정과목 기준표를 짝지어 붙입니다"}, {"node": "Validate", "what": "금액 일치와 계정이 기준에 맞는지 판정합니다"}, {"node": "Instruct", "what": "품목과 맥락을 보고 알맞은 계정을 제안하고 확인 사유를 씁니다"}, {"node": "Export", "what": "전표 초안을 표로 저장합니다"}], "problem": "회계팀은 매달 마감 전 며칠 동안 세금계산서 수백 장을 한 장씩 보고 거래처와 금액을 옮겨 적은 뒤 계정과목을 고르는 일을 반복합니다. 계정과목은 담당자의 기억이나 과거 전표 검색에 기대기 때문에 사람이 바뀌면 같은 거래가 다른 계정으로 들어가고, 입력 오타는 월말 결산(한 달 장부를 마감하는 일) 때 합계가 맞지 않아야 비로소 드러납니다. 잘못 분류된 비용은 재무제표와 세금 신고에 그대로 반영되어 나중에 수정 신고를 해야 할 수 있습니다.", "why": "금액이 거래명세서와 맞는지는 규칙으로 바로 확인할 "node": "Validate", "what": "하나로 확정되면 초록, 후보가 여럿이거나 단위가 다르면 노랑으로 판정합니다"}, {"node": "Instruct", "what": "확인이 필요한 건마다 후보와 이유를 적습니다"}, {"node": "Export", "what": "발주 시스템에 넣을 목록을 엑셀로 저장합니다"}], "problem": "주문이 매일 아침 팩스, 사진, 엑셀로 한꺼번에 들어오고, 배송차가 출발하기 전 몇 시간 안에 전부 입력해야 합니다. 잘못 입력하면 다른 품목이 배송되어 반품과 재배송 비용이 들고 거래처 신뢰도 떨어집니다. 거래처별 표기 습관은 오래 일한 담당자 머릿속에만 있어 그 사람이 쉬면 업무가 멈춥니다.", "why": "거래처마다 주문서 양식이 달라도 Studio는 양식을 미리 등록하지 않고 '품목명', '수량', '단위' 같은 항목 설명만으로 읽습니다. 코드가 하나로 확정되는 건과 후보가 여럿인 건을 규칙 검사(Validate)로 나누어, 확신이 없는 건은 추측해서 넣지 않고 '확인 필요'로 사람에게 넘깁니다. 매칭 결과를 컬렉션(결과를 모아 두는 저장소)에 쌓아 두면 같은 거래처의 다음 주문에서 참고 근거가 됩니다.", "difficulty": "중급"}, {"uid": "U026", "i": 25, "no": 62, "pattern": "대조", "industry": "유통·쇼핑몰", "dept": ["재무·회계", "영업·영업지원"], "task": "발주서, 납품서, 인보이스의 납기와 수량과 금액을 맞춰 본다", "title": "주문·납품·청구 서류 맞추기", "oneliner": "주문서, 납품서, 세금계산서의 수량과 금액을 맞춥니다", "story": "유통 회사 재무팀 담당자는 거래처에 돈을 주기 전에 주문한 것, 실제로 받은 것, 청구된 것이 같은지 확인합니다. 세 서류의 양식이 다르고 부분 납품이나 단가 변경이 섞이면 숫자를 하나씩 맞추는 데 오래 걸립니다. 적게 들어왔는데 주문 수량대로 청구된 건을 놓치면 돈을 더 내게 됩니다. 워크플로우는 발주번호로 세 서류를 묶어 수량과 금액 차이를 계산하고, 지급 승인과 보류를 나눠 줍니다.", "terms": [{"term": "거래명세서", "desc": "물건을 보내면서 어떤 품목을 몇 개, 얼마에 보냈는지 적어 주는 서류입니다. 납품서 역할을 합니다."}, {"term": "세금계산서", "desc": "물건값과 부가가치세를 청구하면서 발행하는 공식 세금 서류입니다."}, {"term": "공급가액", "desc": "세금을 빼고 물건값만 계산한 금액입니다."}, {"term": "3자 대사", "desc": "주문서, 납품서, 청구서 세 가지를 서로 맞춰 보는 확인 작업입니다. 대사는 서로 맞춰 본다는 뜻입니다."}], "docs": [{"name": "발주서", "desc": "주문한 품목, 수량, 단가, 납기일을 봅니다."}, {"name": "거래명세서", "desc": "실제로 납품된 수량을 봅니다."}, {"name": "세금계산서", "desc": "청구한 수량, 공급가액, 세액을 봅니다."}], "fields": ["발주번호", "품목", "수량", "단가", "공급가액과 세액", "납기일"], "key": "발주번호: 세 서류가 같은 주문에 대한 것인지 묶어 주는 번호", "check": "발주 수량, 입고 수량, 청구 수량과 단가를 세 서류끼리 비교합니다.", "exceptions": ["입고는 80개인데 세금계산서는 발주 수량 100개로 청구", "발주서 단가는 1,000원, 세금계산서는 1,100원", "100개 중 60개만 먼저 들어온 부분 입고"], "output": "발주별 수량·금액 불일치 목록, 차액, 지급 승인 또는 보류", "steps": [{"node": "Parse", "what": "발주서, 거래명세서, 세금계산서를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "문서를 발주서, 거래명세서, 세금계산서로 나눕니다"}, {"node" 선사 계약 조건(프리타임 특약 메일)", "desc": "무료 기간 일수, 주말 포함 여부, 구간별 요율을 봅니다."}, {"name": "반출입 기록", "desc": "배에서 내린 날, 가져간 날, 돌려준 날을 봅니다."}], "fields": ["컨테이너 번호", "배에서 내린 날(양하일)", "반출일·반납일", "적용 무료 기간", "청구 일수", "구간별 요율"], "key": "컨테이너 번호(+ B/L 번호): 컨테이너 한 개를 가리키는 값으로 청구서와 반출입 기록을 연결합니다.", "check": "청구서의 무료 기간, 계산 시작일, 초과 일수를 계약 조건과 반출입 기록으로 다시 계산해 비교합니다.", "exceptions": ["특약은 무료 14일인데 기본 7일로 청구됨", "한 계약은 주말 제외, 다른 계약은 주말 포함", "특약이 메일 한 줄로만 합의되어 있음"], "output": "컨테이너별 일수·금액 차이 목록 + 이의 제기/지급 판정", "steps": [{"node": "Parse", "what": "청구서, 계약 조건 메일, 반출입 기록을 읽습니다"}, {"node": "Classify", "what": "자료가 청구서, 계약 조건, 반출입 기록 중 무엇인지 나눕니다"}, {"node": "Extract ×3", "what": "청구 일수와 금액, 무료 기간과 요율, 날짜 기록을 각각 뽑습니다"}, {"node": "Merge", "what": "같은 컨테이너 번호의 값을 한 줄로 합칩니다"}, {"node": "Match", "what": "계약별 무료 기간과 요율 조건을 컨테이너에 짝짓습니다"}, {"node": "Validate", "what": "다시 계산한 일수, 금액과 청구값의 차이를 판정합니다"}, {"node": "Instruct", "what": "주말 규칙과 메일 특약을 반영해 이의 제기 근거를 씁니다"}, {"node": "Export", "what": "차이 목록과 판정을 저장합니다"}], "problem": "청구서에는 컨테이너가 수십 개씩 줄지어 있고, 한 개마다 반출입 날짜를 터미널 시스템에서 찾아 일수를 세야 합니다. 지체료는 하루 단위로 쌓이는 요금이라 무료 기간 며칠 차이가 컨테이너 수만큼 곱해져 금액이 커지고, 이의 제기 기한을 넘기면 그대로 내야 합니다. 특약을 합의한 담당자가 바뀌면 그런 조건이 있었다는 사실조차 모른 채 기본 조건으로 지급하게 됩니다.", "why": "무료 기간과 주말 포함 여부 같은 선사별 조건을 Studio에 한 번 기준으로 올려 두면, 매달 청구서의 컨테이너마다 같은 조건이 자동으로 짝지어져(Match) 사람이 특약을 기억할 필요가 없습니다. 반출입 날짜로 일수와 금액을 다시 계산해 청구값과 비교하는 것은 Validate가 규칙으로 처리하고, 메일 한 줄로만 남은 특약처럼 근거가 약한 건은 Instruct가 이의 제기 근거를 따로 정리합니다. 단계가 나뉘어 있어 차이가 나면 날짜를 잘못 읽은 것인지 조건을 잘못 적용한 것인지 바로 확인됩니다.", "difficulty": "중급"}, {"uid": "U039", "i": 38, "no": 103, "pattern": "대조", "industry": "물류·운송", "dept": ["업종 현업"], "task": "항공화물 운송장과 적하목록이 일치하는지 신고 전에 확인한다", "title": "항공 운송장과 적하목록 대조", "oneliner": "신고 전에 항공 운송장과 화물 목록 값을 맞춥니다", "story": "항공 화물을 다루는 포워딩 회사의 담당자는 세관에 신고하기 전에 항공화물 운송장과 적하목록의 개수와 무게가 같은지 확인합니다. 운송장이 여러 번 수정되면 최신본이 적하목록에 반영되지 않는 일이 생깁니다. 실제 무게와 운임 계산용 무게를 헷갈려 비교하는 실수도 잦습니다. 워크플로우는 최신 운송장과 적하목록의 값을 대조해 다른 항목을 찾고 신고를 진행해도 되는지 판정해 줍니다.", "terms": [{"term": "AWB(항공화물 운송장)", "desc": "비행기로 보내는 화물의 운송장입니다. 택배 송장의 항공 버전입니다."}, {"term": "적하목록", "desc": "한 비행기에 실린 화물 전체를 적은 목록입니다. 세관에 신고합니다."}, {"term": "운임 계산용 중량", "desc": "실제 무게와 부피를 따져 운임을 매기는 기준 무게입니다. 가볍지만 큰 짐은 실제보다 무겁게 계산됩니다."}, {"term": "마스터·하우스 운송장", "desc": "마스터는 항공사가 포워딩 회사에 발행하는 큰 운송장, 하우스는 포워딩 회사가 개별 고객에게 발행하는 운송장입니다."}], "docs": [{"name": "항공화물 운송장(AWB)", "desc": "AWB 번호, 포장 개수, 무게, 구간을 봅니다."}, {"name": "AWB 수정본", "desc": "고친 값과 수정 날짜를 봅니다."}, {"name": "적하목록", "desc": "세관에 신고할 화물 목록의 개수와 무게를 봅니다."}, {"name": "항공편 정보", "desc": "출발지와 도착지, 비행편을 봅니다."}], "fields": ["AWB 번호", "포장 개수", "총중량", "운임 계산용 중량", "출발지·도착지", "수정 날짜"], "key": "AWB 번호: 항공 화물 한 건을 가리키는 운송장 번호입니다.", "check": "최신 수정본 운송장과 적하목록의 포장 개수, 총중량, 구간이 같은지 신고 전에 비교합니다.", "exceptions": ["운송장은 18개, 적하목록은 16개", "총중량 자리에 운임 계산용 중량이 들어감", "수정본이 적하목록에 반영되지 않음(마스터와 하우스 운송장이 섞임)"], "output": "AWB별 불일치 항목 목록 + 신고 진행/발행처 확인 판정", "steps": [{"node": "Parse", "what": "운송장, 수정본, 적하목록, 항공편 정보를 읽습니다"}, {"node": "Classify", "what": "문서가 운송장(원본·수정본)인지 적하목록인지 나눕니다"}, {"node": "Extract ×2", "what": "운송장과 적하목록에서 AWB 번호, 개수, 무게, 구간, 수정 날짜를 뽑습니다"}, {"node": "Merge", "what": "같은 AWB 번호의 값을 최신 수정본 기준으로 합칩니다"}, {"node": "Validate", "what": "개수, 무게, 구간이 같은지 판정합니다"}, {"node": "Instruct", "what": "무게 종류 혼동이나 운송장 종류를 보고 발행처 확인 문장을 씁니다"}, {"node": "Export", "what": "불일치 목록과 판정을 저장합니다"}], "problem": "항공 화물은 비행기가 도착한 뒤 세관 신고까지 시간이 몇 시간밖에 없어서, 한 편에 실린 수십 건의 운송장을 그 안에 다 대조해야 합니다. 신고한 뒤 개수나 무게가 틀린 것이 드러나면 틀린 내용을 고쳐 다시 내는 정정 신고를 해야 하고, 과태료(규정을 어겼을 때 내는 벌금)나 화물이 묶이는 일이 따라옵니다. 마스터 운송장 아래 하우스 운송장이 여러 장 달려 있으면 비교할 줄이 배로 늘어나 급할수록 실수가 잦습니다.", "why": "운송장이 여러 번 고쳐졌을 때 어느 것이 최신인지 가려 적하목록과 비교하는 일은 사람이 급하게 하면 섞이기 쉬운데, Studio는 AWB 번호로 묶으면서 수정 날짜가 가장 늦은 값을 기준으로 한 행을 만듭니다. 개수와 무게가 같은지는 Validate가 규칙으로 판정하고, 총중량 자리에 운임 계산용 중량이 들어간 것 같은 혼동은 Instruct가 따로 짚어 발행처에 확인할 문장을 씁니다. 뽑은 값마다 운송장의 어느 위치에서 읽었는지 남아 담당자가 급한 시간에도 해당 칸만 보고 확인할 수 있습니다.", "difficulty": "중급"}, {"uid": "U040", "i": 39, "no": 5, "pattern": "검증", "industry": "물류·운송", "dept": ["업종 현업"], "task": "통관 서류가 서로 맞는지 신고 전에 확인한다", "title": "통관 서류 신고 전 점검", "oneliner": "세관 신고 전에 송장과 포장명세서 값을 맞춰 봅니다", "story": "관세사 사무실이나 물류 회사의 통관 담당자는 수출 신고를 하기 전에 화주가 보낸 상업송장과 포장명세서가 서로 맞는지 확인합니다. 신고가 끝나면 수출신고필증의 값도 원래 서류와 같은지 다시 봅니다. 숫자 자리가 바뀐 중량처럼 작은 오류는 눈에 잘 띄지 않고, 서류가 엑셀이나 사진처럼 형식이 제각각이라 비교가 번거롭습니다. 워크플로우는 세 서류에서 수량, 중량, 금액을 뽑아 대조하고 신고해도 되는지 판정해 줍니다.", "terms": [{"term": "통관", "desc": "물건이 나라 국경을 넘을 때 세관에 신고하고 허가를 받는 절차입니다."}, {"term": "수출신고필증", "desc": "세관이 수출 신고를 받아들였다는 증명서입니다."}, {"term": "순중량·총중량", "desc": "순중량은 물건만의 무게, 총중량은 상자와 포장재까지 합친 무게입니다."}, {"term": "상업송장·포장명세서", "desc": "상업송장은 판 물건과 금액을 적은 명세서이고, 포장명세서는 상자별 내용물과 무게를 적은 목록입니다."}], "docs": [{"name": "상업송장(Commercial Invoice)", "desc": "품명, 수량, 금액을 봅니다."}, {"name": "포장명세서(Packing List)", "desc": "수량과 순중량, 총중량을 봅니다."}, {"name": "수출신고필증", "desc": "세관에 실제로 신고된 값을 봅니다."}], "fields": ["품명·규격", "수량", "순중량", "총중량", "금액", "인보이스 번호"], "key": "인보이스 번호: 같은 수출 건의 세 서류를 묶는 번호입니다.", "check": "신고 전에는 송장과 포장명세서를, 신고 후에는 필증과 원래 서류를 비교해 수량, 중량, 금액이 같은지 봅니다.", "exceptions": ["포장명세서 순중량의 숫자 자리가 바뀜(송장 3,960kg, 포장명세서 3,690kg)", "화주마다 같은 품목을 다른 이름으로 적음", "한 서류는 엑셀, 다른 서류는 휴대폰 사진으로 옴"], "output": "불일치 항목 목록 + 신고 가능/화주 확인 필요 판정", "steps": [{"node": "Parse", "what": "엑셀, PDF, 사진 서류를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "서류가 송장, 포장명세서, 신고필증 중 무엇인지 나눕니다"}, {"node": "Extract ×3", "what": "서류마다 품명, 수량, 중량, 금액, 인보이스 번호를 뽑습니다"}, {"node": "Merge", "what": "같은 인보이스 번호의 값을 한 표로 합칩니다"}, {"node": "Validate", "what": "세 서류의 수량, 중량, 금액이 일치하는지 판정합니다"}, {"node": "Instruct", "what": "품명 표기 차이가 같은 물건인지 보고 화주 확인 문장을 씁니다"}, {"node": "Export", "what": "불일치 목록과 신고 가능 여부를 저장합니다"}], "problem": "신고 한 건에 필요한 비교는 단순하지만, 관세사 사무실은 여러 화주의 건을 동시에 다루기 때문에 같은 비교를 하루 종일 반복합니다. 틀린 값으로 신고하면 정정 신고(틀린 내용을 고쳐 다시 하는 신고)를 해야 하고 경우에 따라 과태료(규정을 어겼을 때 내는 벌금)가 나오며, 화주에게 확인을 요청하는 동안 선적 일정이 밀립니다. 사진으로 온 서류는 숫자를 확대해 가며 읽어야 해서 피로가 쌓일수록 오류가 늘어납니다.", "why": "화주마다 송장 양식이 다르고 엑셀, PDF, 사진이 섞여 들어오는데, Studio는 양식을 미리 등록하지 않고 순중량, 총중량 같은 항목 설명만으로 값을 읽어 냅니다. 뽑은 값은 인보이스 번호로 한 행에 묶이므로 세 서류 중 어느 칸이 다른지 바로 보입니다. 숫자 차이는 규칙으로 걸러 내고, 품명이 달라 같은 물건인지 애매한 건만 화주 확인 대상으로 넘기기 때문에 사람은 그 건만 보면 됩니다.", "difficulty": "중급"}, {"uid": "U041", "i": 40, "no": 1, "pattern": "입력", "industry": "물류·운송", "dept": [], "task": "메일, 팩스, 메신저로 들어오는 주문 접수를 시스템에 자동 입력", "title": "여러 채널 주문 한곳에 모으기", "oneliner": "메일·팩스·메신저 주문을 한 입력 양식으로 정리합니다", "story": "물류 회사의 주문 접수 담당자는 화주(물건을 맡기는 고객사)가 메일, 팩스, 메신저로 보내는 주문을 매일 시스템에 옮겨 적습니다. 채널마다 쓰는 방식이 달라서 같은 품목도 약칭으로 쓰거나, 한 메일에 주문 여러 건을 섞어 보내기도 합니다. 사람이 하나씩 옮기다 보면 수량을 잘못 보거나 한 건을 빠뜨리기 쉽습니다. 워크플로우는 채널별 주문을 읽어 같은 항목으로 뽑고, 코드표와 맞춰 입력값 목록을 만들어 줍니다.", "terms": [{"term": "화주", "desc": "물건을 보내 달라고 물류 회사에 맡기는 고객입니다. 짐의 주인이라고 생각하면 됩니다."}, {"term": "코드표", "desc": "회사가 거래처와 품목마다 붙여 둔 고유 번호 목록입니다. 시스템은 이름보다 이 번호로 구분합니다."}, {"term": "픽업·배송지", "desc": "물건을 가져올 곳과 가져다줄 곳입니다."}], "docs": [{"name": "주문 메일 본문", "desc": "고객이 메일로 보낸 주문 내용입니다. 품목과 수량, 날짜를 봅니다."}, {"name": "팩스 주문서 스캔", "desc": "팩스로 받은 종이 주문서를 스캔한 이미지입니다. 손글씨가 섞여 있을 수 있습니다."}, {"name": "메신저 주문 캡처", "desc": "메신저 대화를 캡처한 이미지입니다. 짧은 말투로 주문이 적혀 있습니다."}, {"name": "화주·품목 코드표", "desc": "고객과 품목의 이름을 시스템 코드로 바꿀 때 쓰는 엑셀 기준표입니다."}], "fields": ["화주(주문한 고객)", "품목", "수량", "픽업지·배송지", "희망 날짜"], "key": "화주 코드: 고객마다 붙인 고유 번호로, 주문과 코드표를 연결합니다.", "check": "채널마다 다르게 적힌 주문을 같은 양식 항목으로 옮기고, 고객과 품목 이름이 코드표에 있는지 맞춰 봅니다.", "exceptions": ["손글씨 팩스에서 수량 '7'과 '1'이 헷갈리게 적힘", "품목명을 약칭으로 씀(코드표에는 정식 이름만 있음)", "메일 한 통에 서로 다른 주문 3건이 섞여 있음"], "output": "주문별 입력값 목록(화주 코드, 품목 코드, 수량, 날짜) + 확인 필요 표시", "steps": [{"node": "Parse", "what": "메일, 팩스 스캔, 메신저 캡처를 글자로 읽습니다"}, {"node": "Classify", "what": "들어온 자료가 메일, 팩스, 메신저 중 무엇인지 나눕니다"}, {"node": "Extract ×3", "what": "채널별로 화주, 품목, 수량, 장소, 날짜를 뽑습니다"}, {"node": "Merge", "what": "세 채널의 결과를 하나의 주문 목록으로 합칩니다"}, {"node": "Match", "what": "화주와 품목 이름을 코드표와 짝지어 코드로 바꿉니다"}, {"node": "Export", "what": "주문 입력값 목록과 확인 필요 표시를 저장합니다"}], "problem": "주문이 들어올 때마다 담당자가 메일함, 팩스함, 메신저 창을 번갈아 열어 같은 항목을 시스템에 다시 입력합니다. 단순한 일이지만 건수가 쌓이면 오전 시간이 통째로 들어가고, 잘못 넣은 수량이나 장소는 트럭이 출발한 뒤에야 드러납니다. 그때는 다시 배송하는 비용과 고객 불만이 함께 따라옵니다.", "why": "범용 AI 챗봇에 메일과 팩스를 통째로 넣으면 그럴듯한 목록은 나오지만, 약칭을 어떤 코드로 바꿨는지, 수량을 어디서 읽었는지 알 수 없어 결국 사람이 처음부터 다시 확인하게 됩니다. Studio는 읽기, 뽑기, 코드표 짝짓기가 각각 노드로 나뉘어 있어 틀린 단계가 바로 보이고, 코드표에 없는 이름은 추측하지 않고 확인 필요로 남깁니다. 팩스나 메신저처럼 양식이 제각각이어도 양식을 미리 등록하지 않고 항목 설명만으로 읽을 수 있습니다.", "difficulty": "중급"}, {"uid": "U042", "i": 41, "no": 10, "pattern": "생성", "industry": "물류·운송", "dept": ["영업·영업지원"], "task": "운임 견적 요청 메일을 받아 견적서를 작성한다", "title": "운임 견적 요청에 견적서 쓰기", "oneliner": "견적 요청 메일로 운임표를 찾아 견적서를 만듭니다", "story": "포워딩 회사의 영업 담당자는 고객이 '이 구간으로 컨테이너 몇 개 보내면 얼마냐'고 묻는 메일을 받으면 견적서를 씁니다. 해운 회사 운임표와 추가 비용표를 뒤져 해당 구간과 기간에 맞는 요금을 찾아야 해서 시간이 걸립니다. 지난달 운임표를 잘못 쓰거나 무게 같은 필수 정보가 빠진 채 견적을 내면 나중에 금액이 바뀝니다. 워크플로우는 요청 내용을 뽑아 유효한 운임표에서 요금을 찾고, 출처를 붙인 견적서 초안과 되물을 질문을 만들어 줍니다.", "terms": [{"term": "운임", "desc": "화물을 실어 나르는 요금입니다."}, {"term": "선사", "desc": "배를 운영하는 해운 회사입니다."}, {"term": "인코텀즈", "desc": "운송비와 위험을 어디까지 파는 쪽이, 어디부터 사는 쪽이 부담하는지 정한 국제 약속입니다. FOB, CIF 같은 약자로 씁니다."}, {"term": "유효기간", "desc": "운임표 가격이 적용되는 기간입니다. 운임은 자주 바뀌어 보통 기간을 정해 둡니다."}, {"term": "내륙 운송비", "desc": "항구까지 또는 항구에서 목적지까지 트럭 등으로 옮기는 비용입니다."}], "docs": [{"name": "견적 요청 메일", "desc": "고객이 보낸 요청입니다. 구간, 컨테이너, 품목, 일정을 봅니다."}, {"name": "선사 운임표", "desc": "구간과 컨테이너 종류별 운임과 유효기간을 적은 기준표입니다."}, {"name": "부대비용표", "desc": "서류비, 하역비 같은 추가 비용을 적은 기준표입니다."}, {"name": "견적서 양식", "desc": "고객에게 보낼 견적서의 틀입니다."}], "fields": ["구간(출발지~도착지)", "컨테이너 종류·수량", "품목", "희망 일정", "가격 조건(인코텀즈)", "중량"], "key": "구간 + 컨테이너 종류 + 운임 유효기간: 운임표에서 맞는 가격 한 줄을 찾는 기준입니다.", "check": "요청 내용으로 유효기간 안의 운임표에서 해당 구간 운임과 추가 비용을 찾아 견적 항목을 채웁니다.", "exceptions": ["메일에 화물 무게가 빠져 있어 고객에게 되물어야 함", "가장 맞는 운임표가 유효기간이 지난 지난달 것", "요청에 내륙 운송이 포함됐는데 해당 운임표가 없음"], "output": "항목마다 출처가 붙은 견적서 초안 + 누락 정보 질문 목록", "steps": [{"node": "Parse", "what": "요청 메일과 운임표, 비용표를 읽습니다"}, {"node": "Extract ×2", "what": "메일에서는 요청 항목을, 운임표에서는 구간별 가격과 유효기간을 뽑습니다"}, {"node": "Match", "what": "구간, 컨테이너 종류, 날짜로 맞는 운임 줄을 짝짓습니다"}, {"node": "Validate", "what": "운임이 유효기간 안인지, 필수 정보가 다 있는지 판정합니다"}, {"node": "Instruct", "what": "견적서 문장을 쓰고 빠진 정보에 대한 질문을 만듭니다"}, {"node": "Export ct ×3", "what": "서류별로 유엔번호, 등급, 포장 정보, 경로를 뽑습니다"}, {"node": "Merge", "what": "같은 화물 번호의 값을 한 표로 합칩니다"}, {"node": "Match", "what": "운송 방식과 경로로 운송사 서류 안내의 필요 서류 목록과 짝짓습니다"}, {"node": "Validate", "what": "서류끼리 값이 같은지, 필요 서류가 다 있는지 판정합니다"}, {"node": "Instruct", "what": "불일치 원인을 보고 보완 요청 문장을 씁니다"}, {"node": "Export", "what": "불일치·누락 목록과 판정을 저장합니다"}], "problem": "위험물 서류는 운송사나 항공사가 싣기 직전에 검사하기 때문에, 그 자리에서 불일치가 발견되면 화물이 통째로 내려지고 다음 편을 다시 예약해야 합니다. 그동안 보관료가 쌓이고, 규정 위반으로 기록되면 벌금이나 운송 거부 같은 불이익이 뒤따릅니다. 운송 방식과 경로마다 요구 서류가 달라서 담당자는 건마다 운송사 안내문을 다시 찾아 읽어야 합니다.", "why": "유엔번호와 등급이 서류끼리 같은지는 글자 비교라서 규칙으로 정확히 걸러 낼 수 있지만, 사람 눈은 숫자 한 자리 차이를 자주 놓칩니다. Studio는 화물 번호로 서류별 값을 한 행에 묶어(Merge) 다른 칸을 바로 드러내고, 운송 방식과 경로로 운송사 안내의 필요 서류 목록을 짝지어(Match) 빠진 서류를 자동으로 찾습니다. 운송사별 요구 서류 기준을 한 번 등록해 두면 다음 건부터는 같은 기준이 똑같이 적용됩니다.", "difficulty": "심화"}, {"uid": "U049", "i": 48, "no": 2, "pattern": "입력", "industry": "물류·운송", "dept": ["물류·SCM"], "task": "B/L, AWB, Invoice 수출입 서류를 포워딩 시스템에 자동 입력", "title": "수출입 서류 시스템에 옮겨 넣기", "oneliner": "선적 서류의 값을 회사 코드로 바꿔 자동 입력합니다", "story": "포워딩 회사(화물 운송을 대신 맡아 처리하는 회사)의 담당자는 고객 메일과 함께 온 수출입 서류를 보고 회사 시스템에 값을 입력합니다. 같은 항구도 서류마다 PUSAN, BUSAN, 부산처럼 다르게 적혀 있어 내부 코드로 바꾸는 데 시간이 걸리고 틀리기 쉽습니다. 같은 첨부 파일이 두 번 오거나 특이 조건이 메일 본문에만 적혀 있으면 놓치기도 합니다. 워크플로우는 서류에서 값을 뽑아 코드표와 맞추고, 원본과 다른 칸은 확인 필요로 표시해 줍니다.", "terms": [{"term": "포워딩", "desc": "화주 대신 배나 비행기를 잡고 서류를 처리해 화물 운송을 맡아 주는 일입니다. 여행사가 항공권과 숙소를 대신 잡아 주는 것과 비슷합니다."}, {"term": "B/L(선하증권)", "desc": "배에 짐을 실었다는 증명서입니다. 화물 주인이 누구인지도 적혀 있어 물건을 찾을 때 필요합니다."}, {"term": "AWB(항공화물 운송장)", "desc": "비행기로 보내는 화물의 운송장입니다. 택배 송장의 항공 버전입니다."}, {"term": "상업송장(Invoice)", "desc": "판 물건의 품목, 수량, 가격을 적은 거래 명세서입니다."}, {"term": "수하인", "desc": "화물을 받는 사람이나 회사입니다."}], "docs": [{"name": "고객 요청 메일", "desc": "고객이 보낸 요청 메일입니다. 특이 조건이 본문에만 있을 수 있습니다."}, {"name": "선하증권(B/L)", "desc": "배로 보내는 화물의 증명서입니다. 화주, 수하인, 항구를 봅니다."}, {"name": "항공화물 운송장(AWB)", "desc": "비행기로 보내는 화물의 운송장입니다. 출발·도착 공항과 중량을 봅니다."}, {"name": "상업송장(Invoice)", "desc": "품목, 수량, 금액을 적은 명세서입니다."}, {"name": "거래처·항구 코드표", "desc": "거래처와 항구 이름을 회사 코드로 바꾸는 엑셀 기준표입니다."}], "fields": ["화주(보내는 쪽)", "수하인(받는 쪽)", "출발 항구·도착 항구", "품목", "수량", "중량"], "key": "B/L 번호: 선적 한 건마다 붙는 번호로, 같은 건의 서류를 묶습니다.", "check": "서류에 적힌 거래처명과 항구명을 내부 코드표와 짝짓고, 입력값이 원본 서류와 같은지 대조합니다.", "exceptions": ["같은 항구가 서류마다 PUSAN, BUSAN, 부산으로 다르게 적힘", "같은 첨부 파일이 두 번 들어옴", "'냉장 보관 필요' 같은 조건이 메일 본문에만 적혀 있음"], "output": "선적 건별 코드 매핑된 입력값 + 확인 필요 칸 표시", "steps": [{"node": "Parse", "what": "메일과 첨부 서류를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "서류가 B/L, AWB, 인보이스 중 무엇인지 나눕니다"}, {"node": "Extract ×3", "what": "서류 종류별로 화주, 수하인, 항구, 품목, 수량, 중량을 뽑습니다"}, {"node": "Merge", "what": "같은 B/L 번호의 결과를 한 건으로 합칩니다"}, {"node": "Match", "what": "거래처명과 항구명을 코드표와 짝지어 내부 코드로 바꿉니다"}, {"node": "Validate", "what": "입력값이 원본과 같은지, 코드가 비어 있지 않은지 판정합니다"}, {"node": "Instruct", "what": "중복 파일이나 메일 본문의 특이 조건을 보고 확인 메모를 씁니다"}, {"node": "Export", "what": "입력값과 확인 필요 칸을 저장합니다"}], "problem": "선적 한 건마다 서류 서너 장에서 수십 개의 값을 골라 시스템 칸에 맞춰 넣어야 하고, 이 작업이 매일 반복됩니다. PDF와 입력 화면을 번갈아 보다 보면 수하인 코드를 옆 줄 것으로 넣거나 중량 단위를 빼먹기 쉽습니다. 잘못 들어간 코드는 이후 운송 지시와 청구서까지 그대로 이어져서 고치는 데 몇 배의 시간이 듭니다.", "why": "항구 이름을 코드로 바꾸는 일은 규칙으로 정해지지만, 메일 본문에만 적힌 특이 조건은 맥락을 읽어야 하는 일이라 성격이 다릅니다. Studio는 규칙 검사(Validate)와 맥락 판단(Instruct)을 나눠 두어, 코드가 비었는지는 기계적으로 걸러 내고 냉장 보관 같은 조건은 확인 메모로 사람에게 넘깁니다. 뽑은 값마다 원문의 어느 위치에서 가져왔는지 남기 때문에 담당자는 서류를 다시 뒤지지 않고 표시된 칸만 보면 됩니다.", "difficulty": "심화"}, {"uid": "U050", "i": 49, "no": 6, "pattern": "생성", "industry": "물류·운송", "dept": ["물류·SCM"], "task": "수출 선적 건의 서류 세트를 바이어 요건에 맞게 작성하고 검토한다", "title": "바이어 맞춤 수출 서류 만들기", "oneliner": "주문 정보로 수출 서류를 만들고 요건 누락을 찾습니다", "story": "수출 회사의 물류 담당자는 물건을 보낼 때마다 송장, 포장명세서, 선적 요청서를 새로 작성합니다. 해외 구매자(바이어)마다 서류에 꼭 넣어야 하는 문구가 달라서, 발주 번호나 원산지 문구를 빠뜨리기 쉽습니다. 서류 세 장에 같은 값을 손으로 옮기다 보면 서류끼리 숫자가 어긋나기도 합니다. 워크플로우는 주문과 출하 정보로 서류 초안을 같은 값으로 채우고, 바이어 요건 가이드와 비교해 빠진 항목을 알려 줍니다.", "terms": [{"term": "바이어", "desc": "물건을 사는 해외 고객입니다."}, {"term": "가격 조건(인코텀즈)", "desc": "운송비와 위험을 어디까지 누가 부담하는지 정한 국제 약속입니다. FOB, CIF 같은 약자로 씁니다."}, {"term": "원산지 문구", "desc": "'Made in Korea'처럼 물건을 만든 나라를 밝히는 문장입니다."}, {"term": "카톤 마크", "desc": "상자 겉면에 적는 표시입니다. 받는 곳, 상자 번호 등을 적습니다."}, {"term": "선적 요청서", "desc": "배나 비행기에 짐을 실어 달라고 운송 회사에 보내는 요청서입니다."}], "docs": [{"name": "바이어 발주서(PO)", "desc": "바이어가 주문한 품목, 수량, 단가를 봅니다."}, {"name": "출하 정보", "desc": "실제로 보낼 수량, 포장 방식, 무게를 봅니다."}, {"name": "바이어 서류 요건 가이드", "desc": "바이어가 서류에 꼭 넣으라고 요구한 항목을 봅니다."}, {"name": "상업송장 초안", "desc": "작성할 거래 명세서입니다."}, {"name": "포장명세서 초안", "desc": "작성할 상자별 내용물 목록입니다."}, {"name": "선적 요청서", "desc": "운송 회사에 보낼 선적 요청 서류입니다."}], "fields": ["발주 번호", "품명", "수량", "단가·금액", "가격 조건", "원산지 문구"], "key": "발주(PO) 번호: 한 주문을 가리키는 번호로, 서류 세트 전체를 묶습니다.", "check": "작성한 서류 세트를 바이어 요건과 비교해 빠진 기재 사항이 있는지, 서류끼리 값이 같은지 확인합니다.", "exceptions": ["송장에 바이어가 요구한 발주 번호가 빠짐", "원산지 문구를 'Made in Korea'가 아닌 'Korea'로만 적음", "바이어가 요구한 카톤 마크를 확인하지 않음"], "output": "같은 값으로 채운 서류 세트 초안 + 요건 누락 목록", "steps": [{"node": "Parse", "what": "발주서, 출하 정보, 요건 가이드를 읽습니다"}, {"node": "Classify", "what": "자료가 주문, 출하 정보, 요건 가이드 중 무엇인지 나눕니다"}, {"node": "Extract ×3", "what": "주문 값, 출하 값, 바이어 필수 요건을 각각 뽑습니다"}, {"node": "Merge", "what": "뽑은 값을 한 선적 건 정보로 합칩니다"}, {"node": "Match", "what": "발주 번호로 해당 바이어의 요건 가이드와 짝짓습니다"}, {"node": "Validate", "what": "서류 초안에 필수 요건이 다 있는지, 값이 서로 같은지 판정합니다"}, {"node": "Instruct", "what": "합친 값으로 서류 초안 문장을 채우고 누락 항목 설명을 씁니다"}, {"node": "Export", "what": "서류 세트 초안과 누락 목록을 저장합니다"}], "problem": "바이어별 요구 사항은 예전 메일이나 담당자의 기억에 흩어져 있어서, 담당자가 바뀌거나 자리를 비우면 무엇을 확인해야 하는지부터 찾아야 합니다. 요건이 빠진 서류는 바이어 쪽 세관을 통과하지 못해 화물이 항구에 묶이고, 그동안 보관료가 쌓입니다. 서류를 다시 만들어 원본을 국제 우편으로 보내면 며칠이 더 걸립니다.", "why": "서류 초안을 쓰는 일과 바이어 요건을 빠짐없이 확인하는 일은 성격이 달라서, 챗봇에 한 번에 시키면 문장은 그럴듯해도 어떤 요건을 확인했는지 알 수 없습니다. Studio는 발주 번호로 해당 바이어의 요건 가이드를 짝짓고(Match), 요건이 다 들어갔는지는 Validate가 규칙으로 판정하며, 서류 문장 채우기만 Instruct가 맡습니다. 바이어별 요건을 한 번 정리해 두면 같은 바이어의 다음 주문에도 같은 기준이 그대로 적용됩니다.", "difficulty": "심화"}, {"uid": "U051", "i": 50, "no": 13, "pattern": "생성", "industry": "물류·운송", "dept": ["고객지원", "물류·SCM"], "task": "화물 사고 클레임 서류를 모아 보험 청구 패키지를 만든다", "title": "화물 사고 보험 청구 서류 묶기", "oneliner": "사고 서류를 대조해 보험 청구 패키지를 만듭니다", "story": "물류 회사의 고객지원 담당자는 운송 중 화물이 파손되면 여러 서류를 모아 보험사에 청구합니다. 서류가 여섯 가지나 되고, 사진 속 상자 수와 피해 수량표가 다르거나 전체 금액을 피해액으로 잘못 적는 실수가 생깁니다. 서류가 하나라도 빠지면 청구가 늦어집니다. 워크플로우는 서류별 화물 정보와 피해 수량을 대조하고, 빠진 서류를 알려 주며 청구서 초안을 써 줍니다.", "terms": [{"term": "클레임", "desc": "손해를 입었으니 보상해 달라고 요구하는 일입니다."}, {"term": "적하보험증권", "desc": "운송 중인 화물에 들어 둔 보험의 증서입니다."}, {"term": "B/L(선하증권)", "desc": "배에 짐을 실었다는 증명서입니다. 화물 주인이 누구인지도 적혀 있어 물건을 찾을 때 필요합니다."}, {"term": "화물 인수증", "desc": "물건을 받은 쪽이 받았다고 서명한 확인서입니다. 받을 때 상태 메모도 적습니다."}], "docs": [{"name": "사고 접수 기록", "desc": "사고 날짜와 경위를 봅니다."}, {"name": "적하보험증권", "desc": "보험이 걸린 화물과 보험 금액을 봅니다."}, {"name": "선하증권(B/L)", "desc": "운송 건 번호와 전체 수량을 봅니다."}, {"name": "상업송장", "desc": "화물 금액을 봅니다."}, {"name": "포장명세서", "desc": "상자별 내용물과 수량을 봅니다."}, {"name": "인수증·피해 수량표·사고 사진", "desc": "받을 때의 상태 메모, 피해 수량, 파손 모습을 봅니다."}], "fields": ["운송 건 번호", "사고 날짜·경위", "품목", "전체 수량", "피해 수량", "화물 금액"], "key": "B/L 번호: 운송 한 건을 가리키는 번호로, 사고 관련 서류를 묶습니다.", "check": "서류마다 적힌 화물 정보와 피해 수량을 비교하고, 보험 청구에 꼭 필요한 서류가 다 있는지 확인합니다.", "exceptions": ["사진에는 파손 상자가 4개인데 피해 수량표에는 6개", "전체 화물 금액을 피해액으로 잘못 적음", "인수증 메모는 '외관 양호'인데 사고 경위는 '도착 시 파손'"], "output": "누락 서류·수량 차이 목록 + 청구서 초안과 증빙 목록", "steps": [{"node": "Parse", "what": "사고 기록, 보험증권, 선적 서류, 사진을 읽습니다"}, {"node": "Classify", "what": "자료가 사고 기록, 보험, 선적 서류, 인수·피해 자료 중 무엇인지 나눕니다"}, {"node": "Extract ×4", "what": "자료 묶음마다 운송 건 번호, 수량, 피해 수량, 금액을 뽑습니다"}, {"node": "Merge", "what": "같은 운송 건의 값을 하나로 합칩니다"}, {"node": "Validate", "what": "피해 수량과 금액이 서류끼리 맞는지, 필수 서류가 다 있는지 판정합니다"}, {"node": "Instruct", "what": "사고 경위를 정리해 보험 청구서 초안을 씁니다"}, {"node": "Export", "what": "청구서 초안, 증빙 목록, 누락 목록을 저장합니다"}], "problem": "보험 청구는 사고 뒤 정해진 기간 안에 서류를 갖춰 내야 하는데, 서류가 운송사, 고객, 창고 등 여러 곳에 흩어져 있어 메일로 하나씩 받아 모으는 데 시간이 갑니다. 피해 수량이나 금액이 서류마다 다르면 보험사가 보완을 요구해 처리가 다시 미뤄지고, 기한을 넘기면 보상을 받지 못해 회사가 손해를 떠안습니다. 그 사이 고객은 배상을 재촉하고 담당자는 진행 상황을 설명하느라 다른 일을 못 합니다.", "why": "청구서 초안을 쓰는 일과 증빙이 다 있는지 세는 일은 함께 시키면 섞이기 쉬운데, Stu  "금액·가격 조건", "보험 금액(부보 금액)", "배 이름·출항일"], "key": "주문 번호 + 선적 건 번호: 한 선적의 서류 6종을 묶는 값입니다.", "check": "LOT는 포장명세서와 성적서, 품명과 수량은 송장과 원산지증명서, 보험 금액은 보험증서와 송장, 배와 출항일은 선적 요청서와 B/L끼리 비교합니다.", "exceptions": ["포장명세서의 LOT는 A2405, 성적서의 LOT는 A2406", "주문을 나눈 뒤에도 서류에 취소된 옛 주문 번호가 남음", "늦게 오는 원산지증명서가 빠졌고, 결제 방식에 따라 필요한 서류가 다름"], "output": "서류 누락·항목 차이 점검표 + 자금팀 전달/수정/재발급 요청 판정", "steps": [{"node": "Parse", "what": "서류 6종을 글자와 표로 읽습니다"}, {"node": "Classify", "what": "서류가 송장, 포장명세서, 선적 요청서, 성적서, 원산지증명서, 보험증서 중 무엇인지 나눕니다"}, {"node": "Extract ×6", "what": "서류마다 주문 번호, LOT, 품명, 수량, 금액, 배 정보를 뽑습니다"}, {"node": "Merge", "what": "같은 선적 건의 값을 한 점검표로 합칩니다"}, {"node": "Validate", "what": "정해진 서류 짝끼리 값이 같은지, 빠진 서류가 있는지 판정합니다"}, {"node": "Instruct", "what": "결제 방식에 맞는 필요 서류를 따져 전달할지 수정할지 의견을 씁니다"}, {"node": "Export", "what": "점검표와 판정을 저장합니다"}], "problem": "서류 6종은 도착하는 시점이 제각각이라 담당자는 같은 선적 건을 여러 번 다시 열어 그때까지 온 서류만 확인하고, 마지막에 무엇을 봤는지 기억에 의존하게 됩니다. 어느 서류끼리 어떤 항목을 맞춰야 하는지는 경험으로 아는 것이라 새 담당자는 짝을 잘못 짚기 쉽습니다. 틀린 세트가 자금팀으로 넘어가면 은행 제출이나 대금 회수가 늦어지고, 원본 서류를 다시 발급받아 보내는 데 며칠이 더 걸립니다.", "why": "어느 서류끼리 어떤 항목을 비교하는지가 이 업무의 기준인데, Studio는 그 짝 규칙을 Validate에 한 번 정해 두면 선적 건이 들어올 때마다 똑같이 적용하므로 담당자의 기억에 기대지 않습니다. 6종에서 뽑은 값을 주문 번호와 선적 건 번호로 한 점검표에 묶어(Merge) 아직 오지 않은 서류는 빈칸으로, 다른 값은 차이로 드러납니다. 결제 방식에 따라 필요한 서류가 달라지는 판단은 Instruct가 따로 맡아 규칙 검사 결과와 섞이지 않고, 자금팀에 넘길지 수정할지 의견을 씁니다.", "difficulty": "심화"}, {"uid": "U055", "i": 54, "no": 67, "pattern": "검증", "industry": "무역", "dept": ["물류·SCM", "재무·회계"], "task": "신용장 조건과 선적서류가 일치하는지 검토한다", "title": "신용장 조건과 선적 서류 대조", "oneliner": "신용장 조건을 선적 서류와 한 줄씩 맞춰 봅니다", "story": "무역 회사의 담당자는 신용장으로 대금을 받기 전에, 은행에 낼 선적 서류가 신용장 조건과 정확히 맞는지 검토합니다. 은행은 철자 하나, 날짜 하루만 달라도 하자로 보고 대금 지급을 미룰 수 있습니다. 조건이 길고 서류가 여섯 가지라 사람이 한 줄씩 확인하다 놓치기 쉽습니다. 워크플로우는 신용장 조건을 점검 항목으로 나누고, 서류 값과 대조해 일치와 하자를 체크리스트로 만들어 줍니다.", "terms": [{"term": "신용장(L/C)", "desc": "은행이 '조건에 맞는 서류를 내면 대금을 대신 지급하겠다'고 약속하는 문서입니다. 사는 쪽과 파는 쪽이 서로 믿지 못할 때 은행이 중간에 서는 방식입니다."}, {"term": "MT700", "desc": "은행끼리 신용장을 주고받을 때 쓰는 표준 전문 양식 이름입니다."}, {"term": "하자", "desc": "서류가 신용장 조건과 맞지 않는 부분입니다. 하자가 있으면 은행이 지급을 거절하거나 미룰 수 있습니다."}, {"term": "선적기일·유효기일", "desc": "선적기일은 늦어도 이날까지 배에 실어야 하는 날, 유효기일은 신용장 자체가 효력을 잃는 날입니다."}, {"term": "본선 적재일", "desc": "화물이 실제로 배에 실린 날입니다."}], "docs": [{"name": "신용장(L/C, MT700)", "desc": "금액, 기한, 품명 문구, 요구 서류와 통수를 봅니다."}, {"name": "상업송장", "desc": "금액과 품명 표기를 봅니다."}, {"name": "포장명세서", "desc": "수량과 포장 내용을 봅니다."}, {"name": "선하증권(B/L)", "desc": "배에 실린 날짜를 봅니다."}, {"name": "보험증권", "desc": "보험 금액과 조건을 봅니다."}, {"name": "원산지증명서", "desc": "물건을 만든 나라와 품명을 봅니다."}], "fields": ["신용장 번호", "금액", "선적기일·유효기일", "품명 표기", "요구 서류·통수(장 수)", "본선 적재일"], "key": "신용장 번호: 한 신용장 거래의 서류를 묶는 번호입니다.", "check": "신용장 조건을 항목별로 나눠 선적 서류의 값과 하나씩 비교해 하자가 있는지 판정합니다.", "exceptions": ["본선 적재일이 선적기일보다 하루 늦음", "품명 철자가 신용장 문구와 한 글자 다름", "원본 3통을 요구했는데 2통만 있음"], "output": "조건별 일치/하자 체크리스트 + 제출/수정/조건 변경 요청 판정", "steps": [{"node": "Parse", "what": "신용장과 선적 서류를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "서류가 신용장, 송장, 포장명세서, B/L, 보험, 원산지 중 무엇인지 나눕니다"}, {"node": "Extract ×4", "what": "신용장 조건과 서류별 금액, 날짜, 품명, 통수를 뽑습니다"}, {"node": "Merge", "what": "같은 신용장 번호의 값을 한 체크리스트로 합칩니다"}, {"node": "Validate", "what": "조건 항목마다 서류 값이 맞는지 일치·하자로 판정합니다"}, {"node": "Instruct", "what": "하자를 보고 서류를 고칠지 조건 변경을 요청할지 의견을 씁니다"}, {"node": "Export", "what": "체크리스트와 판정을 저장합니다"}], "problem": "신용장 조건은 은행끼리 주고받는 표준 양식에 영문 약어로 빽빽하게 적혀 있어 읽는 것 자체에 시간이 걸리고, 서류를 내야 하는 기한은 선적 뒤 짧게 정해져 있어 여유가 없습니다. 하자가 잡히면 은행이 수수료를 떼고 지급을 몇 주 미루며, 그 사이 구매자가 가격을 다시 흥정하는 빌미로 삼기도 합니다. 서류 여섯 장을 사람이 교차 확인하다 보면 앞 장에서 확인한 조건을 뒷 장에서 빠뜨리기 쉽습니다.", "why": "은행 심사는 글자 그대로 일치하는지를 보기 때문에, 뜻이 통하면 넘어가 주는 챗봇의 방식과는 맞지 않습니다. Studio는 신용장 조건을 항목별로 나눠 서류 값과 하나씩 규칙으로 대조(Validate)하고, 어떤 서류의 어느 위치에서 가져온 값인지 남겨 두어 담당자가 하자 항목만 원문에서 바로 확인할 수 있습니다. 서류를 고칠지 신용장 조건 변경을 요청할지 같은 판단은 Instruct가 따로 맡아 규칙 검사 결과와 섞이지 않습니다.", "difficulty": "심화"}, {"uid": "U056", "i": 55, "no": 69, "pattern": "검증", "industry": "무역", "dept": ["물류·SCM", "법무·준법"], "task": "원산지 증명과 FTA 서류를 검증한다", "title": "원산지 증명 서류 근거 점검", "oneliner": "원산지증명서가 송장, 확인서와 맞는지 검증합니다", "story": "무역 회사의 담당자는 FTA로 관세 혜택을 받기 위해 원산지증명서가 송장과 공급사 확인서와 맞는지 검토합니다. 증명서의 송장 번호가 이번 선적과 다르거나 HS 코드가 서류마다 다르면 혜택이 취소되고 세금을 다시 낼 수 있습니다. 원산지 판정 근거 자료가 빠져도 나중에 세관 조사에서 문제가 됩니다. 워크플로우는 서류별 값을 대조하고 증빙이 갖춰졌는지 확인해 특혜를 적용할지 판정해 줍니다.", "terms": [{"term": "FTA(자유무역협정)", "desc": "나라끼리 서로 관세를 낮추거나 없애기로 한 약속입니다. 그 나라에서 만든 물건이라는 증명이 있어야 혜택을 받습니다."}, {"term": "원산지증명서", "desc": "물건을 어느 나라에서 만들었는지 증명하는 서류입니다."}, {"term": "HS 코드", "desc": "세계 공통으로 쓰는 상품 분류 번호입니다. 이 번호에 따라 관세율이 정해집니다."}, {"term": "원산지 기준", "desc": "어느 정도를 그 나라에서 만들어야 그 나라 물건으로 인정하는지 정한 규칙입니다."}, {"term": "송품장", "desc": "상업송장과 같은 말로, 판 물건과 금액을 적은 명세서입니다."}], "docs": [{"name": "원산지증명서", "desc": "품명, HS 코드, 수량, 송품장 번호, 적용 협정을 봅니다."}, {"name": "상업송장", "desc": "이번 선적의 송품장 번호, 품명, 수량을 봅니다."}, {"name": "포장명세서", "desc": "수량과 포장 내용을 봅니다."}, {"name": "공급사 원산지확인서", "desc": "원재료를 공급한 회사가 원산지를 확인해 준 서류입니다. 판정 근거로 씁니다."}, {"name": "수입신고필증", "desc": "세관에 신고된 품명과 HS 코드를 봅니다."}], "fields": ["송품장 번호", "품명", "HS 코드(상품 분류 번호)", "수량", "적용 협정", "원산지 기준"], "key": "송품장 번호: 선적 한 건을 가리키는 번호로, 원산지 서류와 송장을 연결합니다.", "check": "원산지증명서의 품명, HS 코드, 수량, 송품장 번호를 송장과 원산지확인서와 비교하고, 판정 근거 증빙이 있는지 확인합니다.", "exceptions": ["증명서의 송품장 번호가 지난 선적 번호로 적힘", "증명서와 신고필증의 HS 코드 끝자리가 다름", "공급사 원산지확인서가 빠져 판정 근거가 없음"], "output": "선적별 불일치·증빙 누락 목록 + 특혜 적용/보완 요청/미적용 사유", "steps": [{"node": "Parse", "what": "원산지 서류와 송장, 신고필증을 읽습니다"}, {"node": "Classify", "what": "서류가 원산지 서류, 선적 서류, 신고 서류 중 무엇인지 나눕니다"}, {"node": "Extract ×3", "what": "서류별로 송품장 번호, 품명, HS 코드, 수량, 협정을 뽑습니다"}, {"node": "Merge", "what": "같은 송품장 번호의 값을 한 표로 합칩니다"}, {"node": "Match", "what": "품목별로 공급사 원산지확인서와 짝지어 근거를 연결합니다"}, {"node": "Validate", "what": "값이 서류끼리 같은지, 근거 증빙이 있는지 판정합니다"}, {"node": "Instruct", "what": "특혜를 적용할지, 보완을 요청할지, 적용하지 않을지 사유를 씁니다"}, {"node": "Export", "what": "불일치·누락 목록과 판정을 저장합니다"}], "problem": "세관의 원산지 검증(정말 그 나라에서 만들었는지 나중에 확인하는 조사)은 수출입이 끝나고 몇 년 뒤에 올 수 있어서, 당시 서류가 서로 맞고 근거가 남아 있어야 합니다. 검증에서 근거를 대지 못하면 그동안 감면받은 관세를 가산세(늦게 낸 데 대한 추가 세금)와 함께 한꺼번에 내야 하고, 같은 품목을 name": "P&ID 도면(여러 장)", "desc": "기기 기호, 태그 번호, 배관 크기, 라인 번호를 봅니다."}, {"name": "도면 범례", "desc": "기호가 어떤 밸브나 계기인지 확인합니다."}, {"name": "밸브·계장기기 목록(기존)", "desc": "이미 정리된 기기 목록입니다. 새로 뽑은 값과 비교합니다."}], "fields": ["도면 번호와 개정", "기기 태그 번호", "기호 종류(밸브·계기)", "배관 크기", "연결된 라인 번호"], "key": "기기 태그 번호: 도면 속 기호와 기존 기기 목록의 한 줄을 잇는 번호", "check": "도면에서 뽑은 태그와 연결 정보를 기존 기기 목록과 비교해 빠졌거나 잘못 적힌 것을 판정합니다.", "exceptions": ["배관이 1번 도면에서 3번 도면으로 이어져 연결 정보가 나뉨", "태그 번호는 있는데 어느 라인에 붙었는지 표시가 없음", "도면은 FV-1021인데 목록은 FV-1012로 숫자 순서가 바뀜"], "output": "밸브·계장기기 목록과 누락·불일치 항목", "steps": [{"node": "Parse", "what": "여러 장의 P&ID 도면과 범례, 기존 목록을 읽습니다"}, {"node": "Extract", "what": "도면에서 태그 번호, 기호 종류, 배관 크기, 라인 번호를 뽑습니다"}, {"node": "Match", "what": "태그 번호로 도면 기기와 기존 목록의 항목을 짝지어 줍니다"}, {"node": "Validate", "what": "일치하면 초록, 연결 정보가 빠지면 노랑, 목록에 없거나 번호가 다르면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "도면 장을 넘는 연결을 이어 해석하고 비슷한 번호 오기 가능성을 적습니다"}, {"node": "Export", "what": "정리된 기기 목록과 불일치 항목을 저장합니다"}], "problem": "플랜트 하나의 P&ID는 수백 장에 이르고 한 장에 밸브와 계기가 수십 개씩 그려져 있어, 기기 목록 하나를 만드는 데 엔지니어 여러 명이 몇 주를 씁니다. 도면이 개정될 때마다 바뀐 기기를 찾아 목록을 다시 고쳐야 하므로 같은 작업이 설계 기간 내내 반복됩니다. 목록에서 빠진 밸브는 구매에서도 빠져 현장 설치 때 발견되고, 태그 번호가 틀리면 설비를 가동하는 중에 엉뚱한 기기를 조작하는 사고로 이어질 수 있습니다.", "why": "이 업무는 수백 장의 도면에서 뽑은 태그를 기존 목록과 하나씩 견주는 일이므로, 태그 번호라는 같은 키로 도면과 목록을 한 행에 묶는(Match) 구조가 필요합니다. 그러면 도면에만 있는 기기와 목록에만 있는 기기가 빈칸으로 바로 드러납니다. 또 뽑은 태그마다 어느 도면 몇 장의 어느 위치에서 읽었는지 남기 때문에, 번호 순서가 바뀐 것처럼 보이는 건은 엔지니어가 그 자리를 바로 펼쳐 확인할 수 있습니다.", "difficulty": "입문"}, {"uid": "U061", "i": 60, "no": 213, "pattern": "입력", "industry": "제조·건설", "dept": ["영업·영업지원"], "task": "ERP 판매현황표로 창고·일자·품목별 일일 매출 보고를 만든다", "title": "창고별 판매표로 일일 매출 보고", "oneliner": "창고별 판매표를 합쳐 하루 매출 보고를 만듭니다", "story": "제조 회사의 영업지원 담당자는 매일 아침 ERP(회사의 판매·재고 관리 시스템)에서 창고별 판매현황표를 내려받아 날짜, 품목별 매출을 합친 보고서를 만듭니다. 표를 손으로 합치다 보면 한 줄을 빠뜨리거나 표 맨 아래 합계 줄까지 더하는 실수, 부가세가 섞인 금액을 공급가로 적는 실수가 생깁니다. 워크플로우는 판매표에서 값을 뽑아 합계를 다시 계산해 검증하고, 일일 매출 보고 문장까지 만들어 줍니다.", "terms": [{"term": "ERP", "desc": "회사의 판매, 구매, 재고, 회계 정보를 한곳에서 관리하는 업무 시스템입니다."}, {"term": "공급가", "desc": "부가세를 뺀 물건 값입니다."}, {"term": "부가세", "desc": "물건값에 붙는 세금으로, 보통 공급가의 10%입니다."}, {"term": "거래처", "desc": "물건을 사 가거나 팔아 주는 상대 회사입니다."}], "docs": [{"name": "ERP 판매현황표(창고별)", "desc": "창고별 일자, 거래처, 품목, 수량, 공급가, 부가세를 봅니다."}, {"name": "전일 일일 매출 보고서", "desc": "어제 보고서 양식과 숫자를 봅니다. 형식을 맞추고 변화를 비교하는 데 씁니다."}], "fields": ["일자", "창고", "거래처", "품목", "수량과 단가", "공급가와 부가세"], "key": "일자, 창고, 품목: 여러 창고 표를 같은 기준으로 모아 합치는 값", "check": "일자와 품목별 합계가 원래 판매 줄들의 합과 같은지, 공급가와 부가세가 섞이지 않았는지 검증합니다.", "exceptions": ["공급가 칸에 부가세를 더한 11,000원이 들어감", "표 맨 아래 '합계' 줄까지 판매 건으로 더해짐", "창고 세 곳 표를 합칠 때 두 번째 창고의 마지막 줄이 빠짐"], "output": "일자·품목별 매출 합계와 주요 거래처 요약 보고", "steps": [{"node": "Parse", "what": "창고별 판매현황표와 전일 보고서를 표로 읽습니다"}, {"node": "Extract", "what": "판매 줄마다 일자, 창고, 거래처, 품목, 수량, 공급가, 부가세를 뽑습니다"}, {"node": "Validate", "what": "합계가 맞으면 초록, 합계 줄 의심이면 노랑, 공급가·부가세 혼동이나 줄 누락이면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "검증된 합계로 품목별 매출과 주요 거래처 내용을 보고 문장으로 씁니다"}, {"node": "Export", "what": "일일 매출 보고서를 저장합니다"}], "problem": "이 보고서는 매일 아침 정해진 시간까지 내야 하므로 담당자는 출근 직후 수십 분을 표 합치기에 씁니다. 창고가 여러 곳이면 내려받는 표도 그만큼 많고, 같은 작업을 매일 반복하니 어제 한 실수를 오늘 또 하기 쉽습니다. 매출 숫자가 틀린 채 경영진에게 보고되면 재고 발주나 영업 목표 같은 결정이 잘못된 숫자 위에서 내려집니다.", "why": "이 업무는 매일 같은 양식의 표가 들어오므로, 한 번 정한 추출 항목과 검증 규칙을 날마다 똑같이 적용하는 Studio의 방식이 잘 맞습니다. 사람이 하던 합계 줄을 빼고 더하기, 공급가와 부가세 구분하기가 규칙 검사(Validate)로 고정되어 어제와 오늘의 판정 기준이 달라지지 않습니다. 합계 검증과 보고 문장 작성이 노드로 나뉘어 있어, 숫자가 틀렸을 때 읽기 단계인지 계산 단계인지 바로 찾을 수 있습니다.", "difficulty": "입문"}, {"uid": "U062", "i": 61, "no": 312, "pattern": "입력", "industry": "제조·건설", "dept": [], "task": "지난 공사일지의 계획 수량과 진행률, 계획 대비 실행률을 현장별 기록으로 옮기기 전에 원문과 맞춘다", "title": "공사일지 진행률 옮기기 전 확인", "oneliner": "공사일지 수치를 원문과 대조해 정확히 옮깁니다", "story": "건설 회사의 공무 담당자는 지난 공사일지에 적힌 공정 차수별 계획 수량과 진행률을 현장별 기록표로 옮깁니다. 일지가 여러 쪽이고 표 칸이 비슷해서 한 차수의 진행률이 옆 칸에 들어가거나, 진행률이 지난번보다 줄어드는 이상한 값이 그대로 옮겨지기 쉽습니다. 워크플로우는 일지에서 값을 뽑아 기록표와 이전 일지와 맞춰 보고, 원문을 다시 봐야 할 값을 위치와 함께 알려 줍니다.", "terms": [{"term": "공사일지", "desc": "공사 현장에서 날마다 한 일과 진행 상황을 적는 기록입니다."}, {"term": "공정 차수", "desc": "공사를 단계별로 나눈 순번입니다. 1차 기초, 2차 골조처럼 나눕니다."}, {"term": "진행률", "desc": "해야 할 일 중 지금까지 끝낸 비율입니다."}, {"term": "계획 대비 실행률", "desc": "원래 계획한 양에 비해 실제로 얼마나 했는지 나타낸 비율입니다."}], "docs": [{"name": "공사일지(현장별, 여러 쪽)", "desc": "현장, 작성일, 차수별 계획 수량과 진행률, 완료 예정일을 봅니다."}, {"name": "현장별 공정 기록표", "desc": "값을 옮겨 넣을 기록표입니다. 이미 들어간 값을 봅니다."}, {"name": "이전 공사일지", "desc": "지난번 진행률과 완료 예정일을 봅니다."}], "fields": ["현장명", "작성일", "공정 차수", "계획 수량", "진행률", "완료 예정일과 계획 대비 실행률"], "key": "현장명과 공정 차수: 일지와 기록표에서 같은 공사 단계를 잇는 값", "check": "일지의 차수별 계획 수량과 진행률을 현장별 기록표, 이전 일지와 원문 위치 기준으로 비교합니다.", "exceptions": ["2차 진행률 45%가 3차 칸에 들어감", "완료 예정일이 이전 일지의 6월 말에서 설명 없이 5월 말로 바뀜", "진행률이 지난 일지 60%에서 55%로 줄어듦"], "output": "현장·차수별 확정값과 원문 재확인이 필요한 목록", "steps": [{"node": "Parse", "what": "여러 쪽의 공사일지와 기록표, 이전 일지를 표로 읽습니다"}, {"node": "Extract", "what": "현장, 차수별 계획 수량, 진행률, 완료 예정일과 원문 위치를 뽑습니다"}, {"node": "Match", "what": "현장명과 차수로 일지 값과 기록표, 이전 일지 값을 짝지어 줍니다"}, {"node": "Validate", "what": "흐름이 자연스러우면 초록, 예정일이 바뀌면 노랑, 칸 밀림이나 진행률 감소면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "재확인이 필요한 값마다 원문 쪽수와 이유를 적습니다"}, {"node": "Export", "what": "확정값과 재확인 목록을 저장합니다"}], "problem": "현장이 여러 곳이면 매주 모아야 할 일지도 현장 수만큼 늘고, 일지 한 부가 수십 쪽이라 담당자는 옮겨 적는 데만 반나절을 씁니다. 옮긴 값이 맞는지 다시 확인하려면 일지를 처음부터 다시 넘겨야 해서 사실상 검토 없이 넘어가는 경우가 많습니다. 틀린 진행률은 발주처 보고와 기성 청구(공사한 만큼 대금을 청구하는 일)의 근거가 되므로, 나중에 발견되면 보고서를 다시 내고 청구 금액을 정정하는 일이 뒤따릅니다.", "why": "이 업무에서 가장 필요한 것은 옮긴 값이 원문 어디에서 왔는지 바로 되짚는 일인데, Studio는 뽑은 값마다 일지의 몇 쪽 어느 칸에서 읽었는지 위치를 남기므로 검토자가 의심되는 값만 골라 원문을 펼쳐 볼 수 있습니다. 현장명과 공정 차수라는 같은 키로 일지, 기록표, 이전 일지를 한 행에 묶으면(Match) 칸이 밀린 값이나 지난번보다 줄어든 진행률이 다른 값으로 바로 드러납니다. 진행률이 줄면 빨강으로 표시하는 식의 규칙은 한 번 정해 두면 매주 똑같이 적용됩니다.", "difficulty": "입문"}, {"uid": "U063", "i": 62, "no": 39, "pattern": "생성", "industry": "제조·건설", "dept": [], "task": "가공, 조립 도면을 보고 공정도와 자주검사 성적서를 만든다", "title": "도면 보고 검사 양식 채우기", "oneliner": "도면의 치수·공차로 공정도와 검사표 초안을 만듭니다", "story": "제조 회사의 생산 기술 담당자는 새 부품 도면을 받으면 어떤 순서로 깎고 조립할지 적은 공정도와, 작업자가 직접 재 볼 항목을 적은 자주검사 성적서를 만듭니다. 도면 곳곳에 흩어진 치수와 공차를 하나씩 옮겨 적다 보면 빠뜨리거나 숫자를 잘못 옮기기 쉽습니다. 워크플로우는 도면에서 치수, 공차, 재질을 뽑아 공정 순서와 검사 항목으로 정리한 초안을 만들어 줍니다.", "terms": [{"term": "공정도", "desc": "부품을 만들 때 자르기, 깎기, 조립하기 같은 작업을 어떤 순서로 하는지 정리한 표입니다."}, {"term": "자주검사 성적서", "desc": "작업자가 스스로 만든 제품을 재 보고 결과를 적는 검사 기록지입니다."}, {"term": "치수 공차", "desc": "치수가 설계값에서 얼마까지 벗어나도 되는지 정한 허용 범위입니다."}, {"term": "품번", "desc": "부품마다 붙이는 고유 번호입니다. 상품의 바코드 번호처럼 부품을 구분합니다."}], "docs": [{"name": "가공·조립 도면", "desc": "부품의 모양과 치수가 그려진 그림입니다. 치수, 공차, 재질, 품번을 봅니다."}, {"name": "공정도 양식", "desc": "채워 넣을 빈 양식입니다. 어떤 칸에 공정 순서를 적는지 봅니다."}, {"name": "자주검사 성적서 양식", "desc": "채워 넣을 빈 검사표입니다. 검사 항목과 기준값을 적을 칸을 봅니다."}], "fields": ["품번", "재질", "치수와 공차", "가공 공정", "검사 항목"], "key": "품번: 도면과 만들어질 공정도·성적서를 같은 부품으로 잇는 번호", "check": "도면에서 읽은 치수와 공차가 빠짐없이 검사 항목과 공정 순서로 옮겨졌는지 확인합니다.", "exceptions": ["주요 치수 일부가 도면 표 안이 아니라 그림 옆에 따로 적혀 있음", "구멍 지름에 공차 표기가 없어 기준을 정할 수 없음", "개정 도면과 예전 도면이 함께 들어와 치수가 서로 다름"], "output": "품번별 공정도와 자주검사 성적서에 들어갈 초안 값", "steps": [{"node": "Parse", "what": "도면을 글자, 표, 숫자로 읽습니다"}, {"node": "Extract", "what": "품번, 재질, 치수, 공차를 뽑습니다"}, {"node": "Instruct", "what": "뽑은 값으로 가공 순서와 검사 항목을 정하고, 공차가 없는 치수는 확인 필요로 표시합니다"}, {"node": "Export", "what": "공정도와 성적서 양식에 맞춘 초안 값을 저장합니다"}], "problem": "부품 하나의 도면에도 치수가 수십 개 들어 있고, 새 부품이 들어올 때마다 공정도와 자주검사 성적서 두 가지 양식을 처음부터 다시 채워야 합니다. 옮겨 적기는 단순 작업이지만 숙련된 기술 담당자의 시간을 그대로 잡아먹습니다. 성적서에서 치수 하나가 빠지면 작업자가 그 항목을 재지 않은 채 다음 공정으로 넘어가고, 불량은 조립 단계에서야 발견됩니다.", "why": "도면을 읽어 값을 뽑는 일과, 그 값을 어떤 순서로 가공하고 무엇을 검사할지 정하는 일은 성격이 다릅니다. Studio는 추출(Extract)과 판단(Instruct)을 노드로 나누어, 잘못 읽은 숫자인지 잘못 배치한 항목인지를 단계별로 확인할 수 있습니다. 한 번 정한 추출 항목(스키마)은 다음 도면에도 그대로 적용되므로 부품이 바뀔 때마다 양식을 새로 설명할 필요가 없습니다.", "difficulty": "입문"}, {"uid": "U064", "i": 63, "no": 215, "pattern": "생성", "industry": "제조·건설", "dept": ["품질·생산"], "task": "고객사별 실린더 작업표로 COA 발행 자료를 모은다", "title": "가스 용기 작업표로 품질증명 자료 모으기", "oneliner": "제각각인 작업표에서 품질 증명서 자료를 모읍니다", "story": "산업용 가스를 다루는 회사의 품질 담당자는 고객사별 실린더(가스 용기) 작업표를 모아 COA(품질 증명서)를 발행할 자료를 만듭니다. 고객사마다 작업표 양식이 달라 같은 항목도 위치가 제각각이고, 다른 Lot(같이 처리한 용기 묶음)의 내역이 섞이거나 충전 기록이 빠지는 일이 생깁니다. 워크플로우는 양식이 달라도 필요한 항목을 찾아 Lot별로 모으고, 빈칸이나 불일치를 보완 요청 목록으로 정리해 줍니다.", "terms": [{"term": "실린더", "desc": "가스를 담는 금속 용기입니다. 비우면 회수해 다시 채워 씁니다."}, {"term": "COA(품질 증명서)", "desc": "제품이 품질 기준을 만족한다는 시험 결과를 담아 고객에게 주는 증명서입니다."}, {"term": "Lot 번호", "desc": "같은 조건으로 함께 처리한 제품 묶음에 붙는 번호입니다."}, {"term": "회수·충전", "desc": "다 쓴 용기를 거둬 오는 것이 회수, 그 용기에 가스를 다시 채우는 것이 충전입니다."}], "docs": [{"name": "고객사별 실린더 작업표(양식 다름)", "desc": "입고일, Lot 번호, 회수·충전 내역, 작업 내용을 봅니다."}, {"name": "COA 발행용 자료표", "desc": "증명서에 들어갈 항목 목록입니다. 무엇이 채워졌고 무엇이 비었는지 봅니다."}], "fields": ["고객사", "입고일", "Lot 번호", "회수 내역", "충전 내역", "작업 내용"], "key": "Lot 번호: 여러 작업표의 기록을 같은 용기 묶음으로 모으는 값", "check": "양식이 다른 작업표에서 모은 항목을 발행 자료표와 비교해 빈칸이나 서로 다른 값을 판정합니다.", "exceptions": ["Lot A 작업표에 Lot B 용기의 충전 기록 한 줄이 섞여 있음", "고객사 X는 Lot 번호가 맨 위, 고객사 Y는 표 오른쪽 아래에 있음", "회수 기록은 있는데 충전 기록이 빠짐"], "output": "Lot별 COA 발행 자료와 보완 요청 항목", "steps": [{"node": "Parse", "what": "고객사별 작업표와 발행 자료표를 글자와 표로 읽습니다"}, {"node": "Classify", "what": "작업표를 고객사 양식별로 나눕니다"}, {"node": "Extract ×2", "what": "양식마다 위치가 다른 입고일, Lot 번호, 회수·충전 내역, 작업 내용을 뽑습니다"}, {"node": "Merge", "what": "뽑은 기록을 Lot 번호별로 합칩니다"}, {"node": "Validate", "what": "항목이 다 차면 초록, 확인이 필요하면 노랑, 다른 Lot 섞임이나 충전 누락이면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "고객사에 보낼 보완 요청 내용을 문장으로 씁니다"}, {"node": "Export", "what": "Lot별 COA 발행 자료를 저장합니다"}], "problem": "고객사가 수십 곳이면 작업표 양식도 수십 가지이고, 담당자는 양식마다 어디에 Lot 번호가 있고 어디에 충전 내역이 있는지 외워 두었다가 찾아 옮깁니다. 새 고객사가 생기거나 기존 고객사가 양식을 바꾸면 익히는 일을 처음부터 다시 합니다. 잘못된 자료로 COA가 나가면 고객사의 공정에 영향을 주고, 문제가 생겼을 때 어느 용기를 어떤 조건으로 처리했는지 추적할 수 없게 됩니다.", "why": "고객사마다 양식이 달라도 Studio는 양식을 미리 등록하지 않고 '입고일', 'Lot 번호', '충전 내역'처럼 항목 설명만으로 값을 찾아 읽으므로, 새 양식이 들어와도 워크플로우를 고칠 필요가 없습니다. 그다음 Lot 번호별로 기록을 모아(Merge) 발행 자료표와 견주면 회수는 있는데 충전이 없는 Lot이 빈칸으로 바로 드러나고, 다른 Lot의 줄이 섞인 것도 값이 달라 눈에 띕니다.", "difficulty": "입문"}, {"uid": "U065", "i": 64, "no": 38, "pattern": "대조", "industry": "제조·건설", "dept": ["품질·생산"], "task": "라벨, 명판, 거래명세서의 시리얼과 모델명을 맞춘다", "title": "라벨·명판·명세서 시리얼 맞추기", "oneliner": "세 곳의 모델명과 시리얼 번호가 같은지 확인합니다", "story": "제조 회사의 입고 검사 담당자는 납품된 제품의 박스 라벨, 제품 몸체에 붙은 명판, 그리고 거래명세서(무엇을 몇 개 보냈는지 적은 거래 서류)가 서로 같은 제품을 가리키는지 확인합니다. 시리얼 번호는 길고 0과 O, 1과 I처럼 헷갈리는 글자가 많으며, 사진 속 각인이 닳아 잘 안 보이기도 합니다. 사람이 눈으로 비교하면 끝자리 한 글자 차이를 놓치기 쉽습니다. 워크플로우는 사진과 서류에서 모델명과 시리얼을 읽어 맞춰 보고, 다른 건과 직접 다시 봐야 할 건을 골라 줍니다.", "terms": [{"term": "명판", "desc": "제품 몸체에 붙거나 새겨진 금속·스티커 판입니다. 모델명, 시리얼 번호, 제조사 등이 적혀 있습니다."}, {"term": "시리얼 번호", "desc": "제품 한 대 한 대에 붙는 고유 번호입니다. 사람의 주민등록번호처럼 같은 번호가 없습니다."}, {"term": "LOT 번호", "desc": "같은 날, 같은 조건으로 함께 만든 제품 묶음에 붙이는 번호입니다. 문제가 생기면 이 번호로 같은 묶음을 찾습니다."}, {"term": "거래명세서", "desc": "판매자가 물건과 함께 보내는 서류로, 품목, 수량, 금액이 적혀 있습니다."}], "docs": [{"name": "박스 라벨 사진", "desc": "포장 상자에 붙은 라벨입니다. 모델명, 시리얼, 수량, LOT 번호를 봅니다."}, {"name": "제품 명판 사진", "desc": "제품 자체에 붙은 명판입니다. 실제 모델명과 시리얼을 봅니다."}, {"name": "거래명세서", "desc": "공급사가 보낸 서류입니다. 납품했다고 적은 모델명, 시리얼, 수량을 봅니다."}], "fields": ["모델명", "시리얼 번호", "수량", "LOT 번호", "공급사"], "key": "시리얼 번호: 제품마다 하나뿐이라 세 문서를 같은 제품끼리 잇는 값", "check": "같은 시리얼 번호에 대해 라벨, 명판, 거래명세서의 모델명과 시리얼 표기가 모두 같은지 판정합니다.", "exceptions": ["시리얼은 세 곳 모두 같은데 명판 모델명만 끝자리가 A가 아닌 B로 다름", "라벨에는 SN10O5, 명세서에는 SN1005로 숫자 0과 영문 O가 섞임", "명판 각인이 닳아 마지막 두 자리를 확신할 수 없음"], "output": "품목별 일치/불일치 표와 실물 확인이 필요한 건 목록", "steps": [{"node": "Parse", "what": "라벨·명판 사진과 거래명세서를 글자로 읽습니다"}, {"node": "Classify", "what": "읽은 문서를 박스 라벨, 제품 명판, 거래명세서로 나눕니다"}, {"node": "Extract ×3", "what": "문서 종류마다 모델명, 시리얼, 수량, LOT 번호를 뽑습니다"}, {"node": "Merge", "what": "세 문서의 결과를 한 표로 합칩니다"}, {"node": "Match", "what": "시리얼 번호가 같은 행끼리 짝을 맞춥니다"}, {"node": "Validate", "what": "모두 같으면 초록, 읽기 확신이 낮으면 노랑, 서로 다르면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "헷갈리는 글자나 닳은 각인처럼 사람이 실물을 봐야 하는 이유를 문장으로 적습니다"}], "problem": "납품 한 번에 제품이 수십 대에서 수백 대 들어오고, 대마다 라벨, 명판, 거래명세서 세 곳을 봐야 하므로 확인 횟수가 제품 수의 세 배로 늘어납니다. 바쁜 입고 시간에 번호를 하나씩 읽으며 맞추다 보면 뒤로 갈수록 집중력이 떨어집니다. 시리얼이 다른 제품이 그대로 창고에 들어가면 나중에 보증 처리나 리콜(문제 제품을 거두어들이는 일) 때 어느 제품이 어디로 갔는지 추적이 끊깁니다.", "why": "번호 대조는 같다, 다르다를 기계적으로 가리는 일이지만, 0과 O처럼 읽기 자체가 불확실한 경우까지 같은 잣대로 처리하면 안 됩니다. Studio는 규칙 검사(Validate)와 맥락 판단(Instruct)을 나누어, 확실히 다른 건은 바로 표시하고 읽기 확신이 낮은 건은 추측하지 않고 '실물 확인 필요'로 사람에게 넘깁니다. 세 문서를 시리얼 번호로 한 행에 묶기(Match) 때문에 어느 한 곳에만 없는 제품도 빈칸으로 바로 드러납니다.", "difficulty": "중급"}, {"uid": "U066", "i": 65, "no": 41, "pattern": "대조", "industry": "제조·건설", "dept": ["구매·조달"], "task": "협력사 견적서를 모아 비교표를 만든다", "title": "협력사 견적서 같은 조건으로 비교", "oneliner": "조건이 제각각인 견적을 같은 기준으로 맞춰 비교합니다", "story": "제조·건설 회사의 구매 담당자는 여러 협력사(함께 일하는 공급 업체)에서 받은 견적서를 모아 어디가 가장 유리한지 비교표를 만듭니다. 그런데 어떤 곳은 개당 가격, 어떤 곳은 상자 가격으로 적고, 운반비나 부가세 포함 여부도 제각각이라 숫자만 보고 비교하면 판단이 틀어집니다. 워크플로우는 견적요청서의 규격과 수량을 기준으로 각 견적을 같은 조건의 금액으로 맞추고, 확인이 필요한 조건을 따로 정리해 줍니다.", "terms": [{"term": "협력사", "desc": "부품이나 자재를 공급하거나 일부 작업을 맡는 거래 업체입니다."}, {"term": "견적요청서", "desc": "사려는 물건의 규격, 수량, 납기를 적어 업체에 가격을 물어보는 문서입니다."}, {"term": "납기", "desc": "물건을 언제까지 보내 주기로 했는지 정한 날짜입니다."}, {"term": "부가세", "desc": "물건값에 붙는 세금으로, 보통 공급가의 10%입니다. 포함 가격인지 별도인지에 따라 금액이 달라 보입니다."}], "docs": [{"name": "견적요청서", "desc": "우리가 요청한 품목, 규격, 수량, 납기 기준을 봅니다."}, {"name": "협력사 견적서(업체별)", "desc": "업체마다 낸 단가, 총액, 운반비, 결제 조건을 봅니다."}, {"name": "수정 견적서", "desc": "업체가 다시 낸 견적입니다. 처음 견적에서 바뀐 값을 봅니다."}, {"name": "견적 비교표", "desc": "업체별 금액을 나란히 정리할 결과 표입니다."}], "fields": ["품목과 규격", "수량과 포장 단위", "단가와 총액", "부가세·운반비 포함 여부", "납기", "결제 조건"], "key": "품목명과 규격: 업체마다 다른 견적서에서 같은 물건을 찾아 잇는 값", "check": "업체별 견적을 견적요청서의 규격과 수량 기준으로 환산해 같은 조건의 금액으로 비교합니다.", "exceptions": ["A사는 개당 1,000원, B사는 10개들이 상자당 9,500원으로 표기", "한 업체만 운반비 '별도'라고 적어 총액이 싸 보임", "요청한 규격 대신 비슷한 대체 규격으로 견적을 냄"], "output": "같은 조건으로 맞춘 견적 비교표와 확인 필요 조건 목록", "steps": [{"node": "Parse", "what": "견적요청서와 업체별 견적서를 글자와 표로 읽습니다"}, {"node": "Extract ×2", "what": "견적요청서에서는 기준 규격과 수량을, 견적서에서는 단가, 운반비, 납기, 결제 조건을 뽑습니다"}, {"node": "Merge", "what": "업체별 견적을 하나의 비교표로 모으고 수정 견적은 최신 값으로 바꿉니다"}, {"node": "Match", "what": "품목명과 규격으로 요청 품목과 견적 품목을 짝지어 줍니다"}, {"node": "Validate", "what": "조건이 같으면 초록, 운반비 별도처럼 확인이 필요하면 노랑, 규격이 다르면 빨강으로 판정합니다"}, {"node": "Instruct", "what": "포장 단위와 포함 조건을 맞춘 환산 금액을
